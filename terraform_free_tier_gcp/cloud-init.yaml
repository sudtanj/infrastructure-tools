#cloud-config
# Container-Optimized OS (COS) Cloud-Init for Docker Compose & Portainer

write_files:
  # 1. Standalone Docker Compose runner script (uses official docker/compose container)
  - path: /var/lib/docker-compose/docker-compose
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/sh
      exec docker run --rm -it \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$PWD:$PWD" \
        -w "$PWD" \
        docker/compose:1.29.2 "$@"

  # 2. Portainer Docker Compose configuration file
  - path: /var/lib/portainer/docker-compose.yml
    permissions: "0644"
    owner: root:root
    content: |
      version: '3.8'
      services:
        portainer:
          image: portainer/portainer-ce:latest
          container_name: portainer
          restart: always
          ports:
            - "9000:9000"
            - "9443:9443"
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

      volumes:
        portainer_data:

  # 3. Systemd service to auto-start Portainer on boot via docker-compose
  - path: /etc/systemd/system/portainer.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Portainer Docker Compose Service
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/var/lib/portainer
      ExecStart=/usr/local/bin/docker-compose up -d
      ExecStop=/usr/local/bin/docker-compose down

      [Install]
      WantedBy=multi-user.target

runcmd:
  # 1. Symlink docker-compose wrapper script to global PATH
  - ln -sf /var/lib/docker-compose/docker-compose /usr/local/bin/docker-compose

  # 2. Enable and start the Portainer systemd service
  - systemctl daemon-reload
  - systemctl enable portainer.service
  - systemctl start portainer.service