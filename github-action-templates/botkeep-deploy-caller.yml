# Copy to <your-project>/.github/workflows/deploy.yml
# Requires repo secret BOTKEEP_API_KEY (scopes: workloads:read, workloads:create,
# deploy:write, settings:read). The workload is found by name and created if missing.
name: Deploy to Botkeep

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Pin a tag or SHA instead of @main for stability.
    uses: sudtanj/infrastructure-tools/.github/workflows/botkeep-deploy.yml@main
    with:
      # name: my-app           # default: basename of `directory`, else the repo name
      # directory: my-folder   # with mode: folder, sync only this repo folder
      # method: upload        # upload only the files in `directory` (default: sync the whole repo)
      # access: connection     # private repos (needs GitHub connection linked in Botkeep)
      # Settings used only when the workload is created:
      runtime: nodejs
      runtime_version: "22"
      start_command: npm install --no-audit --no-fund && npm start
      memory_mb: 512
      cpu_percent: 50
      storage_mb: 1024
    secrets:
      BOTKEEP_API_KEY: ${{ secrets.BOTKEEP_API_KEY }}
