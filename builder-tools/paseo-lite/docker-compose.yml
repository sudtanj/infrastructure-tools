services:
  paseo-lite:
    build: .
    image: paseo-lite
    restart: unless-stopped
    # Sized for a GCP free-tier e2-micro (1 GB RAM, shared 0.25 vCPU). The
    # daemon itself needs a few MB; the budget is for the agent CLIs it runs.
    # Hard cap below host RAM so the kernel OOM-kills this container, not sshd.
    # Pair with the host swapfile from scripts/gcp-free-tier-setup.sh.
    mem_limit: 800m
    memswap_limit: 2g
    cpus: 1.0
    init: false  # the image's entrypoint already runs under tini
    # Keep Docker's json logs from filling the 30 GB free-tier disk.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # Host networking instead of a published port (works on IPv6-only hosts
    # where Docker's bridge only NATs IPv4). `ports:` is incompatible with
    # host mode; the daemon binds directly to the host's PASEO_LISTEN port.
    network_mode: host
    # IPv6-only egress? GitHub has no AAAA records - uncomment to use
    # Cloudflare's DNS64 resolvers (harmless to leave commented otherwise):
    # dns:
    #   - 2606:4700:4700::64
    #   - 2606:4700:4700::6400
    volumes:
      # Persistent daemon state and agent credentials/config (~/.claude,
      # ~/.codex, paseo-lite's own ~/.paseo-lite state incl. pairing key).
      - paseo-home:/home/paseo
      # Code visible to the Claude Code/Codex sessions paseo-lite launches -
      # mounts the current directory (wherever you run `docker compose` from).
      - .:/workspace
    # ALL configuration lives directly in this file - no .env / env_file is
    # used. Uncomment and fill in what you need below, then
    # `docker compose up -d` to apply (no image rebuild needed for config).
    environment:
      # --- Low-resource defaults (free-tier VM) ---
      PASEO_RELAY_ENABLED: "true"           # keep relay on (set false if using Tailscale)
      PASEO_LOG_CONSOLE_LEVEL: warn
      # Accepted for parity with paseo-codex; paseo-lite logs to stdout only
      # (Docker's json-file rotation below), so these have no effect.
      PASEO_LOG_FILE_LEVEL: info
      PASEO_LOG_FILE_ROTATE_SIZE: 5m
      PASEO_LOG_FILE_ROTATE_COUNT: "2"
      # --- Paseo itself ----------------------------------------------------
      # Strongly recommended for anything network-reachable - without it,
      # the daemon accepts unauthenticated control connections from anyone
      # who can reach it. (Relay clients are authenticated by the E2EE
      # pairing key instead.)
      # PASEO_PASSWORD: change-me
      # 6768, not upstream Paseo's 6767, so it never collides with a
      # paseo-codex / Paseo daemon already bound to 6767 on this host.
      PASEO_LISTEN: 0.0.0.0:6768
      # PASEO_HOSTNAMES: paseo.example.com,.lan

      # --- paseo-lite process sharing (optional, defaults shown) ------------
      # Max concurrent claude processes across ALL projects; extra prompts
      # wait for a slot. Idle ones are released after PASEO_CLAUDE_IDLE_SECS.
      # PASEO_CLAUDE_MAX_LIVE: "3"
      # PASEO_CLAUDE_IDLE_SECS: "90"
      # One shared codex app-server serves every project; it exits after
      # this many idle seconds and restarts on the next prompt.
      # PASEO_CODEX_IDLE_SECS: "300"

      # --- Claude Code -----------------------------------------------------
      # Read natively by Claude Code from the environment on every launch -
      # no config file is generated, and paseo-lite passes them straight
      # through to the sessions it launches (like OPENAI_API_KEY for Codex).
      #
      # AUTH OPTION 1 - subscription (Pro/Max), the default here: leave
      # ANTHROPIC_API_KEY unset and instead either run `claude /login` once
      # inside the container (OAuth credentials persist in the paseo-home
      # volume) ...
      # ANTHROPIC_API_KEY: sk-ant-...   <- API-key billing only; leave unset for subscription
      # ... or generate a token with `claude setup-token` on your own
      # machine and set it here - charges your subscription, not usage:
      # CLAUDE_CODE_OAUTH_TOKEN: ...
      #
      # AUTH OPTION 2 - Claude Code BYOK: point at your own
      # Anthropic-API-compatible endpoint instead of api.anthropic.com.
      # ANTHROPIC_AUTH_TOKEN is sent as an Authorization: Bearer header
      # instead of x-api-key - for gateways that want a bearer token.
      # ANTHROPIC_BASE_URL: https://my-gateway.internal
      # ANTHROPIC_AUTH_TOKEN: ...
      # Optional default model, e.g. claude-sonnet-4-5 (unset = Claude
      # Code's own built-in default).
      # ANTHROPIC_MODEL: claude-sonnet-4-5

      # --- Codex -----------------------------------------------------------
      # OPENAI_API_KEY: sk-...
      # Codex BYOK (note: Codex CLI only speaks the Responses API
      # /v1/responses, not Chat Completions - the endpoint has to support it):
      # CODEX_BASE_URL: https://my-gateway.internal/v1
      # CODEX_API_KEY: sk-...
      # CODEX_MODEL: gpt-5

      # --- GitHub CLI (gh) --------------------------------------------------
      # Clones/pulls private repos into /workspace - wired up for both `gh`
      # and plain `git` automatically at container start.
      # GH_TOKEN: ghp_...
      TERM: xterm-256color

volumes:
  paseo-home:
