// /etc/apt/apt.conf.d/52opi-unattended-upgrades
// Debian security updates only; Docker, Armbian kernel and board packages are updated by hand
// (or by flashing a newer image). Never reboots on its own.
// The packaged 50unattended-upgrades also allows regular Debian updates; drop its list first
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
	"origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::MinimalSteps "true";
