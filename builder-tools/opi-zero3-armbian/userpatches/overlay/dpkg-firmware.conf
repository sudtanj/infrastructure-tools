# /etc/dpkg/dpkg.cfg.d/91opi-firmware
# armbian-firmware is shared by every Armbian board. Firmware for hardware the Orange Pi Zero 3
# (Allwinner H618, no PCIe, onboard UWE5622 Wi-Fi) can't have is skipped, now and on every
# upgrade. Firmware for USB Wi-Fi/Bluetooth dongles stays.
# Qualcomm SoCs (Snapdragon GPU/DSP/modem, ADSP)
path-exclude=/lib/firmware/qcom/*
path-exclude=/usr/lib/firmware/qcom/*
path-exclude=/lib/firmware/adsp.*
path-exclude=/usr/lib/firmware/adsp.*
# PCIe-only Wi-Fi: Qualcomm ath11k/ath12k, Intel iwlwifi
path-exclude=/lib/firmware/ath11k/*
path-exclude=/usr/lib/firmware/ath11k/*
path-exclude=/lib/firmware/ath12k/*
path-exclude=/usr/lib/firmware/ath12k/*
path-exclude=/lib/firmware/iwlwifi-*
path-exclude=/usr/lib/firmware/iwlwifi-*
# Onboard Wi-Fi modules of Rockchip boards
path-exclude=/lib/firmware/rkwifi/*
path-exclude=/usr/lib/firmware/rkwifi/*
