# /etc/modprobe.d/opi-blacklist.conf
# Bluetooth (the Zero 3's UWE5622 combo chip) is unused on a Docker host. "install" also stops
# the explicit load from /etc/modules, which "blacklist" alone does not. /bin/true, so that load
# reports success instead of failing systemd-modules-load.service on every boot.
install sprdbt_tty /bin/true
install bluetooth /bin/true
# Rarely used network protocols with a history of kernel bugs
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
