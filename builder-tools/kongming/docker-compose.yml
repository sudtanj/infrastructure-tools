# Local build: docker compose up -d --build
services:
  kongming:
    build:
      context: .
      args:
        KONGMING_REF: ""   # tag/branch/commit of sudtanj/kongming, empty = main
    container_name: kongming
    restart: unless-stopped
    ports:
      - "18800:18800"
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2m,uid=65532,gid=65532,mode=0700
