# Local build: docker compose up -d --build
services:
  kongming:
    build:
      context: .
      args:
        KONGMING_REF: ""   # tag/branch/commit of sudtanj/kongming, empty = main
    container_name: kongming
    restart: unless-stopped
    # Shares the host network: listens on port 18800 of every host interface, and
    # the agents' shell reaches what the host reaches (loopback, LAN, tailnet).
    network_mode: host
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 1.0
    pids_limit: 64
    ipc: none
