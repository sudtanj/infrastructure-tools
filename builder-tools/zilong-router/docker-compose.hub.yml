# Published image: docker compose -f docker-compose.hub.yml up -d
# Dashboard: http://<host>:20129/dashboard   API: http://<host>:20129/v1
services:
  zilong-router:
    image: sudtanj/zilong-router:latest
    container_name: zilong-router
    restart: unless-stopped
    ports:
      # Loopback only. Use "<tailscale-ip>:20129:20128" to reach it remotely.
      - "127.0.0.1:20129:20128"
    env_file: .env
    environment:
      ZILONG_ROUTER_WORKERS: "1"
      LOG_LEVEL: warn
    volumes:
      - zilong-router-data:/data
      # Stable machine id: API keys embed it, like 9router.
      - /etc/machine-id:/etc/machine-id:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "1" }

volumes:
  zilong-router-data:
