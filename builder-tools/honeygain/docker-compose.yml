# Honeygain on distroless, built locally from the Dockerfile here.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# Use docker-compose.hub.yml to pull the published image instead.

services:
  honeygain:
    build:
      context: .
      args:
        HONEYGAIN_VERSION: "0.9.0"
    image: honeygain-distroless
    restart: unless-stopped
    # Fixed hostname so the container identity is stable too; Docker's
    # default is the random container ID, which changes on every recreate.
    hostname: ${HG_DEVICE:-honeygain}

    # AdGuard Family Protection only: blocks known malware, phishing and adult
    # domains. init-honeygain.sh also firewalls every other resolver; compose
    # cannot, so this alone does not stop a client that ignores resolv.conf.
    dns:
      - 94.140.14.15 # AdGuard Family Protection IPv4 (Primary)
      - 94.140.14.16 # AdGuard Family Protection IPv4

    # Compose fills these in from .env before the container starts, so the
    # distroless image needs no shell. -tou-accept is always passed.
    command:
      - -tou-accept
      - -email
      - ${HG_EMAIL:?set HG_EMAIL in .env}
      - -pass
      - ${HG_PASSWORD:?set HG_PASSWORD in .env}
      - -device
      - ${HG_DEVICE:-honeygain}

    volumes:
      # Device state, so a recreate is the same device, not a new one.
      - honeygain-data:/home/nonroot

    # Hard limits, kept as small as Honeygain runs in: no swap, low CPU
    # priority, and the first container the kernel kills under memory pressure.
    cpus: 0.25
    cpu_shares: 256
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: 500
    pids_limit: 64

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Small rotated logs, to spare an SD card.
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  honeygain-data:
