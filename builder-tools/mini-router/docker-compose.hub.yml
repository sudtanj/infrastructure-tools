# Published image: docker compose -f docker-compose.hub.yml up -d
# Dashboard: http://<host>:20128/dashboard   API: http://<host>:20128/v1
services:
  mini-router:
    image: sudtanj/mini-router:latest
    container_name: mini-router
    restart: unless-stopped
    ports:
      - "20128:20128"
    env_file: .env
    environment:
      MINI_ROUTER_WORKERS: "1"
      LOG_LEVEL: warn
    volumes:
      - mini-router-data:/data
      # Stable machine id: API keys embed it, like 9router.
      - /etc/machine-id:/etc/machine-id:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "1" }

volumes:
  mini-router-data:
