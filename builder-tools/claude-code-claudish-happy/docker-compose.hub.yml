services:
  agent:
    # Pulls the published image from Docker Hub instead of building
    # locally - use this if you just want to run the CLIs and don't need
    # this repo's source at all. Pin an exact version instead of :latest
    # if you want reproducible pulls (see the auto-bumped tags at
    # https://hub.docker.com/r/sudtanj/claude-code-claudish-happy/tags).
    image: sudtanj/claude-code-claudish-happy:latest
    pull_policy: always
    # Default command runs Claude Code (via Happy) in the background inside
    # a detached tmux session and keeps the container itself running
    # indefinitely (restart: unless-stopped below) - so `docker compose up
    # -d` alone gives you a persistent session you connect to later from
    # the Happy app, no separate service needed. Override the command for
    # one-off interactive use instead, e.g.:
    #   docker compose -f docker-compose.hub.yml run --rm agent claude
    #   docker compose -f docker-compose.hub.yml run --rm agent codex
    #   docker compose -f docker-compose.hub.yml run --rm agent happy claude
    #   docker compose -f docker-compose.hub.yml run --rm agent happy codex
    #   docker compose -f docker-compose.hub.yml run --rm agent bash
    # Want Codex (BYOK any OpenAI-Responses-API-compatible endpoint)
    # running in the BACKGROUND instead of plain Claude Code/Anthropic?
    # Change this line to (and set CODEX_BASE_URL/CODEX_API_KEY below):
    #   command: ["background", "happy", "codex"]
    command: ["background", "happy", "claude"]
    restart: unless-stopped
    # No stdin_open/tty here on purpose: `docker compose run` already
    # allocates a pty itself when invoked from a real terminal, and NOT
    # hardcoding it here means this file stays deployable as-is by
    # orchestrators that never attach a terminal at all (Portainer, `docker
    # compose up -d`, etc.) - it simply runs headless there instead of
    # erroring on an interactive requirement it can't satisfy.
    volumes:
      # Mounts the current directory (wherever you run `docker compose`
      # from) as the workspace - point this at your actual project.
      - .:/workspace
      # Persist each CLI's local config/auth across container restarts.
      - claude-config:/home/agent/.claude
      - codex-config:/home/agent/.codex
      - happy-config:/home/agent/.happy
    env_file:
      # Copy .env.example (see the repo, or write your own from the
      # README's env var tables) to .env and fill in the keys the CLI
      # you're running actually needs - the entrypoint checks for them and
      # will fail fast with a clear message if a required one is missing.
      - .env
    environment:
      # Uncomment/override any of these here instead of (or on top of) .env:
      # ANTHROPIC_API_KEY: sk-ant-...
      # OPENAI_API_KEY: sk-...
      # Codex BYOK: point it at any OpenAI-Responses-API-compatible
      # endpoint instead of api.openai.com. CODEX_API_KEY is optional (a
      # local/trusted gateway needs no key at all). Note: Codex CLI only
      # speaks the newer Responses API (/v1/responses), not the more
      # common Chat Completions format - your endpoint has to support it.
      # CODEX_BASE_URL: https://my-gateway.internal/v1
      # CODEX_API_KEY: sk-...
      # CODEX_MODEL: gpt-5
      # Happy needs no key to START: if unpaired, the entrypoint runs
      # pairing itself (QR code/link) before Claude Code/Codex start,
      # then prints a HAPPY_CREDENTIALS_B64 value and exits instead of
      # starting a real session nobody can reach - paste that here and
      # restart (see the repo's README.md). Pair once via
      # `docker compose -f docker-compose.hub.yml run --rm agent happy claude`
      # (needs a real terminal) BEFORE relying on `docker compose up -d`'s
      # background default, which has nowhere to show you the pairing
      # QR/link.
      # HAPPY_CREDENTIALS_B64: ...
      # Only set these if self-hosting Happy's own server:
      # HAPPY_SERVER_URL: https://your-happy-server.internal
      # HAPPY_WEBAPP_URL: https://your-happy-webapp.internal
      TERM: xterm-256color

volumes:
  claude-config:
  codex-config:
  happy-config:
