name: "Deploy paseo-lite on Instabox"

# Runs bash-scripts/init-paseo-lite.sh on an Instabox machine (https://instabox.sh), the same way
# gcp-bash-script-runner.yaml runs it on the GCP VM: same script, same secrets (CODEX_*, GH_TOKEN,
# GH_USERNAME, GH_EMAIL, ANTHROPIC_*, CLAUDE_CODE_*), so Claude Code and Codex are set up identically.
#
# Required secret: INSTABOX_API_KEY (ibk_..., dashboard Account page or `instabox keys create`).
# Optional repo variables:
#   INSTABOX_MACHINE_NAME  machine to use or create (default paseo-lite)
#
# Instabox pauses a machine after 30 idle minutes unless your account has "manual lifecycle"
# (an Instabox admin setting). A paused machine keeps its memory and processes, but does not answer
# the Paseo relay. Two modes:
#   on-demand (default): Instabox reserves 6768 (desktop/Orca control port), so a small socat
#     container forwards port 16768 (repo variable INSTABOX_PUBLIC_PORT) to the daemon's 6768, and
#     16768 is published as an Instabox public URL (Paseo direct connection and pairing page).
#     The idle pause stays on, so the machine sleeps when you stop using it. Traffic to the URL
#     does NOT wake it (Instabox answers "Sandbox offline. Its owner must start it"): wake it with
#     this workflow's "wake" mode (also from the GitHub mobile app), `instabox start <machine>`, or
#     the Instabox dashboard. It resumes with the daemon still running.
#     The URL is public, so PASEO_PASSWORD is required.
#     The URL is never logged: run `instabox port ls <machine>` yourself to see it.
#   wake: only starts the paused machine and restarts its idle timer, no redeploy.
#   always-on: unpublishes the port and asks for no idle pause (`auto-suspend 0`), honoured only
#     with manual lifecycle. Without it, uncomment the schedule below for a best-effort keep-alive:
#     a no-op command every 20 minutes (GitHub may delay scheduled runs).
#   destroy: deletes the machine (disk, workspace, agent logins and all) and every other machine
#     this workflow created (metadata app=paseo-lite). Type the machine name in confirm_destroy.
#     Not undoable. Your Instabox API keys and snapshots are left alone.
#
# github_runner (default on): also runs bash-scripts/upsert-github-runner.sh here, the ephemeral
#   GitHub runner for the private repo (builder-tools/github-runner). It uses PRIVATE_REPO and
#   PRIVATE_REPO_TOKEN (needs Administration: RW on that repo too) unless GH_RUNNER_REPO and a
#   GitHub App / GH_RUNNER_PAT are set. Whenever the machine is online again it reconnects by
#   itself. Optional repo variables: INSTABOX_RUNNER_LABELS (default self-hosted,linux,x64,instabox),
#   INSTABOX_RUNNER_CPUS / _MEMORY / _WORK_SIZE (default 2 / 4g / 3g).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "wake: just start the paused machine. on-demand: deploy, sleep when idle. always-on: deploy, never pause. destroy: delete the machines"
        required: false
        default: "on-demand"
        type: choice
        options:
          - on-demand
          - wake
          - always-on
          - destroy
      confirm_destroy:
        description: "destroy only: type the machine name to confirm (e.g. paseo-lite)"
        required: false
        default: ""
        type: string
      machine_name:
        description: "Instabox machine name (blank: repo variable INSTABOX_MACHINE_NAME, else paseo-lite)"
        required: false
        default: ""
        type: string
      template:
        description: "Template for a new machine (ignored when it already exists)"
        required: false
        default: "universal"
        type: choice
        options:
          - universal
          - agent-browser
          - herdr
          - orca
      github_runner:
        description: "Also run the ephemeral GitHub runner for the private repo on this machine (bash-scripts/upsert-github-runner.sh)"
        required: false
        default: true
        type: boolean
      debug:
        description: "Show safe debug output (all output is sanitized: no secrets, IPs, emails or hostnames)"
        required: false
        default: true
        type: boolean
  # schedule:
  #   - cron: "*/20 * * * *"

permissions:
  contents: read

env:
  INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
  INSTABOX_API_URL: https://api.instabox.sh
  MACHINE_NAME: ${{ inputs.machine_name || vars.INSTABOX_MACHINE_NAME || 'paseo-lite' }}

jobs:
  keepalive:
    name: "Wake / keep-alive"
    if: github.event_name == 'schedule' || inputs.mode == 'wake'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install instabox CLI
        run: |
          set -euo pipefail
          export INSTABOX_INSTALL_DIR="$HOME/.local/bin"
          curl -fsSL https://instabox.sh/install.sh | sh >/dev/null
          echo "$INSTABOX_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Touch the machine
        run: |
          set -euo pipefail
          [ -n "${INSTABOX_API_KEY:-}" ] || { echo "::error::Missing secret: INSTABOX_API_KEY"; exit 1; }
          state=$(instabox get "$MACHINE_NAME" --json 2>/dev/null | jq -r '.state // "unknown"' || echo unknown)
          echo "[*] state: ${state}"
          # start resumes a paused machine, or boots it fresh when its memory cannot be restored.
          case "$state" in
            suspended|stopped|error) instabox start "$MACHINE_NAME" ;;
          esac
          # A command also wakes a machine paused for being idle, and resets its idle timer.
          instabox exec "$MACHINE_NAME" --timeout 60 -- true
          echo "[+] machine is up; it pauses again after 30 idle minutes"

  destroy:
    name: "Destroy"
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: instabox-paseo-lite-${{ inputs.machine_name || vars.INSTABOX_MACHINE_NAME || 'paseo-lite' }}
      cancel-in-progress: false
    # Same approval gate as a deploy.
    environment:
      name: "approve-instabox-paseo-lite"
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          [ -n "${INSTABOX_API_KEY:-}" ] || { echo "::error::Missing secret: INSTABOX_API_KEY"; exit 1; }
          if [ "$CONFIRM" != "$MACHINE_NAME" ]; then
            echo "::error::confirm_destroy must be the machine name (${MACHINE_NAME}); nothing was deleted"
            exit 1
          fi
          echo "[*] confirmed: destroying ${MACHINE_NAME} and every machine with app=paseo-lite"

      - name: Install instabox CLI
        run: |
          set -euo pipefail
          export INSTABOX_INSTALL_DIR="$HOME/.local/bin"
          curl -fsSL https://instabox.sh/install.sh | sh >/dev/null
          echo "$INSTABOX_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Delete the machines
        env:
          PUBLIC_PORT: ${{ vars.INSTABOX_PUBLIC_PORT || '16768' }}
        run: |
          set -euo pipefail
          # The named machine, plus any other this workflow created (it tags them app=paseo-lite).
          tagged=$(instabox ls --meta app=paseo-lite --json 2>/dev/null \
            | jq -r '(if type == "array" then . else (.machines // .sandboxes // .items // []) end)[] | .name // .id // empty' || true)
          targets=$(printf '%s\n%s\n' "$MACHINE_NAME" "$tagged" | awk 'NF && !seen[$0]++')
          failed=0
          while IFS= read -r m; do
            if ! instabox get "$m" --json >/dev/null 2>&1; then
              echo "[*] ${m}: not found (already gone)"
              continue
            fi
            # Close the public URL first, so nothing can reach the machine while it is deleted.
            instabox port unpublish "$m" "$PUBLIC_PORT" >/dev/null 2>&1 || true
            if err=$(instabox rm "$m" 2>&1 >/dev/null); then
              echo "[+] ${m}: deleted"
            else
              echo "::error::${m}: could not delete: ${err}"
              failed=1
            fi
          done <<< "$targets"
          # Names only: the plain listing could show addresses, and this log is public.
          left=$(instabox ls --meta app=paseo-lite --json 2>/dev/null \
            | jq -r '(if type == "array" then . else (.machines // .sandboxes // .items // []) end)[] | .name // .id // empty' \
            | paste -sd' ' - || true)
          echo "[*] machines with app=paseo-lite left: ${left:-none}"
          # Anything else left on the account (names and counts only), so leftovers are visible.
          names='(if type == "array" then . else (.machines // .sandboxes // .snapshots // .images // .ports // .items // []) end)[]? | (.name // .id // empty)'
          echo "[*] account after destroy:"
          echo "    machines:  $(instabox ls --json 2>/dev/null | jq -r "$names" 2>/dev/null | paste -sd' ' - || true)"
          echo "    ports:     $(instabox port ls --json 2>/dev/null | jq -r 'if type == "array" then length else (.ports // .items // []) | length end' 2>/dev/null || echo '?')"
          echo "    snapshots: $(instabox snapshot ls --json 2>/dev/null | jq -r "$names" 2>/dev/null | paste -sd' ' - || true)"
          echo "    vault:     $(instabox vault ls --json 2>/dev/null | jq -r "$names" 2>/dev/null | paste -sd' ' - || echo '(needs a sign-in to list)')"
          echo "[*] left alone: your Instabox API keys (revoke INSTABOX_API_KEY with \`instabox keys rm\` if you are done),"
          echo "    snapshots, and the paseo-wake Cloudflare Worker (delete it in the Cloudflare dashboard if you deployed it)"
          exit "$failed"

  deploy:
    name: "Deploy paseo-lite"
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'wake' && inputs.mode != 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: instabox-paseo-lite-${{ inputs.machine_name || vars.INSTABOX_MACHINE_NAME || 'paseo-lite' }}
      cancel-in-progress: false

    environment:
      name: "approve-instabox-paseo-lite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required config
        env:
          MODE: ${{ inputs.mode }}
          HAS_PASEO_PASSWORD: ${{ secrets.PASEO_PASSWORD != '' }}
        run: |
          if [ -z "${INSTABOX_API_KEY:-}" ]; then
            echo "::error::Missing secret: INSTABOX_API_KEY"
            exit 1
          fi
          # on-demand puts the daemon on a public URL: without a password anyone could drive the agents.
          if [ "$MODE" = "on-demand" ] && [ "$HAS_PASEO_PASSWORD" != "true" ]; then
            echo "::error::on-demand mode puts Paseo on a public URL; set the PASEO_PASSWORD secret first"
            exit 1
          fi
          echo "[+] INSTABOX_API_KEY is set | machine: ${MACHINE_NAME} | mode: ${MODE}"

      - name: Prepare log sanitizer
        run: |
          # Same filter as gcp-bash-script-runner.yaml: every line from the machine passes through it.
          cat > "${RUNNER_TEMP}/sanitize.pl" <<'PERL'
          use strict;
          use warnings;
          my $h = '[0-9A-Fa-f]{1,4}';
          while (my $l = <>) {
            $l =~ s/\b(?:\d{1,3}\.){3}\d{1,3}\b/<ip>/g;
            $l =~ s/(?<![\w:.])(?:(?:$h:){7}$h|(?:$h:){1,7}:(?:$h(?::$h){0,6})?|::(?:$h(?::$h){0,6})?)(?![\w:])/<ipv6>/g;
            $l =~ s{(://)[^/\s@]+@}{$1<creds>@}g;
            $l =~ s/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/<email>/g;
            $l =~ s/\bibk_\w+/ibk_<redacted>/g;
            $l =~ s/\b(?:gh[pousr]_|github_pat_)\w+/<github-token>/g;
            $l =~ s/\bsk-[\w-]{8,}/<api-key>/g;
            $l =~ s/\bBearer\s+\S+/Bearer <redacted>/gi;
            $l =~ s/((?:authkey|auth_key|token|password|passwd|secret|api[_-]?key)\s*[=:]\s*)(?!(?:set|unset)\b)\S+/$1<redacted>/gi;
            print $l;
          }
          PERL
          perl -c "${RUNNER_TEMP}/sanitize.pl"

      - name: Install instabox CLI
        run: |
          set -euo pipefail
          # The installer verifies the binary against SHA256SUMS and installs nothing on a mismatch.
          export INSTABOX_INSTALL_DIR="$HOME/.local/bin"
          curl -fsSL https://instabox.sh/install.sh | sh >/dev/null
          echo "$INSTABOX_INSTALL_DIR" >> "$GITHUB_PATH"
          "$INSTABOX_INSTALL_DIR/instabox" --version

      - name: Ensure the machine exists and runs
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail
          if info=$(instabox get "$MACHINE_NAME" --json 2>/dev/null); then
            state=$(jq -r '.state // "unknown"' <<< "$info")
            echo "[*] machine exists, state: ${state}"
            case "$state" in
              running) ;;
              # start resumes a paused machine, or boots it fresh when its memory cannot be restored
              suspended|stopped|error) instabox start "$MACHINE_NAME" ;;
              *) echo "[*] machine is busy (${state}); the SSH step wakes or waits for it" ;;
            esac
          else
            echo "[*] creating ${MACHINE_NAME} from template ${TEMPLATE}"
            instabox create --name "$MACHINE_NAME" --template "$TEMPLATE" --meta app=paseo-lite
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          # Host block with a short-lived certificate signed by Instabox for this key.
          instabox ssh-config "$MACHINE_NAME" > "${RUNNER_TEMP}/instabox_ssh_config"
          {
            cat "${RUNNER_TEMP}/instabox_ssh_config"
            printf '\nHost *\n  LogLevel ERROR\n  ServerAliveInterval 30\n'
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          alias=$(awk '$1 == "Host" { print $2; exit }' "${RUNNER_TEMP}/instabox_ssh_config")
          [ -n "$alias" ] || { echo "::error::instabox ssh-config printed no Host block"; exit 1; }
          echo "SSH_ALIAS=${alias}" >> "$GITHUB_ENV"
          ssh -T -o BatchMode=yes "$alias" true
          echo "[+] SSH to the machine works"

      # Read-only report of what the agents can use on this machine: the browser (binaries,
      # running instances, DevTools endpoints) and the Docker socket they get.
      - name: Inspect host browser and Docker
        run: |
          set -euo pipefail
          template=$(instabox get "$MACHINE_NAME" --json 2>/dev/null | jq -r '(.template // .templateId // "unknown") | if type == "object" then (.name // .id // "unknown") else . end' || echo unknown)
          echo "[*] template: ${template}"
          ssh -T -o BatchMode=yes "$SSH_ALIAS" bash -s <<'SH' | perl "${RUNNER_TEMP}/sanitize.pl"
          as_root() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo -n "$@" 2>/dev/null || "$@"; fi; }
          echo "[*] host: $(. /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-unknown}") | user: $(id -un) | groups: $(id -Gn)"
          found=""
          for b in google-chrome google-chrome-stable chromium chromium-browser chrome microsoft-edge firefox; do
            p=$(command -v "$b" 2>/dev/null) && found="${found} ${b}=${p}"
          done
          for p in /opt/google/chrome/chrome /usr/lib/chromium/chromium /snap/bin/chromium; do
            [ -x "$p" ] && found="${found} ${p}"
          done
          echo "[*] browser binaries:${found:- none}"
          procs=$(as_root ps -eo comm= | grep -iE 'chrom|firefox|msedge' | sort | uniq -c | awk '{printf " %s(x%s)", $2, $1}')
          echo "[*] browser processes:${procs:- none running}"
          flags=$(as_root ps -eo args= | grep -oE -- '--remote-debugging-(port|address|pipe)(=[^ ]*)?' | sort -u | tr '\n' ' ')
          echo "[*] remote-debugging flags: ${flags:-none}"
          ports=$( { as_root ss -Hltnp 2>/dev/null || true; } | grep -iE 'chrom|firefox|msedge' | awk '{print $4}' | sort -u | tr '\n' ' ')
          echo "[*] ports a browser listens on: ${ports:-none}"
          for port in $( { printf '9222\n9223\n9229\n'; echo "$ports" | tr ' ' '\n' | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p'; } | sort -un); do
            v=$( (curl -fsS -m 3 "http://127.0.0.1:${port}/json/version" || wget -qO- -T 3 "http://127.0.0.1:${port}/json/version") 2>/dev/null | grep -oE '"Browser" *: *"[^"]*"' || true)
            [ -n "$v" ] && echo "[+] DevTools (CDP) on 127.0.0.1:${port}: ${v#*: }"
          done
          echo "[*] desktop: DISPLAY sockets $(ls /tmp/.X11-unix 2>/dev/null | tr '\n' ' ' || true)"
          if [ -S /var/run/docker.sock ]; then
            echo "[*] docker socket: $(stat -c '%A %U:%G (gid %g)' /var/run/docker.sock)"
          else
            echo "[!] no /var/run/docker.sock on the host"
          fi
          SH

      - name: Run init-paseo-lite.sh over SSH
        env:
          SCRIPT_PATH: bash-scripts/init-paseo-lite.sh
          DEBUG_LOGS: ${{ inputs.debug }}
          # The agents get the host's Docker (root-equivalent on this machine; GCP keeps it off).
          PASEO_DOCKER_SOCKET: "1"
          # Same secrets as the paseo-lite run of gcp-bash-script-runner.yaml; only set ones are forwarded.
          SECRET_FILTER: "CODEX_,GH_TOKEN,GH_USERNAME,GH_EMAIL,ANTHROPIC_,CLAUDE_CODE_,PASEO_"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${{ secrets.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ secrets.CLAUDE_CODE_MAX_OUTPUT_TOKENS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          CODEX_IDLE_SECS: ${{ secrets.CODEX_IDLE_SECS }}
          CODEX_MAX_TOKEN: ${{ secrets.CODEX_MAX_TOKEN }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          PASEO_PASSWORD: ${{ secrets.PASEO_PASSWORD }}
        run: |
          set +e
          SECONDS=0
          SAN="${RUNNER_TEMP}/sanitize.pl"
          DEBUG_LOGS="${DEBUG_LOGS:-true}"
          umask 077
          LOG=$(mktemp)
          PAYLOAD=$(mktemp)
          trap 'rm -f "$LOG" "$PAYLOAD"' EXIT

          {
            IFS=',' read -ra PREFIXES <<< "$SECRET_FILTER"
            for p in "${PREFIXES[@]}"; do
              while IFS= read -r v; do
                [ -n "${!v}" ] && printf 'export %s=%q\n' "$v" "${!v}"
              done < <(compgen -e | grep "^$p" || true)
            done
            printf 'export VERBOSE=0\n'
            if [ "$DEBUG_LOGS" = "true" ]; then printf 'export INIT_DEBUG=1\n'; else printf 'export INIT_DEBUG=0\n'; fi
            # Instabox machines are not COS: Docker may need starting, and the login user may only
            # reach it through sudo. The script calls plain `docker` (also via `timeout`, which skips
            # shell functions), so a wrapper executable first on PATH routes it through sudo then.
            cat <<'SHIM'
          if ! docker info >/dev/null 2>&1; then
            sudo -n systemctl start docker >/dev/null 2>&1 || sudo -n service docker start >/dev/null 2>&1 || true
            for _ in $(seq 1 20); do
              { docker info >/dev/null 2>&1 || sudo -n docker info >/dev/null 2>&1; } && break
              sleep 1
            done
          fi
          if ! docker info >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            echo "[*] instabox: using docker through sudo"
            _real_docker=$(command -v docker)
            _shim_dir=$(mktemp -d)
            printf '#!/bin/sh\nexec sudo -n %s "$@"\n' "$_real_docker" > "$_shim_dir/docker"
            chmod 755 "$_shim_dir/docker"
            export PATH="$_shim_dir:$PATH"
          fi
          SHIM
            cat "${SCRIPT_PATH}"
          } > "$PAYLOAD"

          NAMES=$(grep -oE '^export [A-Za-z_][A-Za-z0-9_]*' "$PAYLOAD" | awk '{print $2}' | sort -u | paste -sd' ' -)
          SHA=$(sha256sum "${SCRIPT_PATH}" | cut -c1-12)
          echo "[*] script: ${SCRIPT_PATH} (sha256 ${SHA}) | env forwarded: ${NAMES}" | perl "$SAN"

          # SSH, not `instabox exec`: exec stops a command after 10 minutes and does not stream,
          # while the first image pull alone can take longer.
          ssh -T -o BatchMode=yes "$SSH_ALIAS" 'bash -s' < "$PAYLOAD" > "$LOG" 2>&1
          RC=$?
          DUR=$SECONDS
          set -e

          show() {
            if [ "$DEBUG_LOGS" = "true" ]; then
              grep -aE '^\[[*>+!xd]\] |^\[✓\] ' "$LOG" | perl "$SAN" || true
            else
              grep -aE '^\[[*>+!x]\] |^\[✓\] ' "$LOG" | perl "$SAN" || true
            fi
          }
          {
            echo "### \`init-paseo-lite.sh\` on Instabox \`${MACHINE_NAME}\`: $([ "$RC" -eq 0 ] && echo succeeded || echo FAILED)"
            echo ""
            echo "exit code ${RC}, ${DUR}s, script sha256 \`${SHA}\`, $(echo "$NAMES" | wc -w) env variables forwarded"
            echo ""
            echo "<details><summary>Output (sanitized)</summary>"
            echo ""
            echo '```text'
            show | tail -n 200
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          echo "::group::Script output (sanitized)"
          show
          echo "::endgroup::"
          if [ "$RC" -eq 0 ]; then
            { show | grep -a '^\[!\] ' | head -n 5 | while IFS= read -r w; do echo "::warning::${w#\[!\] }"; done; } || true
            echo "[+] done in ${DUR}s. Pairing link: instabox ssh ${MACHINE_NAME} -- docker exec paseo-lite paseo-lite pair"
            exit 0
          fi
          echo "::error::init-paseo-lite.sh failed (exit ${RC}) after ${DUR}s"
          [ "$RC" -eq 255 ] && echo "[!] exit 255 = the SSH connection itself failed (not the script)."
          echo "---- diagnostic tail (sanitized) ----"
          perl "$SAN" "$LOG" | grep -avE 'BEGIN [A-Z ]+KEY|PRIVATE KEY|Bearer ' | tail -60 || true
          exit "$RC"

      # The host's Chromium as a service, on the machine's desktop (watch it, or log in to sites,
      # in the Instabox desktop view) or headless when there is none, with DevTools on 127.0.0.1
      # only. Claude Code and Codex get the chrome-devtools MCP server for it, run in a throwaway
      # Node container on the host Docker since the paseo-lite image has no Node.
      - name: Host browser for the agents
        env:
          CDP_PORT: "9222"
          MCP_IMAGE: node:22-alpine
        run: |
          set -euo pipefail
          ssh -T -o BatchMode=yes "$SSH_ALIAS" "CDP_PORT=${CDP_PORT} MCP_IMAGE=${MCP_IMAGE} bash -s" <<'SH' | perl "${RUNNER_TEMP}/sanitize.pl"
          set -uo pipefail
          fetch() { curl -fsS -m 3 "$1" 2>/dev/null || wget -qO- -T 3 "$1" 2>/dev/null; }
          cdp_version() { fetch "http://127.0.0.1:${CDP_PORT}/json/version" | grep -oE '"Browser" *: *"[^"]*"' | sed 's/.*: *//'; }
          BROWSER=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          [ -n "$BROWSER" ] || { echo "[x] no Chromium or Chrome on the host"; exit 1; }
          PROFILE="${HOME}/.config/paseo-chromium"
          mkdir -p "$PROFILE"

          # install_file DEST MODE: stdin -> DEST (as root) only when it changed; prints "changed".
          install_file() {
            tmp=$(mktemp); cat > "$tmp"
            if ! sudo -n cmp -s "$tmp" "$1" 2>/dev/null; then sudo -n install -m "$2" "$tmp" "$1" && echo changed; fi
            rm -f "$tmp"
          }
          changed=$(install_file /usr/local/bin/paseo-browser 755 <<EOF
          #!/bin/sh
          # Managed by instabox-paseo-lite.yaml: Chromium for the paseo-lite agents, DevTools on 127.0.0.1 only.
          set -- --remote-debugging-address=127.0.0.1 --remote-debugging-port=${CDP_PORT} --user-data-dir=${PROFILE} --no-first-run --no-default-browser-check --password-store=basic
          if [ -S /tmp/.X11-unix/X1 ] && [ "\${PASEO_BROWSER_HEADLESS:-0}" != 1 ]; then
            export DISPLAY=:1
          else
            set -- "\$@" --headless=new
          fi
          exec ${BROWSER} "\$@"
          EOF
          )

          if [ -d /run/systemd/system ]; then
            changed="${changed}$(install_file /etc/systemd/system/paseo-browser.service 644 <<EOF
          [Unit]
          Description=Chromium for the paseo-lite agents (DevTools on 127.0.0.1:${CDP_PORT})
          After=network.target

          [Service]
          User=$(id -un)
          Environment=HOME=${HOME}
          ExecStart=/usr/local/bin/paseo-browser
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF
          )"
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable paseo-browser >/dev/null 2>&1
            # Restarting closes its tabs, so only when the setup changed or it is down.
            if [ -n "$changed" ] || ! systemctl is-active -q paseo-browser; then sudo -n systemctl restart paseo-browser; fi
            restart_headless() {
              sudo -n mkdir -p /etc/systemd/system/paseo-browser.service.d
              printf '[Service]\nEnvironment=PASEO_BROWSER_HEADLESS=1\n' | install_file /etc/systemd/system/paseo-browser.service.d/headless.conf 644 >/dev/null
              sudo -n systemctl daemon-reload; sudo -n systemctl restart paseo-browser
            }
          else
            # No systemd: started now, but not again after the machine is stopped and started.
            if [ -n "$changed" ] || [ -z "$(cdp_version)" ]; then
              pkill -f -- "--user-data-dir=${PROFILE}" 2>/dev/null; sleep 1
              setsid nohup /usr/local/bin/paseo-browser >/dev/null 2>&1 < /dev/null &
            fi
            restart_headless() { pkill -f -- "--user-data-dir=${PROFILE}" 2>/dev/null; sleep 1; PASEO_BROWSER_HEADLESS=1 setsid nohup /usr/local/bin/paseo-browser >/dev/null 2>&1 < /dev/null & }
            echo "[!] no systemd: the browser is not restarted after a machine stop/start (redeploy then)"
          fi

          wait_cdp() { for _ in $(seq 1 20); do v=$(cdp_version); [ -n "$v" ] && { echo "$v"; return 0; }; sleep 1; done; return 1; }
          if v=$(wait_cdp); then
            echo "[+] browser up: ${v} on 127.0.0.1:${CDP_PORT} ($([ -S /tmp/.X11-unix/X1 ] && [ ! -f /etc/systemd/system/paseo-browser.service.d/headless.conf ] && echo "on the desktop" || echo headless))"
          else
            echo "[!] no DevTools answer on the desktop, retrying headless"
            restart_headless
            if v=$(wait_cdp); then echo "[+] browser up: ${v} on 127.0.0.1:${CDP_PORT} (headless)"
            else
              echo "[x] the browser did not start"
              { sudo -n journalctl -u paseo-browser -n 20 --no-pager 2>/dev/null || true; } | sed 's/^/    /'
              exit 1
            fi
          fi

          # MCP server for the agents: pull the image and fill a persistent npm cache now, so the
          # agents' first start is fast.
          docker pull -q "$MCP_IMAGE" >/dev/null
          docker run --rm -v paseo-npm-cache:/root/.npm "$MCP_IMAGE" npx -y chrome-devtools-mcp@latest --help >/dev/null 2>&1 \
            || echo "[!] could not pre-install chrome-devtools-mcp (the agents will fetch it on first use)"
          MCP_CMD="docker run -i --rm --init --network host -v paseo-npm-cache:/root/.npm ${MCP_IMAGE} npx -y chrome-devtools-mcp@latest --browserUrl=http://127.0.0.1:${CDP_PORT}"

          if docker exec -u 1000:1000 -e HOME=/home/paseo paseo-lite sh -c \
              "claude mcp remove -s user chrome-devtools >/dev/null 2>&1; claude mcp add -s user chrome-devtools -- ${MCP_CMD}" >/dev/null 2>&1; then
            echo "[+] Claude Code: chrome-devtools MCP added"
          else
            echo "[!] Claude Code: could not add the chrome-devtools MCP"
          fi
          # init-paseo-lite.sh rewrites config.toml on every deploy, so append once per deploy.
          args=$(printf '"%s", ' ${MCP_CMD#docker }); args="[${args%, }]"
          if docker exec -u 0 paseo-lite sh -c '
              f=/home/paseo/.codex/config.toml
              grep -q "^\[mcp_servers.chrome-devtools\]" "$f" 2>/dev/null && exit 0
              printf "\n[mcp_servers.chrome-devtools]\ncommand = \"docker\"\nargs = %s\nstartup_timeout_sec = 120\n" "$1" >> "$f"
              chown 1000:1000 "$f"' sh "$args"; then
            echo "[+] Codex: chrome-devtools MCP added"
          else
            echo "[!] Codex: could not add the chrome-devtools MCP"
          fi

          # End to end, as the agents run: host Docker from inside the container, then Claude
          # Code starting the MCP server and reaching the browser through it.
          if v=$(docker exec paseo-lite docker version --format '{{.Server.Version}}' 2>&1); then
            echo "[+] agents reach the host Docker (engine ${v})"
          else
            echo "[!] agents cannot use the host Docker: $(echo "$v" | tail -n 1)"
          fi
          st=$(timeout 180 docker exec -e HOME=/home/paseo paseo-lite claude mcp list 2>&1 | grep -i 'chrome-devtools' | head -n 1)
          case "$st" in
            *onnected*) echo "[+] Claude Code: chrome-devtools MCP connected" ;;
            *) echo "[!] Claude Code: chrome-devtools MCP not connected: ${st:-no status}" ;;
          esac
          SH

      - name: Apply mode (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
          PASEO_PORT: "6768"   # fixed in init-paseo-lite.sh
          # Instabox refuses to publish 6768 (a reserved desktop/Orca control port), so a socat
          # container forwards this port to the daemon and this one is published instead.
          PUBLIC_PORT: ${{ vars.INSTABOX_PUBLIC_PORT || '16768' }}
          FORWARDER: paseo-lite-public
          FORWARDER_IMAGE: alpine/socat:latest
        run: |
          set -euo pipefail
          # Public URLs are never printed here (the repo and its logs are public).
          if [ "$MODE" = "on-demand" ]; then
            # Idempotent: replaced on every run so a changed port or image is picked up.
            ssh -T -o BatchMode=yes "$SSH_ALIAS" bash -s <<SH
          set -euo pipefail
          docker pull -q "$FORWARDER_IMAGE" >/dev/null
          docker rm -f "$FORWARDER" >/dev/null 2>&1 || true
          docker run -d --name "$FORWARDER" --restart always --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --cpus 0.25 --memory 32m --pids-limit 64 --log-opt max-size=1m \
            "$FORWARDER_IMAGE" "TCP-LISTEN:${PUBLIC_PORT},fork,reuseaddr" "TCP:127.0.0.1:${PASEO_PORT}" >/dev/null
          sleep 2
          [ "\$(docker inspect -f '{{.State.Running}}' "$FORWARDER")" = true ]
          SH
            echo "[+] forwarder running: :${PUBLIC_PORT} -> paseo-lite :${PASEO_PORT}"

            if instabox port ls "$MACHINE_NAME" 2>/dev/null | grep -qw "$PUBLIC_PORT"; then
              echo "[+] port ${PUBLIC_PORT} was already published"
            elif err=$(instabox port publish "$MACHINE_NAME" "$PUBLIC_PORT" --name paseo-lite 2>&1 >/dev/null); then
              echo "[+] port ${PUBLIC_PORT} published"
            else
              echo "::error::could not publish port ${PUBLIC_PORT}: ${err}"
              exit 1
            fi
            # Back to the default idle pause, in case an earlier always-on run turned it off.
            instabox auto-suspend "$MACHINE_NAME" 30m >/dev/null
            echo "[+] on-demand: the machine pauses after 30 idle minutes; wake it with this workflow's wake mode"
            echo "[*] get the URL on your own computer: instabox port ls ${MACHINE_NAME}"
          else
            instabox port unpublish "$MACHINE_NAME" "$PUBLIC_PORT" >/dev/null 2>&1 \
              && echo "[+] port ${PUBLIC_PORT} unpublished" || echo "[*] port ${PUBLIC_PORT} was not published"
            ssh -T -o BatchMode=yes "$SSH_ALIAS" "docker rm -f $FORWARDER >/dev/null 2>&1 || true"
            # Only honoured with manual lifecycle; otherwise the fixed 30-minute idle pause stays.
            instabox auto-suspend "$MACHINE_NAME" 0 >/dev/null || echo "::warning::could not turn off the idle pause"
            echo "[+] always-on requested (needs manual lifecycle on your Instabox account, or the keep-alive schedule)"
          fi

      # The same supervisor as the GCP VM's upsert-github-runner run: one fresh runner container
      # per job, work dir in RAM, deleted afterwards. Docker brings it back whenever the machine
      # is online again (resumed, woken by this workflow's wake mode, or booted fresh) and it
      # registers a new runner by itself: no token to renew by hand.
      - name: GitHub runner for the private repo
        if: inputs.github_runner
        env:
          SCRIPT_PATH: bash-scripts/upsert-github-runner.sh
          # Dedicated GH_RUNNER_* secrets when set, else the private repo secrets other workflows
          # already use (the token then also needs Administration: Read and write on that repo).
          GH_RUNNER_REPO: ${{ secrets.GH_RUNNER_REPO || secrets.PRIVATE_REPO }}
          GH_RUNNER_APP_ID: ${{ secrets.GH_RUNNER_APP_ID }}
          GH_RUNNER_APP_PRIVATE_KEY: ${{ secrets.GH_RUNNER_APP_PRIVATE_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT || secrets.PRIVATE_REPO_TOKEN }}
          GH_RUNNER_NO_SUDO: ${{ secrets.GH_RUNNER_NO_SUDO }}
          GH_RUNNER_NAME: ${{ inputs.machine_name || vars.INSTABOX_MACHINE_NAME || 'paseo-lite' }}
          GH_RUNNER_LABELS: ${{ vars.INSTABOX_RUNNER_LABELS || 'self-hosted,linux,x64,instabox' }}
          # Shared with paseo-lite and its browser on 4 vCPU / 8 GB.
          GH_RUNNER_CPUS: ${{ vars.INSTABOX_RUNNER_CPUS || '2' }}
          GH_RUNNER_MEMORY: ${{ vars.INSTABOX_RUNNER_MEMORY || '4g' }}
          GH_RUNNER_WORK_SIZE: ${{ vars.INSTABOX_RUNNER_WORK_SIZE || '3g' }}
          # Jobs get their own network, so they can't reach the browser's DevTools on the host's
          # 127.0.0.1 (logged-in sessions) or anything else bound to localhost there.
          GH_RUNNER_NETWORK: bridge
        run: |
          set +e
          SAN="${RUNNER_TEMP}/sanitize.pl"
          # The private repo name shows up in the runner logs: mask it in the forms they print.
          if [ -n "${GH_RUNNER_REPO:-}" ]; then
            r="${GH_RUNNER_REPO#https://github.com/}"; r="${r%.git}"; r="${r%/}"
            echo "::add-mask::${r}"; echo "::add-mask::${r#*/}"
          fi
          if [ -z "$GH_RUNNER_REPO" ] || { [ -z "$GH_RUNNER_PAT" ] && [ -z "$GH_RUNNER_APP_ID" ]; }; then
            echo "::warning::GitHub runner skipped: set PRIVATE_REPO + PRIVATE_REPO_TOKEN (or GH_RUNNER_REPO + a GitHub App / GH_RUNNER_PAT)"
            exit 0
          fi
          umask 077
          LOG=$(mktemp)
          PAYLOAD=$(mktemp)
          trap 'rm -f "$LOG" "$PAYLOAD"' EXIT
          {
            for v in $(compgen -e | grep '^GH_RUNNER_'); do
              [ -n "${!v}" ] && printf 'export %s=%q\n' "$v" "${!v}"
            done
            cat "$SCRIPT_PATH"
          } > "$PAYLOAD"
          ssh -T -o BatchMode=yes "$SSH_ALIAS" 'bash -s' < "$PAYLOAD" > "$LOG" 2>&1
          RC=$?
          set -e
          grep -aE '^\[[*>+!x]\] ' "$LOG" | perl "$SAN" || true
          if [ "$RC" -ne 0 ]; then
            echo "::error::upsert-github-runner.sh failed (exit ${RC})"
            echo "---- diagnostic tail (sanitized) ----"
            perl "$SAN" "$LOG" | grep -avE 'BEGIN [A-Z ]+KEY|PRIVATE KEY|Bearer ' | tail -40 || true
            exit "$RC"
          fi
          echo "[+] runner up; in the private repo use runs-on: [self-hosted, instabox]. Logs: instabox ssh ${MACHINE_NAME} -- sudo docker logs gh-runner-supervisor"
