name: "Terraform Monorepo Deployer"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Find all subdirectories containing *.tf files
  # -------------------------------------------------------------
  detect-directories:
    name: "Detect Terraform Directories"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Find Terraform Folders
        id: set-matrix
        run: |
          DIRS=$(find . -not -path '*/.*' -type f -name '*.tf' -exec dirname {} \; | sort -u | jq -R . | jq -s -c .)
          echo "Found directories: $DIRS"
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------
  # Job 2: Run Formatting, Initialization & Terraform Plan
  # -------------------------------------------------------------
  terraform-plan:
    name: "Plan (${{ matrix.dir }})"
    needs: detect-directories
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect-directories.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Workspace Name
        id: workspace
        run: |
          CLEAN_DIR=$(echo "${{ matrix.dir }}" | sed 's|^\./||' | tr '/' '-')
          if [ "$CLEAN_DIR" = "." ] || [ -z "$CLEAN_DIR" ]; then
            CLEAN_DIR="root"
          fi
          echo "workspace_name=$CLEAN_DIR" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ${{ matrix.dir }}

      - name: Terraform Init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'gcp' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init
        working-directory: ${{ matrix.dir }}

      - name: Terraform Plan
        env:
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'gcp' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            > /dev/null 2>&1
        working-directory: ${{ matrix.dir }}

  # -------------------------------------------------------------
  # Job 3: Protected Apply Step (Requires Manual Approval)
  # -------------------------------------------------------------
  terraform-apply:
    name: "Apply (${{ matrix.dir }})"
    needs: [detect-directories, terraform-plan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect-directories.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Workspace Name
        id: workspace
        run: |
          CLEAN_DIR=$(echo "${{ matrix.dir }}" | sed 's|^\./||' | tr '/' '-')
          if [ "$CLEAN_DIR" = "." ] || [ -z "$CLEAN_DIR" ]; then
            CLEAN_DIR="root"
          fi
          echo "workspace_name=$CLEAN_DIR" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'gcp' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init
        working-directory: ${{ matrix.dir }}

      - name: Terraform Apply
        env:
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'gcp' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"
        working-directory: ${{ matrix.dir }}