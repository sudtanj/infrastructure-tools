name: "Terraform Monorepo Deployer"

on:
  workflow_dispatch:
    inputs:
      dir:
        description: "Deploy only this folder ('all' for every deployable folder)"
        required: false
        default: "all"
        type: string
  push:
    branches:
      - main
    # Skip the run entirely when no Terraform input changed on the branch.
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "**.tf.json"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform-deploy.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Find deployable folders (those with a cloud {} block)
  # -------------------------------------------------------------
  detect-directories:
    name: "Detect Terraform Directories"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required: the push->folder filter diffs before..after, so the
          # previous commit must be present locally. Default shallow-1
          # checkout would make `git diff` fail and silently deploy nothing.
          fetch-depth: 0

      - name: Find Terraform Folders
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          REQUESTED_DIR: ${{ inputs.dir }}
        run: |
          set -euo pipefail

          # Only folders that declare an HCP Terraform cloud {} block are
          # deployable units. Reusable modules and plain provider-only
          # folders are ignored. Normalised without the leading "./".
          mapfile -t DEPLOYABLE < <(
            find . -not -path '*/.*' -type f -name '*.tf' \
                 -exec grep -l 'cloud[[:space:]]*{' {} + \
              | xargs -n1 dirname | sed 's|^\./||' | sort -u
          )

          echo "Deployable folders: ${DEPLOYABLE[*]:-none}"

          if [ "$EVENT_NAME" != "push" ]; then
            # Manual run: honour the requested scope.
            REQUESTED="${REQUESTED_DIR:-all}"
            if [ "$REQUESTED" = "all" ] || [ -z "$REQUESTED" ]; then
              SELECTED=("${DEPLOYABLE[@]:-}")
            else
              REQUESTED="${REQUESTED#./}"
              SELECTED=()
              for d in "${DEPLOYABLE[@]}"; do
                [ "$d" = "$REQUESTED" ] && SELECTED+=("$d")
              done
              if [ ${#SELECTED[@]} -eq 0 ]; then
                echo "::error::'${REQUESTED_DIR}' is not a deployable folder. Options: ${DEPLOYABLE[*]}"
                exit 1
              fi
            fi
          else
            # Push: only folders touched by this push. On a first push (or any
            # unusable range) fall back to every deployable folder.
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit to diff against; using all deployable folders."
              SELECTED=("${DEPLOYABLE[@]:-}")
            else
              # Fail OPEN: if the diff cannot be computed (missing object,
              # force-push, truncated history) we must not silently deploy
              # nothing. Fall back to every deployable folder instead.
              if ! CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
                '*.tf' '*.tfvars' '*.tftpl' '*.tf.json' '.terraform.lock.hcl' 2>/dev/null); then
                echo "::warning::Could not diff $BEFORE_SHA..$AFTER_SHA; falling back to all deployable folders."
                SELECTED=("${DEPLOYABLE[@]:-}")
                CHANGED=""
              else
                echo "Changed terraform files:"
                echo "${CHANGED:-  (none)}"

                SELECTED=()
                for d in "${DEPLOYABLE[@]}"; do
                  while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    case "$f" in
                      "$d"/*|"$d") SELECTED+=("$d"); break ;;
                    esac
                  done <<< "$CHANGED"
                done
              fi
            fi
          fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "No deployable folder was changed by this push; nothing to plan."
            {
              echo "### Terraform deploy skipped"
              echo
              echo "No changes under: ${DEPLOYABLE[*]:-none}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(printf '%s\n' "${SELECTED[@]}" | sort -u | jq -R . | jq -s -c .)
          echo "Selected directories: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------
  # Job 2: Format, Init & Plan
  # Each successful leg uploads a marker so apply can proceed for
  # healthy folders even if other folders failed to plan.
  # -------------------------------------------------------------
  terraform-plan:
    name: "Plan (${{ matrix.dir }})"
    needs: detect-directories
    # '' when detect-directories failed rather than reporting an empty set;
    # '[]' when it ran and found nothing.
    if: ${{ needs.detect-directories.outputs.matrix != '' && needs.detect-directories.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'` is required: the matrix is built before this job's `if` is
        # evaluated, so a failed detect-directories would otherwise turn
        # fromJson('') into "empty input" and mask the real error.
        dir: ${{ fromJson(needs.detect-directories.outputs.matrix || '[]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Workspace Name
        id: workspace
        run: |
          CLEAN_DIR=$(echo "${{ matrix.dir }}" | sed 's|^\./||' | tr '/' '-')
          if [ "$CLEAN_DIR" = "." ] || [ -z "$CLEAN_DIR" ]; then
            CLEAN_DIR="root"
          fi
          echo "workspace_name=$CLEAN_DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved workspace: ${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-$CLEAN_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-1.9.8-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-1.9.8-

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ${{ matrix.dir }}

      - name: Terraform Init
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Plan
        env:
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: terraform plan -input=false -no-color
        working-directory: ${{ matrix.dir }}

      # Only reached if every step above succeeded.
      - name: Mark Plan Success
        run: |
          mkdir -p plan-ok
          echo "${{ matrix.dir }}" > plan-ok/marker.txt

      - name: Upload Plan Marker
        uses: actions/upload-artifact@v4
        with:
          name: plan-ok-${{ steps.workspace.outputs.workspace_name }}
          path: plan-ok/marker.txt
          retention-days: 1

  # -------------------------------------------------------------
  # Job 2b: Collect folders whose plan succeeded
  # -------------------------------------------------------------
  plan-results:
    name: "Collect Successful Plans"
    needs: [detect-directories, terraform-plan]
    # always() lets this run even if some plan legs failed.
    if: |
      always() &&
      needs.detect-directories.result == 'success' &&
      needs.detect-directories.outputs.matrix != '' &&
      needs.detect-directories.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Download Plan Markers
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: plan-ok-*
          path: markers

      - name: Build Apply Matrix
        id: collect
        run: |
          shopt -s nullglob
          DIRS=()
          for f in markers/*/marker.txt; do
            DIRS+=("$(cat "$f")")
          done
          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "No successful plans; nothing to apply."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(printf '%s\n' "${DIRS[@]}" | sort -u | jq -R . | jq -s -c .)
            echo "Applying: $MATRIX"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------
  # Job 3: Protected Apply (manual approval via "production" env)
  # Runs only for folders whose plan succeeded.
  # -------------------------------------------------------------
  terraform-apply:
    name: "Apply (${{ matrix.dir }})"
    needs: [plan-results]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.plan-results.result == 'success' &&
      needs.plan-results.outputs.matrix != '' &&
      needs.plan-results.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.plan-results.outputs.matrix || '[]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Workspace Name
        id: workspace
        run: |
          CLEAN_DIR=$(echo "${{ matrix.dir }}" | sed 's|^\./||' | tr '/' '-')
          if [ "$CLEAN_DIR" = "." ] || [ -z "$CLEAN_DIR" ]; then
            CLEAN_DIR="root"
          fi
          echo "workspace_name=$CLEAN_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-1.9.8-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-1.9.8-

      - name: Terraform Init
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Apply
        env:
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-${{ steps.workspace.outputs.workspace_name }}"
        run: terraform apply -auto-approve -input=false -no-color -compact-warnings
        working-directory: ${{ matrix.dir }}
