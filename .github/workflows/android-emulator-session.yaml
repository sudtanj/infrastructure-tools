name: "Android emulator session over Tailscale"

# ---------------------------------------------------------------------------
# Starts an Android emulator on demand and keeps it reachable on the tailnet
# as `android-emulator`, so a person and an agent can share the same logged-in
# device:
#   adb      android-emulator:5555   (adb, scrcpy, Maestro)
#            A new adb client gets the "Allow USB debugging?" prompt once:
#            accept it over VNC with "Always allow from this computer". The
#            approval is stored in the AVD, so it survives later runs.
#   VNC      android-emulator:5900   (watch or click the emulator window)
#
# The whole AVD (app data, logins) is encrypted and stored as release assets
# on the PRIVATE repo, under the release tag `android-emulator-state`, and
# restored on the next run. Nothing is kept in this public repo's cache or
# artifacts.
#
# The Tailscale node identity (`tailscaled.state.enc`, same release) is kept
# too, so every run is the same non-ephemeral machine with the same 100.x IP
# and MagicDNS name. Deleting the machine in the Tailscale admin console makes
# the next run join as a new machine with a new IP. The runner's adb key
# (`adbkey.enc`) is kept there as well, generated on the first run.
#
# STOP IT WITH THE STOP FILE
#   adb -s android-emulator:5555 shell touch /data/local/tmp/stop-session
# Every run in which the emulator started saves, however it ends: stop file,
# `max_minutes`, a boot timeout, the emulator crashing, or the Cancel button.
# Only the disk is kept, no quick-resume snapshot: every run cold boots, so
# app data and logins are never rolled back.
#
# PINEDRAMA AUTOPLAY
#   Daily at 07:00 and 17:00 UTC+7 (GitHub can start a scheduled run late),
#   or with `autoplay` on, the runner first launches EraSpace's rocket
#   ("Luncurkan Roket") until it is out of tokens with
#   .github/scripts/eraspace/eraspace.ts, then plays PineDrama itself with
#   .github/scripts/pinedrama/pinedrama.ts: it checks in and presses every
#   "Klaim" on the rewards page (rewards.ts), exchanges Rp500 to DANA once the
#   balance reaches it, plays until the coin timer at the top left is gone or
#   `autoplay_minutes` pass, then saves; no stop file needed.
#   If a session is already running, the scheduled one waits for it.
#
# EXIT NODE
#   With `exit_node` on (the default), the runner's internet traffic, and so
#   the emulator's, leaves through the tailnet exit node TAILSCALE_EXIT_NODE,
#   as in typescript-worker-run: apps see that node's IP, not GitHub's. It is
#   switched on just before the emulator starts (after the state and system
#   image downloads) and off before the state is uploaded, so the multi-GB
#   transfers don't go through it. If the egress IP doesn't change, the
#   emulator is not started.
#
# SECRETS
#   TAILSCALE_EXIT_NODE            exit node: tag:name, MagicDNS name or 100.x
#                                  IP (needed only with `exit_node`)
#   PRIVATE_REPO                   owner/name of the private repo
#   PRIVATE_REPO_TOKEN             needs Contents: read AND write on it
#                                  (releases), not just read
#   TAILSCALE_OAUTH_CLIENT_SECRET  OAuth client (tskey-client-...)
#   TAILSCALE_TAGS                 e.g. "tag:ci"
#   STATE_KEY                      passphrase that encrypts the saved AVD
#   VNC_PASSWORD                   VNC password (only the first 8 chars count)
# ---------------------------------------------------------------------------

on:
  # 07:00 and 17:00 UTC+7.
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Stop and save after this many minutes if nobody stops it (max 320)'
        type: number
        default: 120
      fresh:
        description: 'Ignore the saved state; the next save replaces it'
        type: boolean
        default: false
      exit_node:
        description: 'Send internet traffic through the TAILSCALE_EXIT_NODE exit node'
        type: boolean
        default: true
      autoplay:
        description: 'Play PineDrama until the coin is gone, then save (as the schedule does)'
        type: boolean
        default: false
      autoplay_minutes:
        description: 'With autoplay, stop after this many minutes even if the coin is still there'
        type: number
        default: 30

permissions:
  contents: read

# One emulator at a time: two runs would race to save over each other's state.
concurrency:
  group: android-emulator-session
  cancel-in-progress: false

env:
  STATE_TAG: android-emulator-state

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      # A scheduled run has no inputs; these are its values.
      USE_EXIT_NODE: ${{ github.event_name == 'schedule' || inputs.exit_node }}
      AUTOPLAY: ${{ github.event_name == 'schedule' || inputs.autoplay }}
      AUTOPLAY_MINUTES: ${{ inputs.autoplay_minutes || 30 }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in PRIVATE_REPO GH_TOKEN TAILSCALE_OAUTH_CLIENT_SECRET TAILSCALE_TAGS STATE_KEY VNC_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing secrets::Not set: ${missing[*]}"
            exit 1
          fi
          # gh error text can include the repo path; keep it out of the public log.
          echo "::add-mask::${PRIVATE_REPO}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare state release
        run: |
          set -euo pipefail
          if ! gh release view "$STATE_TAG" -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release create "$STATE_TAG" -R "$PRIVATE_REPO" --title "Android emulator state" \
              --notes "Encrypted AVD saved by infrastructure-tools android-emulator-session." >/dev/null
          fi
          # Not `|| true`: a failed listing must stop the run, or a clean
          # emulator (or a new Tailscale node) would later be saved over the
          # good state.
          gh release view "$STATE_TAG" -R "$PRIVATE_REPO" --json assets -q '.assets[].name' > /tmp/state-assets.txt

      # A set is `state-<run_id>.part-NNN` plus `state-<run_id>.sha256`. The
      # manifest is uploaded last, so only sets with one are complete.
      - name: Restore saved state
        if: ${{ !inputs.fresh }}
        run: |
          set -euo pipefail
          names="$(cat /tmp/state-assets.txt)"
          id="$(printf '%s\n' "$names" | sed -n 's/^state-\([0-9]*\)\.sha256$/\1/p' | sort -n | tail -1)"
          if [ -z "$id" ]; then
            echo "No saved state; starting clean."
            exit 0
          fi
          mkdir -p /tmp/state ~/.android/avd
          cd /tmp/state
          # Downloads of several GB sometimes break off (HTTP/2 stream errors).
          for attempt in 1 2 3; do
            gh release download "$STATE_TAG" -R "$PRIVATE_REPO" -p "state-${id}.*" --clobber && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::State download failed (try ${attempt}); retrying."
            sleep 15
          done
          sha256sum -c --quiet "state-${id}.sha256"
          cat state-"${id}".part-* \
            | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY \
            | tar -x --zstd -C ~/.android/avd
          rm -rf /tmp/state
          echo "Saved state restored."

      # The emulator hands its host key to Android only on a cold boot. Runs
      # cold boot now (-no-snapshot), but a fixed key keeps adb authorized if
      # snapshots ever come back.
      - name: Restore or generate adb key
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if grep -qx 'adbkey.enc' /tmp/state-assets.txt; then
            gh release download "$STATE_TAG" -R "$PRIVATE_REPO" -p adbkey.enc -D /tmp
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in /tmp/adbkey.enc \
              | tar -x -C ~/.android
            rm /tmp/adbkey.enc
            echo "adb key restored."
          else
            "$ANDROID_HOME/platform-tools/adb" keygen ~/.android/adbkey >/dev/null
            tar -C ~/.android -c adbkey adbkey.pub \
              | openssl enc -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -out /tmp/adbkey.enc
            gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" /tmp/adbkey.enc --clobber
            rm /tmp/adbkey.enc
            # A saved snapshot trusts an older key; cold boot so Android is
            # handed this one. App data and approved clients are kept.
            rm -rf ~/.android/avd/session.avd/snapshots
            echo "New adb key generated; cold booting this once."
          fi
          chmod 600 ~/.android/adbkey

      # The emulator needs all 4 cores and most of the memory. None of these
      # are used here, and the timers wake up mid-session (apt, snap and
      # man-db refreshes) and compete for CPU and disk.
      - name: Stop unneeded runner services
        run: |
          for unit in apt-daily.timer apt-daily-upgrade.timer man-db.timer motd-news.timer \
            fwupd-refresh.timer unattended-upgrades.service packagekit.service \
            docker.socket docker.service containerd.service snapd.socket snapd.service \
            php8.3-fpm.service mysql.service postgresql.service mono-xsp4.service \
            ModemManager.service udisks2.service multipathd.socket multipathd.service; do
            if systemctl is-active --quiet "$unit"; then
              sudo systemctl stop "$unit" && echo "Stopped $unit." || true
            fi
          done
          free -m

      - name: Start virtual display and VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # The windowed emulator (unlike -no-window) links PulseAudio and Qt's
          # X11 plugins; without them qemu exits at once and adb times out.
          sudo apt-get install -y -qq xvfb x11vnc xdotool x11-utils \
            libpulse0 libnss3 libxkbfile1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libgl1 libegl1 >/dev/null
          setsid nohup Xvfb :99 -screen 0 720x1280x24 >/dev/null 2>&1 &
          sleep 2
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$VNC_PASSWORD" ~/.vnc/passwd >/dev/null
          # localhost only; Tailscale serve is the sole way in.
          x11vnc -display :99 -localhost -rfbauth ~/.vnc/passwd -forever -shared -bg -quiet -o /tmp/x11vnc.log
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Join the tailnet
        env:
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null

          # Same machine identity as last run means the same tailnet IP.
          if grep -qx 'tailscaled.state.enc' /tmp/state-assets.txt; then
            gh release download "$STATE_TAG" -R "$PRIVATE_REPO" -p tailscaled.state.enc -D /tmp
            sudo systemctl stop tailscaled
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in /tmp/tailscaled.state.enc \
              | sudo tee /var/lib/tailscale/tailscaled.state >/dev/null
            sudo chmod 600 /var/lib/tailscale/tailscaled.state
            sudo systemctl start tailscaled
            rm /tmp/tailscaled.state.enc
            echo "Tailscale identity restored."
          else
            echo "No saved Tailscale identity; joining as a new machine."
          fi

          # The auth key is only used when the restored identity is missing or
          # was deleted. Not ephemeral, so the machine and its IP outlive the run.
          secret="$(printf '%s' "$TAILSCALE_OAUTH_CLIENT_SECRET" | tr -d '[:space:]')"
          sudo tailscale up --authkey="${secret}?ephemeral=false&preauthorized=true" \
            --advertise-tags="$TAILSCALE_TAGS" --hostname=android-emulator

          # Saved straight away, so a cancelled run still keeps the identity.
          sudo cat /var/lib/tailscale/tailscaled.state \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -out /tmp/tailscaled.state.enc
          gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" /tmp/tailscaled.state.enc --clobber
          rm /tmp/tailscaled.state.enc
          # Tailnet only: neither port is published on the runner's public interface.
          sudo tailscale serve --bg --tcp 5555 tcp://localhost:5555 >/dev/null
          sudo tailscale serve --bg --tcp 5900 tcp://localhost:5900 >/dev/null
          echo "Joined the tailnet as android-emulator."

      # Before the exit node goes on, so the install is direct.
      - uses: actions/setup-node@v4
        if: ${{ env.AUTOPLAY == 'true' }}
        with:
          node-version: 24

      - name: Install the PineDrama script's dependency
        if: ${{ env.AUTOPLAY == 'true' }}
        run: npm install --prefix .github/scripts/pinedrama --no-package-lock --no-audit --no-fund

      # `script` runs line by line, so the session logic lives in its own file.
      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator
        env:
          MAX_MINUTES: ${{ inputs.max_minutes || 120 }}
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
        with:
          # Android 15, the best-tested Play Store x86_64 image on CI. The
          # Android 17 image bootlooped (Pixel Launcher crashing) under
          # software graphics. Pinned, not "latest": a new image breaks the
          # saved AVD, so bump it by hand and run once with `fresh`.
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          avd-name: session
          # Reuse the restored AVD instead of recreating it over the saved data.
          force-avd-creation: false
          # Every animation frame is drawn on the CPU; off, taps settle at once.
          disable-animations: true
          # Typing over VNC goes straight to the device.
          enable-hw-keyboard: true
          # Without a profile the AVD gets a 320x640 screen, default RAM and 2
          # cores, and a Play Store image never finishes booting. The runner
          # has 4 vCPUs and 16 GB. The config script sets the RAM as well,
          # since a restored AVD keeps the size it was created with.
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 512M
          disk-size: 8G
          # No -no-window: the window is drawn on Xvfb for VNC. -no-snapshot:
          # every run cold boots (a few minutes) from the saved disk, which
          # keeps all app data and logins. Quick-resume snapshots hung the boot
          # when one failed to load ("Missing section footer ... Error -22").
          # No cameras: the default back camera renders a 3D scene on the CPU.
          # -dns-server: public resolvers, reached through the exit node. The
          # default relays to the runner's resolver, which goes through
          # Tailscale's MagicDNS and timed out in Android every so often.
          # -HardwareDecoder: video is decoded inside Android, not by the
          # emulator on the host; qemu died silently minutes into PineDrama
          # playback twice with host decoding (hwcodec.*dec=2), memory fine.
          # -Vulkan,-GLESDynamicVersion: Android gets OpenGL ES 2 only and no
          # Vulkan. With ES 3, opening PineDrama's coin tab (SparkActivity, a
          # Lynx AnimaX animation) segfaulted qemu's RenderThread within a
          # second, every time, with every -gpu mode and emulator 36 and 37.
          emulator-options: -feature -HardwareDecoder,-Vulkan,-GLESDynamicVersion -no-snapshot -dns-server 1.1.1.1,8.8.8.8 -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          # A cold first boot on software graphics can pass the 600s default.
          emulator-boot-timeout: 900
          # Pinned emulator 36.2.12 (Oct 2025): a new emulator is picked up only
          # after testing it, not on whatever run first gets it. Builds:
          # dl.google.com/android/repository/emulator-linux_x64-<build>.zip.
          emulator-build: 14214601
          # Shrinks the screen to 720x1280 (frames are drawn on the CPU). Xvfb
          # above is the same size; the session script fills it with the window.
          # The exit node goes on here, after the SDK and system image downloads.
          pre-emulator-launch-script: |
            bash .github/scripts/android-emulator-exit-node.sh
            bash .github/scripts/android-emulator-config.sh
          script: bash .github/scripts/android-emulator-session.sh

      # Before Save state, so the upload goes straight to GitHub.
      - name: Leave the exit node
        if: ${{ always() && env.USE_EXIT_NODE == 'true' }}
        run: sudo tailscale set --exit-node= || true

      - name: Save state
        # Whenever the emulator ran, however its step ended (stop file, failure,
        # crash, cancel): the AVD may hold work done over VNC. Not when it never
        # ran (an earlier step failed: the AVD may be half restored).
        if: ${{ always() && (steps.emulator.outcome == 'success' || steps.emulator.outcome == 'failure' || steps.emulator.outcome == 'cancelled') }}
        run: |
          set -euo pipefail
          # Failed before launch (e.g. the exit node check): the AVD is as restored.
          if [ ! -e /tmp/emulator-launched ]; then
            echo "The emulator never started; nothing to save."
            exit 0
          fi
          id="${{ github.run_id }}"
          adb="$ANDROID_HOME/platform-tools/adb"
          if [ "${{ steps.emulator.outcome }}" = cancelled ] && pgrep -f qemu-system-x86_64 >/dev/null; then
            # Cancelled with the emulator up: flush the guest's disk, then stop it.
            timeout 60 "$adb" -s emulator-5554 shell sync || true
            timeout 30 "$adb" -s emulator-5554 emu kill || true
          fi
          # The disk images are complete only once qemu has exited.
          for _ in $(seq 1 90); do
            pgrep -f qemu-system-x86_64 >/dev/null || break
            sleep 2
          done
          if pgrep -f qemu-system-x86_64 >/dev/null; then
            echo "::warning::Emulator still running after 3 minutes; killing it."
            sudo pkill -9 -f qemu-system-x86_64 || true
          fi
          # Every run cold boots (-no-snapshot); an old snapshot would only
          # add gigabytes to the upload.
          rm -rf ~/.android/avd/session.avd/snapshots
          mkdir -p /tmp/save
          cd /tmp/save
          # Release assets cap at 2 GiB each.
          tar -C ~/.android/avd -cS --zstd --exclude='*.lock' . \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:STATE_KEY \
            | split -b 1900M -d -a 3 - "state-${id}.part-"
          sha256sum state-"${id}".part-* > "state-${id}.sha256"
          gh release view "$STATE_TAG" -R "$PRIVATE_REPO" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" -R "$PRIVATE_REPO" --title "Android emulator state" \
              --notes "Encrypted AVD saved by infrastructure-tools android-emulator-session." >/dev/null
          gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" state-"${id}".part-*
          gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" "state-${id}.sha256"
          # Old sets go only after the new manifest is up, so a failed upload
          # never loses the last good save. tailscaled.state.enc is kept.
          gh release view "$STATE_TAG" -R "$PRIVATE_REPO" --json assets -q '.assets[].name' \
            | { grep '^state-' || true; } \
            | { grep -v "^state-${id}\." || true; } \
            | while read -r name; do
                gh release delete-asset "$STATE_TAG" "$name" -R "$PRIVATE_REPO" -y >/dev/null
              done
          echo "State saved."

      # `down`, not `logout`: logout would expire the saved identity and the
      # next run would come back as a new machine with a new IP.
      - name: Disconnect from the tailnet
        if: always()
        run: sudo tailscale down >/dev/null 2>&1 || true
