name: "Run Bash Scripts on GCP VM"

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - init-n8n
          - init-portainer
          - init-dozzle
          - init-paseo-codex
          - init-paseo-lite
          - init-tailscale
          - test-codex-url
          - upsert-github-runner
          - optimize-vm
          - debug-cloud-init
          - reset-containers
          # add new script names here as you create them
      debug:
        description: "Show safe debug output (all output is sanitized: no secrets, IPs, emails or hostnames)"
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCP_VM_NAME: ${{ secrets.GCP_VM_NAME }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}

jobs:
  discover:
    name: "Discover scripts"
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List scripts
        id: list
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.script || 'all' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "all" ] || [ -z "$REQUESTED" ]; then
            # reset-*.sh are destructive (they stop what the init scripts start): only run when picked by name.
            # opi-*.sh are for the Orange Pi only (see orangepi-bash-script-runner.yaml).
            mapfile -t files < <(find bash-scripts -maxdepth 1 -type f -name '*.sh' ! -name 'reset-*.sh' ! -name 'opi-*.sh' | sort)
          else
            name="${REQUESTED%.sh}"
            files=("bash-scripts/${name}.sh")
          fi
          echo "[*] requested: ${REQUESTED:-all} -> ${#files[@]} script(s)"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "scripts=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing script(s): ${missing[*]}"
            exit 1
          fi
          printf '[*] selected: %s\n' "${files[@]}"
          json=$(printf '%s\n' "${files[@]}" | jq -R . | jq -s -c .)
          echo "scripts=$json" >> "$GITHUB_OUTPUT"

  run:
    name: "Run (${{ matrix.script }})"
    needs: discover
    if: needs.discover.outputs.scripts != '[]'
    runs-on: ubuntu-latest

    environment:
      name: "approve-${{ matrix.script }}"

    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.discover.outputs.scripts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run context (safe)
        env:
          SCRIPT_PATH: ${{ matrix.script }}
          DEBUG_LOGS: ${{ inputs.debug }}
        run: |
          echo "workflow : ${GITHUB_WORKFLOW}"
          echo "script   : ${SCRIPT_PATH}"
          echo "ref      : ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          echo "run      : #${GITHUB_RUN_NUMBER}, attempt ${GITHUB_RUN_ATTEMPT}"
          echo "runner   : ${RUNNER_OS}/${RUNNER_ARCH} ${ImageOS:-} ${ImageVersion:-}"
          echo "debug    : ${DEBUG_LOGS:-true}"

      - name: Verify required config
        run: |
          set -euo pipefail
          missing=()
          for v in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_VM_NAME GCP_ZONE; do
            [ -z "${!v:-}" ] && missing+=("$v") || true
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "[+] all 5 required GCP secrets are set"

      - name: Mask sensitive values
        run: |
          echo "::add-mask::${GCP_PROJECT_ID}"
          echo "::add-mask::${GCP_VM_NAME}"
          echo "::add-mask::${GCP_ZONE}"
          echo "::add-mask::${GCP_SERVICE_ACCOUNT}"
          echo "::add-mask::${GCP_WORKLOAD_IDENTITY_PROVIDER}"

      - name: Prepare log sanitizer
        run: |
          # Every line printed from the VM goes through this filter first. It is the safety net:
          # even if a script prints an IP, email, hostname or token, it is masked before it reaches
          # the log or the job summary.
          cat > "${RUNNER_TEMP}/sanitize.pl" <<'PERL'
          use strict;
          use warnings;
          my @lit = grep { defined($_) && length($_) >= 3 }
            map { $ENV{$_} } qw(GCP_PROJECT_ID GCP_VM_NAME GCP_ZONE GCP_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER);
          my $h = '[0-9A-Fa-f]{1,4}';
          while (my $l = <>) {   # reads files given as arguments, or stdin
            for my $v (@lit) { $l =~ s/\Q$v\E/<redacted>/g; }
            $l =~ s/\b(?:\d{1,3}\.){3}\d{1,3}\b/<ip>/g;
            $l =~ s/(?<![\w:.])(?:(?:$h:){7}$h|(?:$h:){1,7}:(?:$h(?::$h){0,6})?|::(?:$h(?::$h){0,6})?)(?![\w:])/<ipv6>/g;
            $l =~ s{(://)[^/\s@]+@}{$1<creds>@}g;
            $l =~ s/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/<email>/g;
            $l =~ s/\b[\w-]+(?:\.[\w-]+)*\.ts\.net\b/<tailnet-host>/g;
            $l =~ s/tskey-[\w-]+/tskey-<redacted>/g;
            $l =~ s/\b(?:gh[pousr]_|github_pat_)\w+/<github-token>/g;
            $l =~ s/\bsk-[\w-]{8,}/<api-key>/g;
            $l =~ s/\bBearer\s+\S+/Bearer <redacted>/gi;
            $l =~ s/((?:authkey|auth_key|token|password|passwd|secret|api[_-]?key)\s*[=:]\s*)(?!(?:set|unset)\b)\S+/$1<redacted>/gi;
            print $l;
          }
          PERL
          perl -c "${RUNNER_TEMP}/sanitize.pl"

      - name: Restore gcloud SDK cache
        id: gcloud-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/google-cloud-sdk
            ~/.config/gcloud
          key: gcloud-sdk-${{ runner.os }}-v1
          restore-keys: |
            gcloud-sdk-${{ runner.os }}-

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: ${{ steps.gcloud-cache.outputs.cache-hit == 'true' }}

      - name: Configure gcloud and SSH
        run: |
          {
            gcloud config set project "${GCP_PROJECT_ID}" --quiet
            gcloud config set compute/zone "${GCP_ZONE}" --quiet
            gcloud config set core/verbosity error --quiet
          } >/dev/null 2>&1

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          StrictHostKeyChecking=no
          UserKnownHostsFile=/dev/null
          LogLevel=ERROR
          ServerAliveInterval=30
          EOF
          chmod 600 ~/.ssh/config

      - name: Preflight checks (safe, never fails the run)
        continue-on-error: true
        run: |
          set +e
          echo "[*] cloud sdk: $(gcloud --version 2>/dev/null | head -n 1)"
          ACCOUNTS=$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | wc -l)
          echo "[*] active gcloud credentials: ${ACCOUNTS}"

          # Only non-identifying fields are printed: status, machine type, and whether an external
          # IPv4 exists (yes/no). The address itself is never printed.
          STATUS=$(gcloud compute instances describe "${GCP_VM_NAME}" --zone="${GCP_ZONE}" \
                     --format='value(status)' 2>/dev/null)
          if [ -z "$STATUS" ]; then
            echo "[!] could not read VM details (missing compute.instances.get permission, wrong name or wrong zone)"
          else
            MTYPE=$(gcloud compute instances describe "${GCP_VM_NAME}" --zone="${GCP_ZONE}" \
                      --format='value(machineType.basename())' 2>/dev/null)
            EXT=$(gcloud compute instances describe "${GCP_VM_NAME}" --zone="${GCP_ZONE}" \
                    --format='value(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null)
            echo "[*] vm status: ${STATUS} | machine type: ${MTYPE:-unknown} | external IPv4: $([ -n "$EXT" ] && echo yes || echo no)"
            [ "$STATUS" = "RUNNING" ] || echo "[!] VM is not RUNNING; the IAP SSH step will fail"
          fi

      - name: Preload runner image to VM
        if: ${{ matrix.script == 'bash-scripts/upsert-github-runner.sh' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/youssefbrr/self-hosted-runner:latest"
          if gcloud compute ssh "${GCP_VM_NAME}" \
              --zone="${GCP_ZONE}" \
              --tunnel-through-iap \
              --quiet \
              --ssh-key-expire-after=5m \
              --command="docker image inspect '${IMAGE}' >/dev/null 2>&1"; then
            echo "[*] ${IMAGE} already loaded on VM"
            exit 0
          fi
          echo "[*] pulling ${IMAGE} on runner"
          docker pull "${IMAGE}"
          echo "[*] loading ${IMAGE} into VM"
          docker save "${IMAGE}" | gcloud compute ssh "${GCP_VM_NAME}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --ssh-key-expire-after=15m \
            --command="docker load"

      - name: Verify script exists locally
        env:
          SCRIPT_PATH: ${{ matrix.script }}
        run: |
          if [ ! -f "${SCRIPT_PATH}" ]; then
            echo "::error::Script not found: ${SCRIPT_PATH}"
            ls -la bash-scripts/ || true
            exit 1
          fi
          echo "[*] script: ${SCRIPT_PATH}"

      - name: Run script via IAP SSH
        env:
          SCRIPT_PATH: ${{ matrix.script }}
          DEBUG_LOGS: ${{ inputs.debug }}
          # Comma-separated prefixes; only env vars starting with one of them reach the VM.
          # Secrets are named one by one below (not toJSON(secrets)) so the runner only ever holds
          # the ones the scripts read; a secret a script starts reading must be added to the list.
          # N8N_ lets a secret N8N_ENCRYPTION_KEY override the key the script generates
          # and persists in /etc/n8n/n8n.env. The script refuses to start if the supplied
          # key differs from the one already on disk, since that would orphan credentials.
          # ANTHROPIC_ / CLAUDE_CODE_ forward Claude Code auth to init-paseo-codex.sh and init-paseo-lite.sh
          # (CLAUDE_CODE_OAUTH_TOKEN for subscription, ANTHROPIC_API_KEY for usage billing,
          # ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL for BYOK).
          # GH_USERNAME / GH_EMAIL set the global git identity inside the paseo-lite container.
          # DOZZLE_ forwards DOZZLE_PASSWORD (and optional overrides) to init-dozzle.sh.
          SECRET_FILTER: "CODEX_,GH_TOKEN,GH_USERNAME,GH_EMAIL,TAILSCALE_AUTH_KEY,TAILSCALE_PING_PEER,GH_RUNNER_,N8N_,ANTHROPIC_,CLAUDE_CODE_,DOZZLE_"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${{ secrets.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ secrets.CLAUDE_CODE_MAX_OUTPUT_TOKENS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          CODEX_IDLE_SECS: ${{ secrets.CODEX_IDLE_SECS }}
          CODEX_MAX_TOKEN: ${{ secrets.CODEX_MAX_TOKEN }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          DOZZLE_ADDR: ${{ secrets.DOZZLE_ADDR }}
          DOZZLE_AUTH_PROVIDER: ${{ secrets.DOZZLE_AUTH_PROVIDER }}
          DOZZLE_AUTH_TTL: ${{ secrets.DOZZLE_AUTH_TTL }}
          DOZZLE_AUTO_UPDATE: ${{ secrets.DOZZLE_AUTO_UPDATE }}
          DOZZLE_BIND: ${{ secrets.DOZZLE_BIND }}
          DOZZLE_CPU_LIMIT: ${{ secrets.DOZZLE_CPU_LIMIT }}
          DOZZLE_DATA_DIR: ${{ secrets.DOZZLE_DATA_DIR }}
          DOZZLE_DISABLE_AVATARS: ${{ secrets.DOZZLE_DISABLE_AVATARS }}
          DOZZLE_DISABLE_SETUP_WIZARD: ${{ secrets.DOZZLE_DISABLE_SETUP_WIZARD }}
          DOZZLE_ENABLE_ACTIONS: ${{ secrets.DOZZLE_ENABLE_ACTIONS }}
          DOZZLE_ENABLE_MCP: ${{ secrets.DOZZLE_ENABLE_MCP }}
          DOZZLE_ENABLE_SHELL: ${{ secrets.DOZZLE_ENABLE_SHELL }}
          DOZZLE_HOSTNAME: ${{ secrets.DOZZLE_HOSTNAME }}
          DOZZLE_IMAGE: ${{ secrets.DOZZLE_IMAGE }}
          DOZZLE_IMAGE_CHECK_MODE: ${{ secrets.DOZZLE_IMAGE_CHECK_MODE }}
          DOZZLE_LEVEL: ${{ secrets.DOZZLE_LEVEL }}
          DOZZLE_MEMORY_LIMIT: ${{ secrets.DOZZLE_MEMORY_LIMIT }}
          DOZZLE_NO_ANALYTICS: ${{ secrets.DOZZLE_NO_ANALYTICS }}
          DOZZLE_PASSWORD: ${{ secrets.DOZZLE_PASSWORD }}
          DOZZLE_PASSWORD_FILE: ${{ secrets.DOZZLE_PASSWORD_FILE }}
          DOZZLE_PORT: ${{ secrets.DOZZLE_PORT }}
          DOZZLE_RELEASE_CHECK_MODE: ${{ secrets.DOZZLE_RELEASE_CHECK_MODE }}
          DOZZLE_REPLACE_PORTAINER: ${{ secrets.DOZZLE_REPLACE_PORTAINER }}
          DOZZLE_SHELL: ${{ secrets.DOZZLE_SHELL }}
          DOZZLE_USER: ${{ secrets.DOZZLE_USER }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_RUNNER_CONTAINER_NAME: ${{ secrets.GH_RUNNER_CONTAINER_NAME }}
          GH_RUNNER_DISABLE_AUTO_UPDATE: ${{ secrets.GH_RUNNER_DISABLE_AUTO_UPDATE }}
          GH_RUNNER_EPHEMERAL: ${{ secrets.GH_RUNNER_EPHEMERAL }}
          GH_RUNNER_LABELS: ${{ secrets.GH_RUNNER_LABELS }}
          GH_RUNNER_NAME: ${{ secrets.GH_RUNNER_NAME }}
          GH_RUNNER_REG_TOKEN: ${{ secrets.GH_RUNNER_REG_TOKEN }}
          GH_RUNNER_REPO: ${{ secrets.GH_RUNNER_REPO }}
          GH_RUNNER_WORK_DIR: ${{ secrets.GH_RUNNER_WORK_DIR }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          N8N_BACKUP_DIR: ${{ secrets.N8N_BACKUP_DIR }}
          N8N_BACKUP_ENABLED: ${{ secrets.N8N_BACKUP_ENABLED }}
          N8N_BACKUP_KEEP: ${{ secrets.N8N_BACKUP_KEEP }}
          N8N_BACKUP_SCRIPT: ${{ secrets.N8N_BACKUP_SCRIPT }}
          N8N_CONFIG_DIR: ${{ secrets.N8N_CONFIG_DIR }}
          N8N_CONTAINER_NAME: ${{ secrets.N8N_CONTAINER_NAME }}
          N8N_CPU_LIMIT: ${{ secrets.N8N_CPU_LIMIT }}
          N8N_DEFAULT_BINARY_DATA_MODE: ${{ secrets.N8N_DEFAULT_BINARY_DATA_MODE }}
          N8N_DIAGNOSTICS_ENABLED: ${{ secrets.N8N_DIAGNOSTICS_ENABLED }}
          N8N_EDITOR_BASE_URL: ${{ secrets.N8N_EDITOR_BASE_URL }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_EXECUTIONS_TIMEOUT: ${{ secrets.N8N_EXECUTIONS_TIMEOUT }}
          N8N_HEALTH_TIMEOUT: ${{ secrets.N8N_HEALTH_TIMEOUT }}
          N8N_HIRING_BANNER_ENABLED: ${{ secrets.N8N_HIRING_BANNER_ENABLED }}
          N8N_HOST: ${{ secrets.N8N_HOST }}
          N8N_IMAGE: ${{ secrets.N8N_IMAGE }}
          N8N_LISTEN_ADDRESS: ${{ secrets.N8N_LISTEN_ADDRESS }}
          N8N_MAX_OLD_SPACE_MB: ${{ secrets.N8N_MAX_OLD_SPACE_MB }}
          N8N_MEMORY_LIMIT: ${{ secrets.N8N_MEMORY_LIMIT }}
          N8N_PORT: ${{ secrets.N8N_PORT }}
          N8N_PROTOCOL: ${{ secrets.N8N_PROTOCOL }}
          N8N_PUBLIC_URL: ${{ secrets.N8N_PUBLIC_URL }}
          N8N_REQ_MB: ${{ secrets.N8N_REQ_MB }}
          N8N_RESERVED_MEMORY_MB: ${{ secrets.N8N_RESERVED_MEMORY_MB }}
          N8N_SAMESITE_COOKIE: ${{ secrets.N8N_SAMESITE_COOKIE }}
          N8N_SECURE_COOKIE: ${{ secrets.N8N_SECURE_COOKIE }}
          N8N_SYSTEMD_DIR: ${{ secrets.N8N_SYSTEMD_DIR }}
          N8N_TEMPLATES_ENABLED: ${{ secrets.N8N_TEMPLATES_ENABLED }}
          N8N_TIMEZONE: ${{ secrets.N8N_TIMEZONE }}
          N8N_VERSION_NOTIFICATIONS_ENABLED: ${{ secrets.N8N_VERSION_NOTIFICATIONS_ENABLED }}
          N8N_VOLUME_NAME: ${{ secrets.N8N_VOLUME_NAME }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_PING_PEER: ${{ secrets.TAILSCALE_PING_PEER }}
        run: |
          set +e
          SECONDS=0
          SAN="${RUNNER_TEMP}/sanitize.pl"
          DEBUG_LOGS="${DEBUG_LOGS:-true}"
          umask 077
          LOG=$(mktemp)
          PAYLOAD=$(mktemp)
          trap 'rm -f "$LOG" "$PAYLOAD"' EXIT

          # Build the payload: `export KEY='value'` lines + the script itself.
          # %q does shell-safe quoting so values with spaces / quotes / newlines survive.
          # An unset secret arrives as an empty string, which is skipped.
          {
            IFS=',' read -ra PREFIXES <<< "$SECRET_FILTER"
            for p in "${PREFIXES[@]}"; do
              while IFS= read -r v; do
                [ -n "${!v}" ] && printf 'export %s=%q\n' "$v" "${!v}"
              done < <(compgen -e | grep "^$p" || true)
            done
            printf 'export TS_HOSTNAME=%q\n' "${GCP_VM_NAME}"
            printf 'export VERBOSE=0\n'
            if [ "$DEBUG_LOGS" = "true" ]; then printf 'export INIT_DEBUG=1\n'; else printf 'export INIT_DEBUG=0\n'; fi
            cat "${SCRIPT_PATH}"
          } > "$PAYLOAD"

          # Names only, never values.
          NAMES=$(grep -oE '^export [A-Za-z_][A-Za-z0-9_]*' "$PAYLOAD" | awk '{print $2}' | sort -u | paste -sd' ' -)
          SHA=$(sha256sum "${SCRIPT_PATH}" | cut -c1-12)
          echo "::group::Run context (safe)"
          {
            echo "[*] script: ${SCRIPT_PATH} ($(wc -l < "${SCRIPT_PATH}") lines, sha256 ${SHA})"
            echo "[*] payload: $(wc -c < "$PAYLOAD") bytes"
            echo "[*] env forwarded to the VM: $(echo "$NAMES" | wc -w) variables (values are never printed)"
            echo "[*] variable names: ${NAMES}"
            echo "[*] debug logs: ${DEBUG_LOGS}"
          } | perl "$SAN"
          echo "::endgroup::"

          gcloud compute ssh "${GCP_VM_NAME}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --ssh-key-expire-after=5m \
            --command="bash -s" \
            < "$PAYLOAD" > "$LOG" 2>&1
          RC=$?
          DUR=$SECONDS
          set -e

          # Only structured lines from the scripts, sanitized. [d] = debug, shown when debug is on.
          # Always returns 0 (grep exits 1 when nothing matches, which must not abort the step).
          show() {
            if [ "$DEBUG_LOGS" = "true" ]; then
              grep -aE '^\[[*>+!xd]\] |^\[✓\] ' "$LOG" | perl "$SAN" || true
            else
              grep -aE '^\[[*>+!x]\] |^\[✓\] ' "$LOG" | perl "$SAN" || true
            fi
          }
          # grep -c exits 1 when it counts 0; `|| true` keeps `set -e` from killing the step before the hints below
          STRUCT_LINES=$(grep -acE '^\[[*>+!xd]\] |^\[✓\] ' "$LOG" || true)
          STRUCT_LINES="${STRUCT_LINES:-0}"

          summary() {
            {
              echo "### \`${SCRIPT_PATH##*/}\`: $1"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| exit code | ${RC} |"
              echo "| duration | ${DUR}s |"
              echo "| script sha256 | \`${SHA}\` |"
              echo "| env variables forwarded | $(echo "$NAMES" | wc -w) |"
              echo "| output lines captured | ${STRUCT_LINES} |"
              echo ""
              echo "<details><summary>Output (sanitized)</summary>"
              echo ""
              echo '```text'
              show | tail -n 200
              echo '```'
              echo "</details>"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          if [ "$RC" -eq 0 ]; then
            echo "[*] script completed successfully in ${DUR}s"
            echo "::group::Script output (sanitized)"
            show || true
            echo "::endgroup::"
            # Surface warnings as annotations on the run page (max 5)
            { show | grep -a '^\[!\] ' | head -n 5 | while IFS= read -r w; do echo "::warning::${w#\[!\] }"; done; } || true
            summary "succeeded"
            exit 0
          fi

          echo "::error::Script ${SCRIPT_PATH} failed (exit ${RC}) after ${DUR}s"
          if [ "$STRUCT_LINES" -eq 0 ]; then
            echo "[!] the script produced no output: it most likely never started."
            echo "[!] Check: VM is RUNNING (see Preflight), IAP firewall rule for TCP 22 from the IAP range, and the service account's IAP-secured Tunnel User + Compute OS Login roles."
          fi
          if [ "$RC" -eq 255 ]; then
            echo "[!] exit 255 = the SSH/IAP connection itself failed (not the script)."
          fi
          echo "::group::Script output (sanitized)"
          show || true
          echo "::endgroup::"
          # Raw tail for cases where the script died without structured lines. Sanitized first
          # (masking, not dropping), then SSH/gcloud noise is removed.
          echo "---- diagnostic tail (sanitized) ----"
          perl "$SAN" "$LOG" | grep -avE \
            'Your (identification|public key)|key fingerprint|randomart|SHA256:|SSH keygen|WARNING|NumPy|Updating project|Waiting for SSH|Permanently added|external IP|To increase the performance|\+---|^\| |BEGIN [A-Z ]+KEY|PRIVATE KEY|Bearer |tskey-' \
            | tail -60 || true
          echo "---- end ----"
          summary "FAILED"
          exit "$RC"
