name: "Deploy Cloudflare Workers and Pages (private repo)"

# ---------------------------------------------------------------------------
# Deploys Cloudflare Workers whose source lives in a PRIVATE repository,
# using this PUBLIC repo's free GitHub-hosted runner minutes. Standard runners
# on public repos are unmetered, unlike the private-repo minute quota.
#
# HOW THIS WORKS
#   1. poll    - ask GitHub for the private repo's latest commit on the tracked
#                branch; compare with the last one deployed (cached).
#   2. detect  - checkout the private repo here and find every deployable
#                folder the push touched, and classify it:
#                  worker - a folder with wrangler.toml / .json / .jsonc that
#                          does NOT set pages_build_output_dir
#                  pages  - a wrangler config that sets pages_build_output_dir,
#                          or a folder with NO wrangler config that holds a
#                          `public/` directory, _headers or _routes.json
#                A wrangler config always wins: a folder that has one is a
#                Worker, so its own `public/` is read as assets, not as a
#                second Pages site. That is what lets a Worker and a Pages
#                site sit side by side in the same parent folder.
#   3. deploy  - install and build each one in a matrix, then either
#                `wrangler deploy` (Worker) or `wrangler pages deploy` (Pages).
#
#   A workflow can only be triggered by events inside the repo hosting it, so
#   there is no way to subscribe to pushes on another repository. This polls
#   instead, which means nothing at all is installed in the private repo.
#
#   Trade-off: latency is up to one cron interval, and scheduled workflows in
#   public repos are auto-disabled after ~60 days without repo activity. Run it
#   manually (force=true) if the schedule goes quiet.
#
# SECURITY MODEL -- read before enabling:
#   * This file is in a PUBLIC repo: visible to everyone, and forkable.
#   * CLOUDFLARE_API_TOKEN lives here and can deploy Workers and Pages.
#     Anyone who can push to this repo can change what gets deployed and
#     exfiltrate that token. Keep push access to trusted people only, and
#     scope the token to the minimum Workers/Pages/R2/KV resources it needs.
#   * Build output is reduced to pass/fail with paths stripped, so private file
#     names and source lines do not land in a public log. `wrangler deploy`
#     output is NOT redacted, because the URL it prints is the point of the run.
#
# SETUP
#   secret CLOUDFLARE_API_TOKEN     required
#   secret CLOUDFLARE_ACCOUNT_ID    required
#   secret PRIVATE_REPO_TOKEN       read access to the private repo (required)
#   secret PRIVATE_REPO             "owner/name" of the private repo -- NOT a
#                                   URL; it is used to build an API path and is
#                                   passed to actions/checkout
#   secret BUILD_REF                branch to track (defaults to main)
#   secret CLOUDFLARE_PAGES_PREFIX  OPTIONAL. Prefix for generated Pages project
#                                   names. Pages project names are not taken
#                                   from the folder like a Worker script name is;
#                                   this workflow builds them as
#                                   "[prefix-]<folder>" (or "[prefix-]<repo>"
#                                   for a site at the repo root), lowercased,
#                                   with anything outside a-z0-9- turned into a
#                                   hyphen. Leave it unset and the bare folder
#                                   name is used, which is usually what you want
#                                   for a single site. Set it when the private
#                                   repo holds several sites whose folder names
#                                   would otherwise be too generic, or when the
#                                   name has to be unique account-wide.
#
# CLOUDFLARE PAGES NOTES
#   * The token needs the "Cloudflare Pages: Edit" permission, not just the
#     Workers one, or the Pages deploy fails with a permissions error.
#   * A Pages project that does not exist yet is CREATED automatically, with
#     the tracked branch as its production branch. A Worker that does not
#     exist yet still fails, as it always has.
#   * The Pages project name and the build output directory are read from the
#     project's own wrangler config (`name` and `pages_build_output_dir`) when
#     it has one, and fall back to the folder name and the project directory.
#   * A Pages project with no `build` script in package.json is uploaded as-is;
#     the build output directory must already exist and be non-empty. A folder
#     detected by its `public/` directory uploads that directory.
#   * `--commit-dirty=true` is passed deliberately: the build output makes the
#     working tree dirty, and wrangler's own clean-tree check would otherwise
#     abort every Pages deploy in CI.
#
# RUNNING IT BY HAND
#   Re-run with `force` checked to deploy every worker, even when the private
#   repo has not moved since the last successful deploy. Without force, a run
#   with no new commit stops at the poll job.
#
# WHAT COUNTS AS "DEPLOYED"
#   The last deployed commit is recorded by the `record` job, and only when the
#   whole attempt is clean (every deploy succeeded, or there was nothing to
#   do). A failed deploy therefore leaves the commit unrecorded and the next
#   run retries it, instead of skipping it as "nothing new".
# ---------------------------------------------------------------------------

on:
  # Scheduled polling is DISABLED. To re-enable it, uncomment the two lines
  # below. It is off by default so the workflow does not poll -- and spend
  # runner minutes -- until the secrets are in place. Manual runs still work.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if the private repo has no new commits"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # `secrets` is NOT available in `concurrency` or in any `if:` condition, so
  # the group is keyed on this repo alone.
  group: cf-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'

jobs:
  # ------------------------------------------------------------------
  # Job 1: has the private repo moved?
  # ------------------------------------------------------------------
  poll:
    name: "Poll private repo"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      sha: ${{ steps.poll.outputs.sha }}
      ref: ${{ steps.poll.outputs.ref }}

    steps:
      # Restore BEFORE polling: the poll step reads this file to learn which
      # commit was last deployed SUCCESSFULLY.
      #
      # The `record` job writes this file with the run id in the cache key,
      # because a cache entry is immutable and this one is rewritten after
      # every clean deploy. `restore-keys` is what keeps the lookup working:
      # it takes the most recent matching entry, and the bare prefix also
      # matches entries saved under the older exact key.
      - name: Restore state for next poll
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cf-deploy-state.txt
          key: cf-deploy-state-${{ secrets.PRIVATE_REPO || github.repository }}
          restore-keys: |
            cf-deploy-state-${{ secrets.PRIVATE_REPO || github.repository }}-

      - name: Resolve repo and fetch latest commit
        id: poll
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CFG_REPO: ${{ secrets.PRIVATE_REPO }}
          CFG_REF: ${{ secrets.BUILD_REF }}
          # `inputs.force` is the typed boolean; `github.event.inputs.force` is
          # the raw form. Either can arrive empty depending on how the run was
          # dispatched, and an empty force is exactly why a "deploy regardless"
          # run can behave like an ordinary one and skip the deploy job.
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail

          # Accept every shape a boolean input can arrive in. GitHub
          # interpolates a `type: boolean` input as "true"/"false", but a
          # dispatch built from the raw event payload can hand over 1/yes/on.
          # Testing for the literal string "true" alone ignores those.
          force_on() {
            case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          # ${VAR:-} everywhere: under `set -u` an unset variable is fatal.
          TOKEN="${GH_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No credential: set secret PRIVATE_REPO_TOKEN."
            exit 1
          fi

          REPO="${CFG_REPO:-}"
          # Strict owner/name: no metacharacters, no traversal, no leading dash.
          if ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Set secret PRIVATE_REPO to 'owner/name'; got '${REPO}'."
            exit 1
          fi
          REF="${CFG_REF:-main}"

          if ! RESP=$(GH_TOKEN="$TOKEN" gh api "repos/${REPO}/commits/${REF}" --jq '.sha' 2>/dev/null); then
            echo "::error::Cannot read ${REPO}@${REF}. Check the token has read access."
            exit 1
          fi
          if [ -z "$RESP" ]; then
            echo "::error::Empty response for ${REPO}@${REF}."
            exit 1
          fi

          PREV=""
          [ -f /tmp/cf-deploy-state.txt ] && PREV="$(cat /tmp/cf-deploy-state.txt)"

          echo "Tracked:    $REPO@$REF"
          echo "Latest:     ${RESP:0:12}"
          echo "Last deploy: ${PREV:-<none>}"

          CHANGED="false"
          if [ "$RESP" != "$PREV" ]; then
            CHANGED="true"
            echo "New commit detected."
          else
            echo "No new commit; nothing to deploy."
          fi

          echo "Force input received: '${FORCE:-<empty>}'"
          if force_on; then
            CHANGED="true"
            echo "force is ON; deploying regardless of the commit comparison."
          fi

          # Deliberately NOT written here. Recording the commit before the
          # deploy runs would make any later failure look like "nothing new"
          # on the next poll, and that commit would never be retried. The
          # `record` job writes it, and only after a clean attempt.
          {
            echo "changed=$CHANGED"
            echo "sha=$RESP"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Poll"
            echo
            echo "- Changed: \`${{ steps.poll.outputs.changed }}\`"
            echo "- Force: \`${{ inputs.force || github.event.inputs.force || 'false' }}\`"
            echo "- Ref: \`${{ steps.poll.outputs.ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Job 2: which Worker folders in the private repo need deploying?
  # ------------------------------------------------------------------
  detect:
    name: "Detect projects"
    needs: poll
    if: ${{ needs.poll.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.detect.outputs.projects }}
      # A plain integer cannot contain a secret, so it always survives. The
      # record job uses it to detect the case where GitHub dropped `projects`.
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.ref }}
          # Keep the token out of .git/config so later steps cannot leak it.
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      # The diff base is the last commit that deployed cleanly, which is
      # exactly the state the poll job reads. Restored here because detect
      # runs on a different runner than poll.
      - name: Restore last deployed commit
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cf-deploy-state.txt
          key: cf-deploy-state-${{ secrets.PRIVATE_REPO || github.repository }}
          restore-keys: |
            cf-deploy-state-${{ secrets.PRIVATE_REPO || github.repository }}-

      - name: Find changed Workers and Pages projects
        id: detect
        working-directory: private
        shell: bash
        env:
          TARGET_SHA: ${{ needs.poll.outputs.sha }}
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail

          force_on() {
            case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Compare against the last commit that deployed cleanly, so a push of
          # several commits is seen in full. Falls back to "deploy everything"
          # when that commit is not available locally.
          base=''
          if [ -f /tmp/cf-deploy-state.txt ]; then
            base="$(cat /tmp/cf-deploy-state.txt)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No comparable base commit; deploying every worker found."
            base=''
          fi

          # force=true means "deploy every worker", not merely "look at the
          # latest commit": without this, re-running with no new commits would
          # diff against the deployed commit, find nothing, and deploy
          # nothing -- the opposite of what force asks for.
          if force_on; then
            echo "force is ON; ignoring the diff and selecting every worker."
            base=''
          fi

          changed=()
          if [ -n "$base" ]; then
            mapfile -t changed < <(git diff --name-only "$base" "$TARGET_SHA")
          fi

          echo "Comparing ${base:-<nothing>}..${TARGET_SHA:0:12} (${#changed[@]} changed file(s)):"
          if [ ${#changed[@]} -eq 0 ]; then
            if [ -n "$base" ]; then
              echo "  (none; with a baseline this means nothing to deploy)"
            else
              echo "  (none, no baseline: selecting every worker)"
            fi
          else
            printf '  %s\n' "${changed[@]}"
          fi

          # Two kinds of target, collected into one list. A wrangler config
          # means a Worker -- unless it sets pages_build_output_dir, which is
          # how a Pages project declares itself. _headers and _routes.json are
          # filenames Cloudflare reserves for Pages and no other product reads,
          # so a folder holding one is a Pages project with no wrangler config
          # at all. Both markers are matched as FILES, never as directory
          # names, so an unrelated `src/functions/` cannot be mistaken for a
          # Pages project.
          mapfile -t configs < <(
            find . -path '*/node_modules' -prune -o \
              \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) -print | sort
          )
          mapfile -t markers < <(
            find . -path '*/node_modules' -prune -o \
              \( -name '_headers' -o -name '_routes.json' \) -print | sort
          )

          # Each candidate is "dir<TAB>config"; config is empty for a Pages
          # project identified only by a marker file.
          candidates=()
          for config in ${configs[@]+"${configs[@]}"}; do
            candidates+=("$(dirname "${config#./}")"$'\t'"${config#./}")
          done
          for marker in ${markers[@]+"${markers[@]}"}; do
            dir="$(dirname "${marker#./}")"
            known=0
            for candidate in ${candidates[@]+"${candidates[@]}"}; do
              if [ "${candidate%%$'\t'*}" = "$dir" ]; then
                known=1; break
              fi
            done
            if [ "$known" -eq 0 ]; then
              candidates+=("$dir"$'\t')
            fi
          done

          # A folder holding a `public/` directory is a plain static site, and
          # Pages is the only product that serves one that way. It becomes a
          # Pages project UNLESS the folder is already a candidate -- because
          # for a Worker that `public/` is its ASSETS directory, and deploying
          # it a second time as Pages would publish the same files twice.
          has_candidate() {
            local want="$1" c
            for c in ${candidates[@]+"${candidates[@]}"}; do
              if [ "${c%%$'\t'*}" = "$want" ]; then
                return 0
              fi
            done
            return 1
          }
          mapfile -t publics < <(
            find . -path '*/node_modules' -prune -o -type d -name 'public' -print | sort
          )
          for public_dir in ${publics[@]+"${publics[@]}"}; do
            dir="$(dirname "${public_dir#./}")"
            if has_candidate "$dir"; then
              echo "Skipping ${dir}/public: it is the assets directory of the project in that folder."
              continue
            fi
            candidates+=("$dir"$'\t')
            echo "Found static site ${dir}/public; treating it as a Pages project."
          done

          projects=()
          skipped=()
          # `${candidates[@]+"${candidates[@]}"}` and not `"${candidates[@]:-}"`:
          # the latter expands an EMPTY array to one empty string, and dirname
          # of that is "." -- inventing a phantom project at the repo root
          # that would then try to deploy the whole repository.
          for candidate in ${candidates[@]+"${candidates[@]}"}; do
            dir="${candidate%%$'\t'*}"
            config="${candidate#*$'\t'}"
            # A project at the repo root means the whole repo is one target;
            # keep it as "." and treat every change as relevant.
            reason=''
            # No baseline (first run, forced, or the recorded commit is no
            # longer available): deploy everything rather than risk skipping a
            # worker. WITH a baseline, an empty diff legitimately means this
            # push touched no project, and deploying everything would waste
            # the run.
            if [ -z "$base" ]; then
              reason='full'
            elif [ "$dir" = "." ]; then
              reason='changed'
            else
              for file in "${changed[@]}"; do
                case "$file" in
                  "$dir"/*|"$dir") reason='changed'; break ;;
                esac
              done
            fi
            if [ -z "$reason" ]; then
              skipped+=("$dir")
              continue
            fi
            lock=''
            if [ "$dir" = "." ]; then
              # Project lives at the repo root, so its lockfile does too.
              [ -f package-lock.json ] && lock="package-lock.json"
            else
              [ -f "$dir/package-lock.json" ] && lock="$dir/package-lock.json"
            fi

            # Classify, and record HOW it was decided so a wrong type shows up
            # in this log instead of silently deploying to the wrong product.
            #
            # A wrangler config is AUTHORITATIVE: if the folder has one and it
            # does not set pages_build_output_dir, it is a Worker, even if a
            # stray _headers, _routes.json or public/ is lying around. Only a
            # folder with NO config is classified from those signals, which is
            # what stops a Worker's own assets being published a second time.
            #
            #   explicit - the project's wrangler config declared Pages
            #   inferred  - no config, so a heuristic decided; worth a 2nd look
            #   config    - the config declared a Worker
            type=worker
            source='config'
            also_worker=0
            if [ -z "$config" ]; then
              type=worker
              source='none'
              if [ -f "$dir/_headers" ] || [ -f "$dir/_routes.json" ] || [ -d "$dir/public" ]; then
                type=pages
                source='inferred'
              fi
            elif grep -Eq 'pages_build_output_dir' "$config"; then
              type=pages
              source='explicit'
              # ONE config can declare both a Worker entrypoint and a Pages
              # output directory -- the Pages-migrated-but-still-a-Worker
              # case. Keep the Worker: emit a second entry so adding Pages
              # never silently removes the existing workers.dev deployment.
              #
              # Anchored to real config keys. A loose word search also matched
              # values -- `pages_build_output_dir = "./dist/main.js"` contains
              # "main" -- which invented a Worker for a Pages-only project and
              # failed the run on "Missing entry-point to Worker script".
              if grep -Eq '(^[[:space:]]*main[[:space:]]*=|^[[:space:]]*\[assets\]|^[[:space:]]*functions[[:space:]]*=|"(main|assets|functions)"[[:space:]]*:)' "$config"; then
                also_worker=1
                echo "  '$dir' declares pages_build_output_dir AND a Worker entrypoint; deploying both."
              fi
            fi
            if [ "$type" = pages ] && [ "$source" = inferred ]; then
              echo "  NOTE: '$dir' was inferred to be Pages from its files alone."
              echo "  Add a wrangler.toml to it with pages_build_output_dir = \"./public\" to declare this explicitly and pick the project name there."
            fi
            projects+=("$dir"$'\t'"$lock"$'\t'"$reason"$'\t'"$type"$'\t'"$source")
            if [ "$also_worker" -eq 1 ]; then
              # Same directory, different product. The Pages name comes from
              # the config's `name`, and Pages and Workers are separate
              # namespaces, so reusing it does not collide.
              projects+=("$dir"$'\t'"$lock"$'\t'"$reason"$'\t'"worker"$'\t'"config-dual")
            fi
          done

          echo "Deploying ${#projects[@]} project(s):"
          if [ ${#projects[@]} -eq 0 ]; then
            echo "  (none)"
            # A forced run that finds nothing is a misconfiguration, not a
            # reason to skip the deploy job quietly: there is no wrangler
            # config in the checkout, which almost always means the wrong repo
            # or the wrong branch.
            if force_on; then
              echo "::error::force was requested but no Cloudflare Worker or Pages project was found at ${TARGET_SHA:0:12}."
              echo "Check BUILD_REF points at the branch you meant, and that each folder contains a wrangler.toml, wrangler.json or wrangler.jsonc (Workers) -- or a _headers or _routes.json file (Pages)."
              exit 1
            fi
          else
            for project in "${projects[@]}"; do
              # Split on TAB only; a field may legitimately be empty.
              dir="${project%%$'\t'*}"
              rest="${project#*$'\t'}"
              lock="${rest%%$'\t'*}"
              rest="${rest#*$'\t'}"
              reason="${rest%%$'\t'*}"
              rest="${rest#*$'\t'}"
              type="${rest%%$'\t'*}"
              source="${rest#*$'\t'}"
              echo "  - $dir (type: $type via $source, reason: $reason, lockfile: ${lock:-none})"
            done
          fi
          if [ ${#skipped[@]} -gt 0 ]; then
            echo "Unchanged, skipping: ${skipped[*]}"
          fi

          # `dir`, `lock`, `reason` and `type` are all read out of the private
          # repository, never out of `secrets`. A Pages project name is derived
          # from a secret-prefixed value, so it is deliberately NOT in this
          # payload: GitHub silently discards any job output whose value
          # matches a secret, and that is what made the deploy job skip with no
          # visible reason. The deploy job computes the name instead.
          {
            echo "projects=$(node -e '
              const rows = process.argv.slice(1)
                .filter(Boolean)
                .map((row) => {
                  const [dir, lock, reason, type, source] = row.split("\t");
                  return { dir, lock, reason, type: type || "worker", source: source || "config" };
                });
              process.stdout.write(JSON.stringify(rows));
            ' "${projects[@]:-}")"
          } >> "$GITHUB_OUTPUT"

          # A bare integer, so it always survives even if GitHub drops the
          # `projects` output for containing a secret.
          echo "count=${#projects[@]}" >> "$GITHUB_OUTPUT"

          # No base is saved here. The `record` job writes the deployed commit
          # once the attempt has actually succeeded, which is also what the
          # next run diffs against.

      - name: Summary
        if: always()
        run: |
          {
            echo "### Detected projects"
            echo
            echo '```json'
            echo '${{ steps.detect.outputs.projects }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Job 3: deploy each detected worker
  # ------------------------------------------------------------------
  deploy:
    name: "Deploy ${{ matrix.project.dir }}"
    needs: [poll, detect]
    # '' when detect was skipped (nothing to deploy) or failed; '[]' when it
    # ran and found nothing.
    if: ${{ needs.detect.outputs.projects != '' && needs.detect.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'` is required, not defensive padding: when detect is skipped
        # its outputs are empty strings, and the matrix is built before this
        # job's `if` is evaluated. fromJSON('') raises "empty input" and fails
        # the run outright, which is how a no-op poll used to look like an
        # error.
        project: ${{ fromJSON(needs.detect.outputs.projects || '[]') }}

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.ref }}
          persist-credentials: false
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Only enable npm's cache when this project has a lockfile, else
          # setup-node fails with "Dependencies lock file is not found".
          cache: ${{ matrix.project.lock != '' && 'npm' || '' }}
          # The private repo is checked out into private/, so the lockfile
          # lives under that prefix. Paths here are workspace-relative;
          # omitting it makes setup-node report "Some specified paths were
          # not resolved, unable to cache dependencies".
          cache-dependency-path: private/${{ matrix.project.lock }}

      # The Pages project name and the build output directory are resolved
      # HERE, in the deploy job, rather than carried in the matrix. The name is
      # built from CLOUDFLARE_PAGES_PREFIX, which lives in `secrets`; a matrix
      # entry containing a secret is discarded by GitHub and the whole deploy
      # job skips with an empty matrix and no visible cause.
      - name: Resolve Pages project
        id: pages
        working-directory: private/${{ matrix.project.dir }}
        shell: bash
        env:
          PROJECT_DIR: ${{ matrix.project.dir }}
          PROJECT_TYPE: ${{ matrix.project.type }}
          CFG_REPO: ${{ secrets.PRIVATE_REPO }}
          PAGES_PREFIX: ${{ secrets.CLOUDFLARE_PAGES_PREFIX }}
          BUILD_REF: ${{ needs.poll.outputs.ref }}
        run: |
          set -euo pipefail

          # A project dir of "." means the project is the repo root itself.
          if [ "$PROJECT_DIR" = "." ]; then
            echo "ROOT=true" >> "$GITHUB_ENV"
            slug_source="${CFG_REPO##*/}"
          else
            echo "ROOT=false" >> "$GITHUB_ENV"
            slug_source="${PROJECT_DIR##*/}"
          fi

          # Reject a directory that could escape the checkout before it is ever
          # used as a path or handed to wrangler.
          case "$PROJECT_DIR" in
            /*|*..*)
              echo "::error::Unsafe project directory; check the layout of the private repo."
              exit 1 ;;
          esac

          config=''
          for candidate in wrangler.toml wrangler.json wrangler.jsonc; do
            if [ -f "$candidate" ]; then
              config="$candidate"
              break
            fi
          done

          # `name` and `pages_build_output_dir` from the project's own wrangler
          # config, when it has one. Fed to the loop by process substitution
          # rather than a pipe, because a pipe would run the loop in a subshell
          # and discard both variables.
          cfg_name=''
          cfg_out=''
          if [ -n "$config" ]; then
            while IFS='=' read -r key value; do
              case "$key" in
                CF_NAME) cfg_name="$value" ;;
                CF_OUT) cfg_out="$value" ;;
              esac
            done < <(node -e '
              const fs = require("fs");
              const p = process.argv[1];
              const raw = fs.readFileSync(p, "utf8");
              let name = "", out = "";
              if (/\.jsonc?$/.test(p)) {
                // jsonc: strip // comments, then try a real parse and fall
                // back to a regex so trailing commas do not lose the keys.
                const t = raw.replace(/^\s*\/\/.*$/gm, "");
                try {
                  const j = JSON.parse(t);
                  name = typeof j.name === "string" ? j.name : "";
                  out = typeof j.pages_build_output_dir === "string" ? j.pages_build_output_dir : "";
                } catch (e) { /* fall through to the regex below */ }
                if (!name) { const m = t.match(/"name"\s*:\s*"([^"]*)"/); if (m) name = m[1]; }
                if (!out) { const m = t.match(/"pages_build_output_dir"\s*:\s*"([^"]*)"/); if (m) out = m[1]; }
              } else {
                // toml: only keys above the first [section] header are top
                // level, so a `name` inside [env.production] cannot win.
                const top = raw.split(/^\s*\[/m)[0];
                const n = top.match(/^\s*name\s*=\s*"([^"]*)"/m);
                if (n) name = n[1];
                const o = top.match(/^\s*pages_build_output_dir\s*=\s*"([^"]*)"/m);
                if (o) out = o[1];
              }
              process.stdout.write("CF_NAME=" + name + "\nCF_OUT=" + out + "\n");
            ' "$config")
          fi

          if [ "$PROJECT_TYPE" != "pages" ]; then
            echo "Target type: worker (wrangler deploy)."
            exit 0
          fi

          # Pages project names allow only lowercase alphanumerics and hyphens.
          # Normalise whatever source we ended up with rather than failing on
          # a folder like "My_Site" that Pages would have rejected anyway.
          if [ -n "$cfg_name" ]; then
            name="$cfg_name"
          else
            name="$slug_source"
          fi
          name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$name" ]; then
            echo "::error::Could not derive a Cloudflare Pages project name for '${PROJECT_DIR}'."
            echo "Set a top-level 'name' in the project's wrangler config, or set secret CLOUDFLARE_PAGES_PREFIX."
            exit 1
          fi

          # The prefix is applied last so it is always honoured, and the raw
          # value is never echoed on its own.
          prefix="$(printf '%s' "${PAGES_PREFIX:-}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')"
          if [ -n "$prefix" ]; then
            name="${prefix}-${name}"
          fi
          if ! printf '%s' "$name" | grep -Eq '^[a-z0-9][a-z0-9-]*[a-z0-9]$'; then
            echo "::error::Derived Cloudflare Pages project name is not a valid Pages name."
            exit 1
          fi

          out="$cfg_out"
          if [ -z "$out" ]; then
            # A config-less Pages project detected by its `public/` directory
            # uploads that directory; a bare marker-only site uploads itself.
            if [ -d public ]; then
              out='./public'
            else
              out='.'
            fi
          fi
          case "$out" in
            /*|*..*)
              echo "::error::pages_build_output_dir must be a relative path inside the project."
              exit 1 ;;
          esac

          echo "Target type:  pages"
          echo "Pages name:   $name"
          echo "Build output: $out"
          echo "Branch:       ${BUILD_REF:-main}"

          {
            echo "app=$name"
            echo "out=$out"
            echo "branch=${BUILD_REF:-main}"
          } >> "$GITHUB_OUTPUT"

      # Cache the installed tree. Hosted runners are ephemeral, so `npm ci`
      # would otherwise delete and re-extract everything each run. Exact key
      # only (no restore-keys) so a dependency change can never be restored
      # against a stale node_modules.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: private/${{ matrix.project.dir }}/node_modules
          key: node-modules-${{ matrix.project.dir }}-${{ matrix.project.type }}-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-${{ hashFiles(format('private/{0}', matrix.project.lock)) }}

      - name: Cache wrangler state
        uses: actions/cache@v4
        with:
          path: |
            private/${{ matrix.project.dir }}/.wrangler
            ~/.cache/wrangler
            ~/.config/.wrangler
          key: wrangler-${{ matrix.project.dir }}-${{ matrix.project.type }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('private/{0}', matrix.project.lock)) }}
          restore-keys: |
            wrangler-${{ matrix.project.dir }}-${{ matrix.project.type }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        working-directory: private/${{ matrix.project.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json; skipping install."
          elif [ -f node_modules/.package-lock.json ] && [ node_modules/.package-lock.json -nt package-lock.json ]; then
            echo "node_modules restored from cache; skipping install."
          elif [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      # Build output names private files and dependencies. This repo is PUBLIC,
      # so capture it and emit only a pass/fail summary with paths stripped.
      - name: Build (dry run)
        working-directory: private/${{ matrix.project.dir }}
        shell: bash
        run: |
          set -euo pipefail

          run_quiet() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "$label: OK"
              rm -f "$log"; return 0
            fi
            echo "::error::$label failed (output suppressed to protect private source)"
            echo "--- last lines of $label (paths stripped to basenames) ---"
            tail -20 "$log" | sed -E 's#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g' || true
            echo "--- end ---"
            rm -f "$log"
            return 1
          }

          if [ -f package.json ]; then
            if grep -q '"build"[[:space:]]*:' package.json; then
              run_quiet "build" npm run build
            else
              echo "No 'build' script; nothing to do."
            fi
          elif [ -n "${{ steps.pages.outputs.app }}" ]; then
            # A Pages project with no package.json is a plain static site: the
            # files are committed as they are. `wrangler deploy --dry-run` is
            # NOT a valid check here -- there is no Worker entrypoint to
            # bundle, so it errors and would fail the build step for a project
            # that is perfectly fine. The directory check below is the real
            # validation.
            echo "No package.json; this is a static Pages site, nothing to build."
          else
            echo "No package.json; running wrangler dry-run directly."
            npx wrangler deploy --dry-run
          fi

          # A Pages deploy uploads a directory of files, so an empty or missing
          # build output is a silent no-op worth failing on here. The URL would
          # otherwise still be printed, as though the site had gone live.
          if [ "${{ steps.pages.outputs.app }}" ]; then
            out="${{ steps.pages.outputs.out }}"
            if [ ! -d "$out" ]; then
              echo "::error::Build output directory '$out' does not exist; the build step did not produce it."
              exit 1
            fi
            if [ -z "$(ls -A "$out" 2>/dev/null)" ]; then
              echo "::error::Build output directory '$out' is empty."
              exit 1
            fi
            echo "Pages output ready: $out ($(find "$out" -type f | wc -l) file(s))."
          fi

      # NOT redacted: the URL wrangler prints is the useful output here.
      - name: Deploy
        working-directory: private/${{ matrix.project.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ steps.pages.outputs.app }}" ]; then
            # Pages: create the project on first use, so a brand new site is
            # not a manual out-of-band step. On every later run the project
            # already exists and is simply updated -- creating again is treated
            # as success, never as an error.
            if npx wrangler pages project list --json 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d));
              process.stdin.on("end", () => {
                try {
                  const parsed = JSON.parse(s);
                  // Wrangler has returned this list both as a bare array and
                  // wrapped in a { result: ... } envelope, so accept either
                  // rather than treating a known project as absent.
                  const rows = Array.isArray(parsed)
                    ? parsed
                    : [parsed.result, parsed.projects, parsed.data].find(Array.isArray) || [];
                  const want = process.argv[1];
                  const hit = rows.some((r) => r && (r.name === want || r.project_name === want));
                  process.exit(hit ? 0 : 1);
                } catch (e) { process.exit(2); }
              });
            ' "${{ steps.pages.outputs.app }}"; then
              echo "Pages project already exists."
            else
              # The list check is a best effort: if it errored or returned a
              # shape we do not recognise, this runs and the API decides.
              echo "::warning::Cloudflare Pages project '${{ steps.pages.outputs.app }}' not found (or not listable); attempting to create it with production branch '${{ steps.pages.outputs.branch }}'."
              if ! create_out="$(npx wrangler pages project create "${{ steps.pages.outputs.app }}" \
                --production-branch "${{ steps.pages.outputs.branch }}" 2>&1)"; then
                # "Already exists" is success, not a failure: it means the
                # list was simply not authoritative. Failing here would block
                # every deploy of an existing project. Anything else is a real
                # error and is surfaced with wrangler's own message.
                if printf '%s' "$create_out" | grep -qiE 'already exists|8000002'; then
                  # Expected, not a problem: the list was not authoritative.
                  # Deliberately NOT echoing wrangler's output here -- it is a
                  # red ERROR block for a run that is about to succeed, and
                  # printing it makes a working deploy look broken.
                  echo "The Pages project already exists; updating it with this deployment."
                else
                  printf '%s\n' "$create_out"
                  exit 1
                fi
              fi
            fi

            # --commit-dirty=true is required, not cosmetic: the build output
            # and node_modules are untracked, so wrangler's own clean-tree
            # check would abort every Pages deploy in CI.
            npx wrangler pages deploy "${{ steps.pages.outputs.out }}" \
              --project-name "${{ steps.pages.outputs.app }}" \
              --branch "${{ steps.pages.outputs.branch }}" \
              --commit-hash "${{ needs.poll.outputs.sha }}" \
              --commit-dirty=true
            exit 0
          fi

          if [ ! -f package.json ]; then
            npx wrangler deploy
          elif node -e 'process.exit(require("./package.json").scripts?.deploy ? 0 : 1)' 2>/dev/null; then
            npm run deploy
          else
            echo "No deploy script; falling back to wrangler deploy."
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy: \`${{ matrix.project.dir }}\`"
            echo
            echo "- Type: \`${{ matrix.project.type }}\` (via \`${{ matrix.project.source }}\`)"
            echo "- Reason: \`${{ matrix.project.reason }}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Job 4: remember the commit that was actually deployed
  # ------------------------------------------------------------------
  record:
    name: "Record deployed commit"
    needs: [poll, detect, deploy]
    # Record once the attempt is fully accounted for: every deploy succeeded,
    # or there was nothing to deploy. A failed detect or deploy must NOT be
    # recorded -- otherwise the next poll sees no change and that commit is
    # never retried, which is how a deploy can be lost silently.
    #
    # `changed` also keeps a no-op poll from writing a fresh cache entry every
    # time. It costs nothing to skip: when there was no new commit the recorded
    # SHA is already the one we would write, and if the state was ever lost,
    # poll reports changed=true and it is written then.
    if: >-
      !cancelled() &&
      needs.poll.result == 'success' &&
      needs.poll.outputs.changed == 'true' &&
      (needs.detect.result == 'success' || needs.detect.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write deployed commit
        env:
          DEPLOYED_SHA: ${{ needs.poll.outputs.sha }}
          DETECT_COUNT: ${{ needs.detect.outputs.count }}
          DETECT_PROJECTS: ${{ needs.detect.outputs.projects }}
        run: |
          set -euo pipefail

          # GitHub drops a job output whose value matches a secret, leaving ''
          # here while detect still counted projects -- which would skip the
          # deploy job for no visible reason. `count` is a bare integer and
          # cannot be dropped, so the mismatch is detectable.
          if [ -n "${DETECT_COUNT:-}" ] && [ "${DETECT_COUNT}" != "0" ] && [ -z "${DETECT_PROJECTS:-}" ]; then
            echo "::error::GitHub discarded the 'projects' job output: it matched a repository secret, so the deploy job received an empty matrix."
            echo "Detect found ${DETECT_COUNT} project(s). A folder path here matches a secret value; rename that folder, or move the configuration out of \`secrets\` and into a file inside the repository."
            exit 1
          fi

          printf '%s' "$DEPLOYED_SHA" > /tmp/cf-deploy-state.txt
          echo "Recorded $DEPLOYED_SHA as the last deployed commit."

      # The run id is in the key because cache entries are immutable: this
      # state has to be rewritten after every clean deploy.
      - name: Save state for next poll
        uses: actions/cache/save@v4
        with:
          path: /tmp/cf-deploy-state.txt
          key: cf-deploy-state-${{ secrets.PRIVATE_REPO || github.repository }}-${{ github.run_id }}