name: Builder Tools - Build Orange Pi Zero 3 Armbian image

# Builds a minimal, locked-down Armbian (Debian trixie) image for the Orange Pi Zero 3 that only
# runs Docker: see builder-tools/opi-zero3-armbian/README.md.
#
#   unit       shellcheck, bats unit tests (opi-provision, configs vs the real Debian packages),
#              firewall integration test with real packets in network namespaces
#   build      the image, from the candidate Armbian commit
#   inspect    boot chain, board kernel Docker support, size, opi-selfcheck inside the image
#   simulate   boots the image's root filesystem in QEMU shaped like a Zero 3 (4x A53, 1 GiB):
#              provisioning, SSH, Docker, a real bash-scripts/ deploy, then apt upgrades + reboot
#   build-uwe5622     the uwe5622-mainline Wi-Fi driver (UWE5622_COMMIT) built against the image's
#                     exact kernel (Armbian's linux-headers package) and injected into a second
#                     image, ...-uwe5622-mainline.img.xz (overrides Armbian's in-tree driver)
#   inspect-uwe5622   that image: modules in updates/, vermagic, symbols, firmware, blacklist
#   simulate-uwe5622  the driver built for the simulation kernel: 10 load/unload rounds without
#                     the chip (no oops/WARN), then the usual checks
#   promote    upstream updates: every Monday `check` looks for new fixes on the pinned Armbian
#              release branch; the new head is built and tested as a candidate and only committed
#              to `variables` once everything above passed, so a breaking upstream change never
#              lands on main. A newer release branch (new kernel line, U-Boot, ...) is only
#              announced; it is tried when a manual run asks for it (input new_release).
#              The uwe5622-mainline main head is tried the same way and its pin (UWE5622_COMMIT)
#              promoted only when the mainline image passed inspect-uwe5622 + simulate-uwe5622
on:
  # Dispatched by workflow-cron on the GCP VM or Orange Pi (builder-tools/workflow-cron,
  # bash-scripts/init-workflow-cron.sh): GitHub's own `schedule:` starts late or skips runs.
  # It passes only_if_updated=true.
  # Without that device, put this back:
  # schedule:
  #   - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      upstream:
        description: "Also try new fixes on the pinned Armbian release branch (promoted when tests pass)"
        type: boolean
        default: true
      new_release:
        description: "Move to the newest Armbian release branch instead (promoted when tests pass)"
        type: boolean
        default: false
      only_if_updated:
        description: "Build only when there is an Armbian update to try (as a scheduled run)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'builder-tools/opi-zero3-armbian/**'
      - 'bash-scripts/opi-init-tailscale-docker.sh'
      - 'bash-scripts/init-dozzle.sh'
      - '.github/workflows/builder-tools-opi-zero3-armbian.yml'
  pull_request:
    paths:
      - 'builder-tools/opi-zero3-armbian/**'
      - 'bash-scripts/opi-init-tailscale-docker.sh'
      - '.github/workflows/builder-tools-opi-zero3-armbian.yml'

permissions:
  contents: read

concurrency:
  group: opi-zero3-armbian-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  DIR: builder-tools/opi-zero3-armbian

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      branch: ${{ steps.decide.outputs.branch }}
      commit: ${{ steps.decide.outputs.commit }}
      bump: ${{ steps.decide.outputs.bump }}
      uwe_commit: ${{ steps.decide.outputs.uwe_commit }}
      uwe_bump: ${{ steps.decide.outputs.uwe_bump }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the Armbian commit to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          TRY_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.upstream == true }}
          NEW_RELEASE: ${{ inputs.new_release == true }}
          ONLY_IF_UPDATED: ${{ github.event_name == 'schedule' || inputs.only_if_updated == true }}
        run: |
          set -euo pipefail
          . <(sed 's|\r$||' "$DIR/variables")
          branch="$ARMBIAN_BRANCH" commit="$ARMBIAN_COMMIT" bump=false
          newest_branch="$(git ls-remote --heads "$ARMBIAN_REPO" \
                    | sed -n 's|.*refs/heads/\(v[0-9][0-9]\.[0-9][0-9]\)$|\1|p' | sort -V | tail -n1)"
          [ -n "$newest_branch" ] || { echo "::error::no Armbian release branch found"; exit 1; }
          # Stability: by default only fixes on the pinned release branch are followed
          want_branch="$ARMBIAN_BRANCH"
          if [ "$NEW_RELEASE" = true ]; then
            want_branch="$newest_branch"
          elif [ "$newest_branch" != "$ARMBIAN_BRANCH" ]; then
            echo "::notice::Armbian $newest_branch is out (pinned: $ARMBIAN_BRANCH). Run this workflow with new_release to build and test it."
          fi
          if [ "$TRY_UPSTREAM" = true ] || [ "$NEW_RELEASE" = true ]; then
            head="$(git ls-remote "$ARMBIAN_REPO" "refs/heads/$want_branch" | cut -f1)"
            [ -n "$head" ] || { echo "::error::cannot resolve $want_branch"; exit 1; }
            if [ "$head" != "$ARMBIAN_COMMIT" ]; then
              branch="$want_branch" commit="$head" bump=true
            fi
          fi
          echo "pinned=$ARMBIAN_BRANCH@$ARMBIAN_COMMIT building=$branch@$commit bump=$bump"
          # uwe5622-mainline: its main head is the candidate, promoted like the Armbian pin
          uwe_commit="$UWE5622_COMMIT" uwe_bump=false
          if [ "$TRY_UPSTREAM" = true ]; then
            uwe_head="$(git ls-remote "$UWE5622_REPO" refs/heads/main | cut -f1)"
            [ -n "$uwe_head" ] || { echo "::error::cannot resolve main of $UWE5622_REPO"; exit 1; }
            if [ "$uwe_head" != "$UWE5622_COMMIT" ]; then uwe_commit="$uwe_head" uwe_bump=true; fi
          fi
          echo "uwe5622-mainline pinned=$UWE5622_COMMIT building=$uwe_commit bump=$uwe_bump"
          build=true
          [ "$EVENT" = pull_request ] && build=false          # unit tests only
          [ "$ONLY_IF_UPDATED" = true ] && [ "$bump" != true ] && [ "$uwe_bump" != true ] && build=false
          {
            echo "build=$build"
            echo "branch=$branch"
            echo "commit=$commit"
            echo "bump=$bump"
            echo "uwe_commit=$uwe_commit"
            echo "uwe_bump=$uwe_bump"
          } >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          shellcheck -S warning -e SC1090,SC1091 \
            "$DIR"/userpatches/customize-image.sh "$DIR"/userpatches/overlay/opi-provision \
            "$DIR"/userpatches/overlay/opi-selfcheck "$DIR"/tests/*.sh "$DIR"/tests/unit/run.sh \
            "$DIR"/userpatches/overlay/opi-security-upgrade "$DIR"/userpatches/extensions/opi-image.sh "$DIR"/tests/unit/stubs/* \
            "$DIR"/uwe5622/*.sh

      - name: Unit tests (bats, in Debian of the image's release)
        run: "$DIR/tests/unit/run.sh"

      - name: Firewall integration test (network namespaces)
        run: |
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables >/dev/null; }
          sudo "$DIR/tests/firewall-netns.sh"

  build:
    needs: [check, unit]
    if: needs.check.outputs.build == 'true'
    # Native arm64: the rootfs is built and customized without QEMU
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      ARMBIAN_COMMIT: ${{ needs.check.outputs.commit }}
    outputs:
      artifact: ${{ steps.prepare.outputs.artifact }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@v7

      - name: Get variables
        run: |
          # The candidate commit from `check` wins over the pinned one
          sed 's|\r$||' "$DIR/variables" | grep -E '^[A-Z0-9_]+=' | grep -v '^ARMBIAN_COMMIT=' | tr -d '"' >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Download Armbian build framework
        run: |
          set -euo pipefail
          git init -q armbian
          git -C armbian fetch -q --depth 1 "$ARMBIAN_REPO" "$ARMBIAN_COMMIT"
          git -C armbian checkout -q FETCH_HEAD
          cp -r "$DIR/userpatches" armbian/userpatches
          # Baked into the image for first-boot Tailscale; one copy of the script in this repo
          install -m 755 bash-scripts/opi-init-tailscale-docker.sh \
            armbian/userpatches/overlay/opi-init-tailscale-docker.sh
          chmod 755 armbian/userpatches/customize-image.sh

      - name: Build image
        working-directory: armbian
        run: |
          ./compile.sh build \
            BOARD="$BOARD" BRANCH="$KERNEL_BRANCH" RELEASE="$RELEASE" \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no \
            CONSOLE_AUTOLOGIN=no OPENSSHD_REGENERATE_HOST_KEYS=true \
            COMPRESS_OUTPUTIMAGE=sha,xz ENABLE_EXTENSIONS=opi-image

      - name: Prepare artifacts
        id: prepare
        run: |
          set -euo pipefail
          ls -la armbian/output/images
          img="$(find armbian/output/images -maxdepth 1 -name '*.img.xz' -printf '%f\n' | head -n1)"
          [ -n "$img" ] || { echo "::error::no image produced"; exit 1; }
          base="${img%.img.xz}" name="${img%.img.xz}"
          # The plain name goes to the image with the driver UWE5622_DRIVER picks (see variables)
          if [ "$UWE5622_DRIVER" = mainline ]; then
            name="${base}-uwe5622-armbian"
            (cd armbian/output/images && mv "$img" "${name}.img.xz" && rm -f "${img}.sha" \
              && sha256sum "${name}.img.xz" > "${name}.img.xz.sha")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          # Armbian's linux-headers package of the image's kernel, for the uwe5622-mainline build
          mkdir -p kernel-headers
          deb="$(find armbian/output -name 'linux-headers-*.deb' | sort | head -n1)"
          [ -n "$deb" ] || { find armbian/output -name '*.deb' | head -n 50; echo "::error::no linux-headers package"; exit 1; }
          cp "$deb" kernel-headers/
          ls -la kernel-headers

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          retention-days: 14
          compression-level: 0  # already xz
          path: |
            armbian/output/images/*.img.xz
            armbian/output/images/*.img.xz.sha

      - name: Upload kernel headers package
        uses: actions/upload-artifact@v4
        with:
          name: opi-kernel-headers
          retention-days: 3
          path: kernel-headers/*.deb

  build-uwe5622:
    # The uwe5622-mainline variant: the same image plus the driver built against its exact kernel
    needs: [check, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      UWE5622_COMMIT: ${{ needs.check.outputs.uwe_commit }}
    outputs:
      artifact: ${{ steps.image.outputs.artifact }}
      modules: ${{ steps.image.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - name: Get variables
        run: sed 's|\r$||' "$DIR/variables" | grep -E '^UWE5622_(REPO|DRIVER)=' | tr -d '"' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: image
      - uses: actions/download-artifact@v4
        with:
          name: opi-kernel-headers
          path: headers
      - name: Kernel build tree (Armbian's linux-headers package of the image)
        id: headers
        run: |
          set -euo pipefail
          deb="$(ls headers/*.deb)"
          kdir="/$(dpkg-deb -c "$deb" | grep -o 'usr/src/linux-headers-[^/]*' | head -n1)"
          sudo apt-get update -qq
          # Its postinst builds the host tools and restores the kernel's build-time config
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev "./$deb"
          echo "kdir=$kdir" >> "$GITHUB_OUTPUT"
          echo "kernel: $(cat "$kdir/include/config/kernel.release")"
      - name: Fetch uwe5622-mainline
        run: |
          set -euo pipefail
          git init -q uwe5622
          git -C uwe5622 fetch -q --depth 1 "$UWE5622_REPO" "$UWE5622_COMMIT"
          git -C uwe5622 checkout -q FETCH_HEAD
          git -C uwe5622 log -1 --format='%H %s'
      - name: Build the modules against the image's kernel
        run: '"$DIR/uwe5622/build-modules.sh" uwe5622 "${{ steps.headers.outputs.kdir }}" modules'
      - name: Make the uwe5622-mainline image
        id: image
        run: |
          set -euo pipefail
          base="${{ needs.build.outputs.base }}"
          name="${base}-uwe5622-mainline"
          [ "$UWE5622_DRIVER" = mainline ] && name="$base"
          mkdir -p out
          sudo "$DIR/uwe5622/make-image.sh" image/*.img.xz modules "out/${name}.img.xz" "${UWE5622_REPO}@${UWE5622_COMMIT}"
          ls -la out
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          echo "modules=uwe5622-mainline-modules-$(sed -n 's/^kernel_release=//p' modules/MANIFEST)" >> "$GITHUB_OUTPUT"
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.artifact }}
          retention-days: 14
          compression-level: 0  # already xz
          path: |
            out/*.img.xz
            out/*.img.xz.sha
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.modules }}
          retention-days: 14
          path: modules/

  inspect:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: image
      - name: Inspect image
        run: |
          (cd image && sha256sum -c ./*.img.xz.sha)
          sudo OPI_UWE5622_VARIANT=armbian "$DIR/tests/image-inspect.sh" image/*.img.xz

  inspect-uwe5622:
    needs: build-uwe5622
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-uwe5622.outputs.artifact }}
          path: image
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-uwe5622.outputs.modules }}
          path: modules
      - name: Inspect the uwe5622-mainline image
        run: |
          (cd image && sha256sum -c ./*.img.xz.sha)
          sudo OPI_UWE5622_VARIANT=mainline OPI_UWE5622_SYMVERS="$PWD/modules/kernel.symvers" \
            "$DIR/tests/image-inspect.sh" image/*.img.xz

  simulate:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: image
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm sshpass xz-utils >/dev/null
      - name: Simulate an Orange Pi Zero 3 (QEMU, 4x Cortex-A53, 1 GiB)
        run: sudo "$DIR/tests/simulate.sh" image/*.img.xz

  simulate-uwe5622:
    # The uwe5622-mainline image, with the same driver commit built for the simulation kernel:
    # load/unload rounds without the chip, then the usual checks (no upgrade round)
    needs: [check, build-uwe5622]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      UWE5622_COMMIT: ${{ needs.check.outputs.uwe_commit }}
    steps:
      - uses: actions/checkout@v7
      - name: Get variables
        run: sed 's|\r$||' "$DIR/variables" | grep -E '^UWE5622_REPO=' | tr -d '"' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-uwe5622.outputs.artifact }}
          path: image
      - name: Fetch uwe5622-mainline
        run: |
          set -euo pipefail
          git init -q uwe5622
          git -C uwe5622 fetch -q --depth 1 "$UWE5622_REPO" "$UWE5622_COMMIT"
          git -C uwe5622 checkout -q FETCH_HEAD
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm sshpass xz-utils >/dev/null
      - name: Simulate with the uwe5622-mainline driver (no chip present)
        run: sudo SIM_UWE5622_SRC="$PWD/uwe5622" SIM_SKIP_UPGRADE=1 "$DIR/tests/simulate.sh" image/*.img.xz

  promote:
    # Each candidate is promoted on its own tests: the Armbian pin on inspect + simulate, the
    # uwe5622-mainline pin on the mainline image's inspect + simulation. One commit for both.
    needs: [check, inspect, simulate, inspect-uwe5622, simulate-uwe5622]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((needs.check.outputs.bump == 'true' && needs.inspect.result == 'success' && needs.simulate.result == 'success') ||
       (needs.check.outputs.uwe_bump == 'true' && needs.inspect-uwe5622.result == 'success' && needs.simulate-uwe5622.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Commit the tested pins
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
          COMMIT: ${{ needs.check.outputs.commit }}
          UWE_COMMIT: ${{ needs.check.outputs.uwe_commit }}
          ARMBIAN_OK: ${{ needs.check.outputs.bump == 'true' && needs.inspect.result == 'success' && needs.simulate.result == 'success' }}
          UWE_OK: ${{ needs.check.outputs.uwe_bump == 'true' && needs.inspect-uwe5622.result == 'success' && needs.simulate-uwe5622.result == 'success' }}
        run: |
          set -euo pipefail
          msg=()
          if [ "$ARMBIAN_OK" = true ]; then
            sed -i -e "s|^ARMBIAN_BRANCH=.*|ARMBIAN_BRANCH=\"$BRANCH\"|" \
                   -e "s|^ARMBIAN_COMMIT=.*|ARMBIAN_COMMIT=\"$COMMIT\"|" "$DIR/variables"
            msg+=("Armbian build to $BRANCH (${COMMIT:0:8})")
          fi
          if [ "$UWE_OK" = true ]; then
            sed -i "s|^UWE5622_COMMIT=.*|UWE5622_COMMIT=\"$UWE_COMMIT\"|" "$DIR/variables"
            msg+=("uwe5622-mainline to ${UWE_COMMIT:0:8}")
          fi
          if git diff --quiet; then echo "already pinned"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/variables"
          joined="$(printf '%s and ' "${msg[@]}")"
          # [skip ci]: this exact combination was just built and tested
          git commit -m "opi-zero3-armbian: update ${joined% and } [skip ci]"
          git pull --rebase -q origin main
          git push
