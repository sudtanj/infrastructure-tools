name: "Build Android app (private repo)"

# ---------------------------------------------------------------------------
# Builds a Capacitor Android app whose source lives in a PRIVATE repository and
# optionally uploads it to Google Play, on this PUBLIC repo's unmetered
# GitHub-hosted runners. Same polling model as cloudflare-private-deploy.yaml.
#
# HOW THIS WORKS
#   1. poll  - latest commit touching ANDROID_APP_DIR in the private repo,
#              compared with the last one built successfully (cached).
#   2. build - checkout, `npm ci`, `npm run android:prepare` (the private project
#              generates and patches android/ itself), gradle, then:
#                * upload the AAB to Play when a track is chosen, and/or
#                * attach the AAB/APK as an artifact ENCRYPTED with
#                  ARTIFACT_PASSPHRASE (skipped when that secret is unset).
#   3. record - remember the built commit only after a clean run.
#
# WHAT STAYS PRIVATE (this repo, its logs and its artifacts are public)
#   * Repo name, app folder, package name, AdMob ids and every signing value
#     are secrets, so GitHub masks them wherever they would appear in a log.
#   * npm/gradle output goes to a file. On failure only error lines are
#     printed, with workspace paths stripped. Nothing is printed on success.
#   * No plaintext artifacts. Public-repo artifacts can be downloaded by any
#     signed-in GitHub user, so builds are gpg-encrypted (AES-256) or skipped.
#   * The version code is this workflow's run number, which reveals nothing.
#
# SECURITY MODEL
#   Anyone with push access here can change this file and read these secrets.
#   Keep push access to yourself; give PRIVATE_REPO_TOKEN read-only Contents
#   access to the one private repo; give the Play service account release
#   access to this app only.
#
# SETUP
#   secret PRIVATE_REPO, PRIVATE_REPO_TOKEN, BUILD_REF   shared with the
#                                   Cloudflare workflow (BUILD_REF defaults to main)
#   secret ANDROID_APP_DIR          folder of the app in the private repo
#   secret ANDROID_PACKAGE_NAME     Play package name (applicationId)
#   secret ANDROID_KEYSTORE_BASE64  `base64 -w0 upload.jks`      } optional: without
#   secret ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,         } them a debug APK
#          ANDROID_KEY_PASSWORD                                  } is built instead
#   secret ADMOB_APP_ID, ADMOB_REWARDED_ID   optional; test ids when unset
#   secret PLAY_SERVICE_ACCOUNT_JSON  optional; needed to upload to Play
#   secret ARTIFACT_PASSPHRASE        optional; enables encrypted artifacts.
#          Decrypt: gpg --batch --passphrase '<pass>' -d app.tar.gz.gpg | tar xz
#   variable ANDROID_PLAY_TRACK      optional; track for scheduled builds
#                                   (internal/alpha/beta/production). Unset =
#                                   scheduled builds don't upload.
#   variable ANDROID_PLAY_STATUS     optional; draft (default) or completed.
#                                   Play only accepts "draft" until the app has
#                                   been published once.
#
#   The FIRST AAB must be uploaded by hand in Play Console (the API cannot
#   create an app): run manually once with ARTIFACT_PASSPHRASE set, download
#   and decrypt the artifact, upload app-release.aab.
#
#   Scheduled workflows in public repos are disabled after ~60 days without
#   repo activity; re-enable it or run it manually.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the app has not changed"
        type: boolean
        default: false
      track:
        description: "Upload to this Play track (empty = variable ANDROID_PLAY_TRACK, none = no upload)"
        type: choice
        options: ["", none, internal, alpha, beta, production]
        default: ""
      status:
        description: "Play release status (empty = variable ANDROID_PLAY_STATUS or draft)"
        type: choice
        options: ["", draft, completed]
        default: ""

permissions:
  contents: read

concurrency:
  group: android-private-${{ github.repository }}
  cancel-in-progress: false

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  CI: 'true'

jobs:
  poll:
    name: "Poll private repo"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      sha: ${{ steps.poll.outputs.sha }}
    steps:
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/android-build-state.txt
          key: android-build-state
          restore-keys: android-build-state-

      - name: Latest commit touching the app
        id: poll
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          REPO: ${{ secrets.PRIVATE_REPO }}
          REF: ${{ secrets.BUILD_REF }}
          APP_DIR: ${{ secrets.ANDROID_APP_DIR }}
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::Set secret PRIVATE_REPO_TOKEN."; exit 1; }
          printf '%s' "${REPO:-}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' || { echo "::error::Set secret PRIVATE_REPO to owner/name."; exit 1; }
          printf '%s' "${APP_DIR:-}" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$APP_DIR" | grep -q '\.\.' || { echo "::error::Set secret ANDROID_APP_DIR to the app folder."; exit 1; }
          SHA=$(gh api "repos/${REPO}/commits?sha=${REF:-main}&path=${APP_DIR}&per_page=1" --jq '.[0].sha' 2>/dev/null) || { echo "::error::Cannot read the private repo; check the token."; exit 1; }
          [ -n "$SHA" ] || { echo "::error::No commits found for the app folder."; exit 1; }
          PREV=$(cat /tmp/android-build-state.txt 2>/dev/null || true)
          CHANGED=false
          [ "$SHA" != "$PREV" ] && CHANGED=true
          case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in true|1|yes|on) CHANGED=true ;; esac
          echo "Changed: $CHANGED"
          { echo "changed=$CHANGED"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"

  build:
    name: "Build"
    needs: poll
    if: ${{ needs.poll.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      LOG: ${{ github.workspace }}/../build.log
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gradle-${{ runner.os }}-

      # Every command goes through `quiet`: its output is kept in $LOG and only
      # error lines, with paths stripped, are shown when it fails.
      - name: Build
        env:
          APP_DIR: ${{ secrets.ANDROID_APP_DIR }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          quiet() {
            local step="$1"; shift
            if ! "$@" >>"$LOG" 2>&1; then
              echo "::error::Step failed: $step"
              grep -iE "error|failed|what went wrong|exception|cannot|not found" "$LOG" \
                | sed -E "s#${GITHUB_WORKSPACE}##g; s#/home/runner[^ :]*##g; s#[A-Za-z0-9_./-]+/([A-Za-z0-9_.-]+)#…/\1#g" \
                | tail -n 25 || true
              exit 1
            fi
            echo "ok: $step"
          }
          cd "src/$APP_DIR"
          quiet "install dependencies" npm ci
          quiet "prepare android project" npm run android:prepare
          cd android && chmod +x gradlew
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            quiet "gradle release build" ./gradlew --no-daemon -q bundleRelease assembleRelease
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret: building an unsigned debug APK."
            quiet "gradle debug build" ./gradlew --no-daemon -q assembleDebug
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          rm -f "$RUNNER_TEMP/upload.jks"
          # Collect outputs under neutral names outside the checkout.
          mkdir -p "$RUNNER_TEMP/out"
          find app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -exec cp {} "$RUNNER_TEMP/out/" \;
          cd "$RUNNER_TEMP/out"
          for f in *; do n="app-${f##*-}"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          ls -1 | sed 's/^/built: /'

      - name: Choose Play track
        id: play
        env:
          IN_TRACK: ${{ inputs.track }}
          IN_STATUS: ${{ inputs.status }}
          VAR_TRACK: ${{ vars.ANDROID_PLAY_TRACK }}
          VAR_STATUS: ${{ vars.ANDROID_PLAY_STATUS }}
          HAS_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          track="${IN_TRACK:-$VAR_TRACK}"; [ "$track" = none ] && track=""
          status="${IN_STATUS:-${VAR_STATUS:-draft}}"
          if [ -n "$track" ] && { [ "$SIGNED" != true ] || [ "$HAS_SA" != true ]; }; then
            echo "::warning::Play upload skipped: needs the keystore and PLAY_SERVICE_ACCOUNT_JSON secrets."
            track=""
          fi
          echo "Play track: ${track:-<no upload>} ($status)"
          { echo "track=$track"; echo "status=$status"; } >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: ${{ steps.play.outputs.track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ runner.temp }}/out/app-release.aab
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}

      - name: Encrypt build for download
        id: enc
        env:
          PASS: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          if [ -z "${PASS:-}" ]; then echo "No ARTIFACT_PASSPHRASE: no artifact uploaded."; exit 0; fi
          tar czf - -C "$RUNNER_TEMP/out" . | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$RUNNER_TEMP/app.tar.gz.gpg"
          echo "file=$RUNNER_TEMP/app.tar.gz.gpg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.enc.outputs.file != '' }}
        with:
          name: android-build-${{ github.run_number }}
          path: ${{ steps.enc.outputs.file }}
          retention-days: 7

  record:
    name: "Record built commit"
    needs: [poll, build]
    if: ${{ !cancelled() && needs.poll.outputs.changed == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ needs.poll.outputs.sha }}
        run: printf "%s" "$SHA" > /tmp/android-build-state.txt
      - uses: actions/cache/save@v4
        with:
          path: /tmp/android-build-state.txt
          key: android-build-state-${{ github.run_id }}
