name: "Deploy Vercel Projects (private repo)"

# ---------------------------------------------------------------------------
# Deploys every folder under `vercel/` in a PRIVATE repository to Vercel, using
# this PUBLIC repo's free GitHub-hosted runner minutes. The folder name is the
# Vercel project name: vercel/<name> deploys to project <name>, which is
# created on its first deploy.
#
#   1. poll    - list vercel/*, find folders with a commit not yet deployed.
#   2. deploy  - per folder: link the project, run `deno task migrate` when
#                the folder has one (DATABASE_URL comes from the project's own
#                production env), then `vercel deploy --prod`. Vercel builds
#                with the runtimes declared in the folder's vercel.json.
#
# WHAT COUNTS AS "DEPLOYED"
#   A successful deploy saves an empty cache entry keyed by folder and commit.
#   Poll lists those keys, so a failed deploy is retried on the next run.
#   shortcut: GitHub evicts cache entries unused for 7 days, so an idle folder
#   redeploys about once a week; store the commit elsewhere if that matters.
#
# SECURITY MODEL
#   * This file is public: visible to everyone and forkable.
#   * Folder names appear in job names. Command output is reduced to
#     pass/fail with URLs and paths stripped, and the deployment URL and
#     DATABASE_URL are masked.
#
# SETUP
#   secret VERCEL_TOKEN          required; vercel.com/account/tokens
#   secret VERCEL_SCOPE          optional; team slug or id (personal account: unset)
#   secret PRIVATE_REPO_TOKEN    read access to the private repo (shared)
#   secret PRIVATE_REPO          "owner/name" -- NOT a URL (shared)
#   secret BUILD_REF             branch to track, defaults to main (shared)
#
#   Runtime env (DATABASE_URL, APP_KEY, ...) is set per project in Vercel.
#   Leave it non-sensitive if migrate should run: sensitive values cannot be
#   pulled. Until VERCEL_TOKEN is set, runs stop at poll without failing.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy every folder even if nothing changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read # gh cache list, to see what is already deployed

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  poll:
    name: "Poll private repo"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.poll.outputs.projects }}
      ref: ${{ steps.poll.outputs.ref }}
    steps:
      - name: Find folders to deploy
        id: poll
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CACHE_TOKEN: ${{ github.token }}
          REPO: ${{ secrets.PRIVATE_REPO }}
          REF: ${{ secrets.BUILD_REF }}
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail
          REF="${REF:-main}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "VERCEL_TOKEN is not set; nothing to do."
            echo "projects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then echo "::error::Set secret PRIVATE_REPO_TOKEN."; exit 1; fi
          if ! printf '%s' "${REPO:-}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Set secret PRIVATE_REPO to 'owner/name' (not a URL)."
            exit 1
          fi
          force=false
          case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in true|1|yes|on) force=true ;; esac

          if ! names=$(gh api "repos/${REPO}/contents/vercel?ref=${REF}" --jq '.[] | select(.type == "dir") | .name' 2>/dev/null); then
            echo "::error::Cannot list the vercel folder. Check the token and ref."
            exit 1
          fi
          deployed=$(GH_TOKEN="$CACHE_TOKEN" gh cache list -R "$GITHUB_REPOSITORY" --key vercel-deployed- --limit 1000 --json key --jq '.[].key')

          rows=()
          for name in $names; do
            # Vercel project names: lowercase letters, digits, '.', '_', '-'.
            if ! printf '%s' "$name" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,99}$'; then
              echo "::warning::Skipping '$name': not a valid Vercel project name."
              continue
            fi
            sha=$(gh api "repos/${REPO}/commits?sha=${REF}&path=vercel/${name}&per_page=1" --jq '.[0].sha // ""')
            if [ -z "$sha" ]; then continue; fi
            if [ "$force" != true ] && grep -qx "vercel-deployed-${name}-${sha}" <<<"$deployed"; then
              echo "$name: ${sha:0:12} already deployed"
              continue
            fi
            echo "$name: ${sha:0:12} to deploy"
            rows+=("{\"name\":\"$name\",\"sha\":\"$sha\"}")
          done
          echo "projects=[$(IFS=,; echo "${rows[*]:-}")]" >> "$GITHUB_OUTPUT"

  deploy:
    name: "Deploy ${{ matrix.project.name }}"
    needs: poll
    if: ${{ needs.poll.outputs.projects != '' && needs.poll.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.poll.outputs.projects || '[]') }}
    env:
      NAME: ${{ matrix.project.name }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ matrix.project.sha }}
          persist-credentials: false
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Link Vercel project
        working-directory: private/vercel/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          vc() { npx --yes vercel@latest "$@" --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"}; }
          # A missing project is created first; link alone may refuse to create one non-interactively.
          if ! vc link --yes --project "$NAME" > /tmp/vercel.log 2>&1; then
            vc project add "$NAME" >> /tmp/vercel.log 2>&1 || true
            if ! vc link --yes --project "$NAME" >> /tmp/vercel.log 2>&1; then
              echo "::error::Could not link or create project '$NAME' (output suppressed)"
              tail -10 /tmp/vercel.log | sed -E 's#[a-z]+://[^ ]+#<url>#g; s#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g'
              exit 1
            fi
          fi
          echo "Linked to '$NAME'."

      # Output can name the database host or private files, so only pass/fail is shown.
      - name: Migrate database
        working-directory: private/vercel/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          if ! grep -q '"migrate"' deno.json 2>/dev/null; then echo "No migrate task; skipping."; exit 0; fi
          npx --yes vercel@latest env pull /tmp/prod.env --environment=production --yes --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"} > /dev/null 2>&1 || true
          DATABASE_URL=$(sed -n 's/^DATABASE_URL=//p' /tmp/prod.env 2>/dev/null | sed -E 's/^"(.*)"$/\1/' | head -1)
          rm -f /tmp/prod.env
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::No readable DATABASE_URL in the project's production env (unset or sensitive); skipping migrate."
            exit 0
          fi
          echo "::add-mask::$DATABASE_URL"
          if DATABASE_URL="$DATABASE_URL" deno task migrate > /tmp/migrate.log 2>&1; then
            echo "Migrate: OK"
          else
            echo "::error::Migrate failed (output suppressed to protect private data)"
            tail -5 /tmp/migrate.log | sed -E 's#[a-z]+://[^ ]+#<url>#g; s#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g'
            exit 1
          fi

      - name: Deploy to Vercel
        working-directory: private/vercel/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          if npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"} > /tmp/url.txt 2> /tmp/vercel.log; then
            echo "::add-mask::$(cat /tmp/url.txt)"
            echo "Deploy: OK (URL is in the Vercel dashboard)"
          else
            echo "::error::Vercel deploy failed (output suppressed to protect private data)"
            # The CLI prints the deployment URL before building, so a build failure still leaves it here.
            if [ -s /tmp/url.txt ]; then
              echo "::add-mask::$(cat /tmp/url.txt)"
              npx --yes vercel@latest inspect "$(cat /tmp/url.txt)" --logs --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"} >> /tmp/vercel.log 2>&1 || true
            fi
            echo "--- last lines of the deploy and build log (URLs and paths stripped) ---"
            tail -40 /tmp/vercel.log | sed -E 's#[a-z]+://[^ ]+#<url>#g; s#[A-Za-z0-9-]+\.vercel\.app#<host>#g; s#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g'
            exit 1
          fi

      # Empty marker: the key alone records "this folder at this commit is deployed".
      - name: Record deployed commit
        run: mkdir -p /tmp/vercel-mark && touch /tmp/vercel-mark/ok
      - name: Save marker
        uses: actions/cache/save@v4
        with:
          path: /tmp/vercel-mark
          key: vercel-deployed-${{ matrix.project.name }}-${{ matrix.project.sha }}
