name: "Deploy Vercel Projects (private repo)"

# ---------------------------------------------------------------------------
# Deploys every folder under `vercel/` in a PRIVATE repository to Vercel, using
# this PUBLIC repo's free GitHub-hosted runner minutes. The folder name is the
# Vercel project name: vercel/<name> deploys to project <name>, which is
# created on its first deploy.
#
#   1. poll    - list vercel/*, find folders with a commit not yet deployed.
#   2. deploy  - per folder: link the project, fill in missing env (see SETUP), run `deno task migrate` when
#                the folder has one (DATABASE_URL comes from the project's own
#                production env), then `vercel deploy --prod`. Vercel builds
#                with the runtimes declared in the folder's vercel.json.
#
# WHAT COUNTS AS "DEPLOYED"
#   A successful deploy saves an empty cache entry keyed by folder and commit.
#   Poll lists those keys, so a failed deploy is retried on the next run.
#   shortcut: GitHub evicts cache entries unused for 7 days, so an idle folder
#   redeploys about once a week; store the commit elsewhere if that matters.
#
# SECURITY MODEL
#   * This file is public: visible to everyone and forkable.
#   * Folder names appear in job names. Command output is reduced to
#     pass/fail with URLs and paths stripped, and the deployment URL and
#     DATABASE_URL are masked.
#
# SETUP
#   secret VERCEL_TOKEN          required; vercel.com/account/tokens
#   secret VERCEL_SCOPE          optional; team slug or id (personal account: unset)
#   secret PRIVATE_REPO_TOKEN    read access to the private repo (shared)
#   secret PRIVATE_REPO          "owner/name" -- NOT a URL (shared)
#   secret BUILD_REF             branch to track, defaults to main (shared)
#
#   secret NEON_API_KEY          optional; console.neon.tech > Account > API keys.
#                                A project whose code reads DATABASE_URL and has
#                                none in Vercel gets a Neon database of the
#                                same name, saved to Vercel as DATABASE_URL.
#   secret NEON_ORG_ID           optional; needed when the key belongs to an org
#
#   secret <PROJECT>_<VAR>       optional, per project; copied to Vercel as <VAR>
#                                on every deploy, e.g. PAYMENTER_APP_KEY ->
#                                APP_KEY. <PROJECT>_CRON_KEY becomes CRON_SECRET.
#
#   Runtime env lives per project in Vercel. Missing APP_KEY / CRON_SECRET are
#   generated (as sensitive) for projects whose code reads them; existing values
#   are never replaced. A DATABASE_URL you set yourself must be non-sensitive
#   for migrate to read it. Until VERCEL_TOKEN is set, runs stop at poll.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy every folder even if nothing changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read # gh cache list, to see what is already deployed

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  poll:
    name: "Poll private repo"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.poll.outputs.projects }}
      ref: ${{ steps.poll.outputs.ref }}
    steps:
      - name: Find folders to deploy
        id: poll
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CACHE_TOKEN: ${{ github.token }}
          REPO: ${{ secrets.PRIVATE_REPO }}
          REF: ${{ secrets.BUILD_REF }}
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail
          REF="${REF:-main}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "VERCEL_TOKEN is not set; nothing to do."
            echo "projects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then echo "::error::Set secret PRIVATE_REPO_TOKEN."; exit 1; fi
          if ! printf '%s' "${REPO:-}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Set secret PRIVATE_REPO to 'owner/name' (not a URL)."
            exit 1
          fi
          force=false
          case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in true|1|yes|on) force=true ;; esac

          if ! names=$(gh api "repos/${REPO}/contents/vercel?ref=${REF}" --jq '.[] | select(.type == "dir") | .name' 2>/dev/null); then
            echo "::error::Cannot list the vercel folder. Check the token and ref."
            exit 1
          fi
          deployed=$(GH_TOKEN="$CACHE_TOKEN" gh cache list -R "$GITHUB_REPOSITORY" --key vercel-deployed- --limit 1000 --json key --jq '.[].key')

          rows=()
          for name in $names; do
            # Vercel project names: lowercase letters, digits, '.', '_', '-'.
            if ! printf '%s' "$name" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,99}$'; then
              echo "::warning::Skipping '$name': not a valid Vercel project name."
              continue
            fi
            sha=$(gh api "repos/${REPO}/commits?sha=${REF}&path=vercel/${name}&per_page=1" --jq '.[0].sha // ""')
            if [ -z "$sha" ]; then continue; fi
            if [ "$force" != true ] && grep -qx "vercel-deployed-${name}-${sha}" <<<"$deployed"; then
              echo "$name: ${sha:0:12} already deployed"
              continue
            fi
            echo "$name: ${sha:0:12} to deploy"
            rows+=("{\"name\":\"$name\",\"sha\":\"$sha\"}")
          done
          echo "projects=[$(IFS=,; echo "${rows[*]:-}")]" >> "$GITHUB_OUTPUT"

  deploy:
    name: "Deploy ${{ matrix.project.name }}"
    needs: poll
    if: ${{ needs.poll.outputs.projects != '' && needs.poll.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.poll.outputs.projects || '[]') }}
    env:
      NAME: ${{ matrix.project.name }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ matrix.project.sha }}
          persist-credentials: false
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Link Vercel project
        working-directory: private/vercel/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          vc() { npx --yes vercel@latest "$@" --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"}; }
          # A missing project is created first; link alone may refuse to create one non-interactively.
          if ! vc link --yes --project "$NAME" > /tmp/vercel.log 2>&1; then
            vc project add "$NAME" >> /tmp/vercel.log 2>&1 || true
            if ! vc link --yes --project "$NAME" >> /tmp/vercel.log 2>&1; then
              echo "::error::Could not link or create project '$NAME' (output suppressed)"
              tail -10 /tmp/vercel.log | sed -E 's#[a-z]+://[^ ]+#<url>#g; s#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g'
              exit 1
            fi
          fi
          # The team slug ("Linked to <team>/<project>") is account detail; mask it for every later step.
          team=$(grep -oE "Linked to [A-Za-z0-9._-]+/" /tmp/vercel.log | head -1 | sed -E 's#Linked to (.*)/#\1#') || true
          if [ -n "$team" ]; then echo "::add-mask::$team"; fi
          echo "Linked to '$NAME'."

      # GitHub secrets named <PROJECT>_<VAR> (project upper-cased, '-' and '.' as '_') are the
      # source of truth and replace <VAR> in Vercel on every deploy. Anything still missing is
      # then filled in, never replaced: a new APP_KEY would make stored secrets unreadable.
      - name: Provision env (project secrets, Neon database, APP_KEY, CRON_SECRET)
        working-directory: private/vercel/${{ matrix.project.name }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          # GitHub has no lookup by computed name, so the step gets all secrets; each stays masked.
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          vc() { npx --yes vercel@latest "$@" --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"}; }
          add() { # name value [--sensitive]
            echo "::add-mask::$2"
            if printf '%s' "$2" | vc env add "$1" production ${3:-} > /dev/null 2>&1; then echo "Added $1."; else echo "::error::Could not add $1."; exit 1; fi
          }

          prefix="$(printf '%s' "$NAME" | tr '[:lower:].-' '[:upper:]__')_"
          while IFS= read -r key; do
            var="${key#"$prefix"}"
            # Vercel's cron sends only an env var named CRON_SECRET as its bearer token.
            [ "$var" = CRON_KEY ] && var=CRON_SECRET
            value=$(jq -r --arg k "$key" '.[$k]' <<<"$ALL_SECRETS")
            echo "::add-mask::$value"
            # Laravel key format: "base64:" + 32 bytes, or 32 raw characters. Anything else fails every request.
            if [ "$var" = APP_KEY ] && [ "${#value}" -ne 32 ] && [ "$(printf '%s' "${value#base64:}" | base64 -d 2>/dev/null | wc -c)" -ne 32 ]; then
              echo "::error::$key must be 'base64:' + 32 random bytes (openssl rand -base64 32) or 32 characters."
              exit 1
            fi
            # A bare base64 key gets the prefix the app expects.
            [ "$var" = APP_KEY ] && [ "${#value}" -ne 32 ] && value="base64:${value#base64:}"
            vc env rm "$var" production --yes > /dev/null 2>&1 || true
            add "$var" "$value" --sensitive
            if [ "$var" = DATABASE_URL ]; then printf "%s" "$value" > /tmp/db.url; fi
          done < <(jq -r --arg p "$prefix" 'keys[] | select(startswith($p))' <<<"$ALL_SECRETS")

          if ! vc env ls production > /tmp/env.txt 2>/dev/null; then
            echo "::warning::Could not list the project's env; skipping provisioning."
            exit 0
          fi
          has() { grep -Eq "^[[:space:]]*$1[[:space:]]" /tmp/env.txt; }
          # Generated only for projects whose code reads them.
          if grep -rqs --include='*.ts' APP_KEY .; then has APP_KEY || add APP_KEY "base64:$(openssl rand -base64 32)" --sensitive; fi
          if grep -rqs --include='*.ts' CRON_SECRET .; then has CRON_SECRET || add CRON_SECRET "$(openssl rand -hex 32)" --sensitive; fi
          if ! grep -rqs --include='*.ts' DATABASE_URL .; then exit 0; fi
          if has DATABASE_URL; then echo "DATABASE_URL already set."; exit 0; fi
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::warning::No DATABASE_URL and no NEON_API_KEY; set one of them."
            exit 0
          fi
          neon() { curl -fsS -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' "$@"; }
          api=https://console.neon.tech/api/v2
          # Reuse a Neon project of the same name, left behind by a run that failed after creating it.
          id=$(neon "$api/projects?search=$NAME${NEON_ORG_ID:+&org_id=$NEON_ORG_ID}" | jq -r --arg n "$NAME" '[.projects[] | select(.name == $n)][0].id // empty') || id=''
          if [ -z "$id" ]; then
            body=$(jq -nc --arg n "$NAME" --arg o "${NEON_ORG_ID:-}" '{project: ({name: $n, pg_version: 17} + (if $o == "" then {} else {org_id: $o} end))}')
            if ! id=$(neon -X POST "$api/projects" -d "$body" | jq -r '.project.id'); then
              echo "::error::Could not create the Neon project (check NEON_API_KEY, and set NEON_ORG_ID if the key belongs to an organisation)."
              exit 1
            fi
            echo "Created a Neon project."
          fi
          # Pooled endpoint: serverless functions open many short connections. The app already disables prepared statements for it.
          url=$(neon "$api/projects/$id/connection_uri?database_name=neondb&role_name=neondb_owner&pooled=true" | jq -r '.uri')
          add DATABASE_URL "$url"
          printf '%s' "$url" > /tmp/db.url

      # Output can name the database host or private files, so only pass/fail is shown.
      - name: Migrate database
        working-directory: private/vercel/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          if ! grep -q '"migrate"' deno.json 2>/dev/null; then echo "No migrate task; skipping."; exit 0; fi
          # Just provisioned: use it directly. Otherwise pull it from the project.
          DATABASE_URL=$(cat /tmp/db.url 2>/dev/null || true)
          if [ -z "$DATABASE_URL" ]; then
            npx --yes vercel@latest env pull /tmp/prod.env --environment=production --yes --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"} > /dev/null 2>&1 || true
            DATABASE_URL=$(sed -n 's/^DATABASE_URL=//p' /tmp/prod.env 2>/dev/null | sed -E 's/^"(.*)"$/\1/' | head -1)
            rm -f /tmp/prod.env
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::No readable DATABASE_URL in the project's production env (unset or sensitive); skipping migrate."
            exit 0
          fi
          echo "::add-mask::$DATABASE_URL"
          if DATABASE_URL="$DATABASE_URL" deno task migrate > /tmp/migrate.log 2>&1; then
            echo "Migrate: OK"
          else
            echo "::error::Migrate failed (output suppressed to protect private data)"
            tail -5 /tmp/migrate.log | sed -E 's#[a-z]+://[^ ]+#<url>#g; s#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g'
            exit 1
          fi

      - name: Deploy to Vercel
        working-directory: private/vercel/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          if npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"} > /tmp/url.txt 2> /tmp/vercel.log; then
            echo "::add-mask::$(cat /tmp/url.txt)"
            echo "Deploy: OK (URL is in the Vercel dashboard)"
          else
            echo "::error::Vercel deploy failed (output suppressed to protect private data)"
            # The CLI prints the deployment URL before building, so a build failure still leaves it here.
            if [ -s /tmp/url.txt ]; then
              echo "::add-mask::$(cat /tmp/url.txt)"
              npx --yes vercel@latest inspect "$(cat /tmp/url.txt)" --logs --token "$VERCEL_TOKEN" ${SCOPE:+--scope "$SCOPE"} >> /tmp/vercel.log 2>&1 || true
            fi
            echo "--- last lines of the deploy and build log (URLs and paths stripped) ---"
            tail -40 /tmp/vercel.log | sed -E 's#[a-z]+://[^ ]+#<url>#g; s#[A-Za-z0-9-]+\.vercel\.app#<host>#g; s#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g; s#( in )[A-Za-z0-9._-]+$#\1<scope>#'
            exit 1
          fi

      # Empty marker: the key alone records "this folder at this commit is deployed".
      - name: Record deployed commit
        run: mkdir -p /tmp/vercel-mark && touch /tmp/vercel-mark/ok
      - name: Save marker
        uses: actions/cache/save@v4
        with:
          path: /tmp/vercel-mark
          key: vercel-deployed-${{ matrix.project.name }}-${{ matrix.project.sha }}
