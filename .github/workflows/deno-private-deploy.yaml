name: "Deploy Deno Projects (private repo)"

# ---------------------------------------------------------------------------
# Deploys Deno projects whose source lives in a PRIVATE repository, using this
# PUBLIC repo's free GitHub-hosted runner minutes.
#
# Same shape as the Cloudflare workflow next to it: poll the private repo,
# detect which folders changed, deploy each in a matrix.
#
#   1. poll    - has the private repo moved?
#   2. detect  - checkout the private repo, find folders holding a
#                deno.json / deno.jsonc that the push touched.
#   3. deploy  - `deno deploy` each one.
#
# WHY A WORKFLOW CANNOT "LISTEN"
#   A workflow is only triggered by events inside its own repo, so pushes
#   elsewhere cannot be subscribed to. Polling is what keeps the private repo
#   completely untouched.
#
# IMPORTANT DIFFERENCE FROM CLOUDFLARE
#   Deno Deploy runs the build itself. `deno deploy` uploads the source and
#   Deno performs install/build/deploy with the commands configured on the
#   application, so this runner mostly checks out and uploads rather than
#   building. If the goal is to offload heavy building to free minutes, the
#   Cloudflare workflow is the better fit; use this one for Deno Deploy's
#   integrated build, rollback and env management.
#
#   Requires Deno Deploy (NOT the retired "Deploy Classic", shut down
#   2026-07-20, along with the deployctl CLI). The application must already
#   exist in the organisation -- see SETUP.
#
# SECURITY MODEL
#   * This file is public: visible to everyone and forkable.
#   * DENO_DEPLOY_TOKEN can deploy apps. Keep push access to trusted people,
#     and scope the token to the least privilege your plan offers.
#   * Build output is reduced to pass/fail with paths stripped so private file
#     names stay out of this public repo's logs. `deno deploy` output is left
#     intact because the resulting URL is the point of the run.
#
# SETUP
#   secret DENO_DEPLOY_TOKEN   required; from console.deno.com
#   secret DENO_DEPLOY_ORG     required; your Deno Deploy organisation
#   secret PRIVATE_REPO_TOKEN  read access to the private repo
#   secret PRIVATE_REPO        "owner/name" -- NOT a URL
#   secret BUILD_REF           branch to track (defaults to main)
#   secret DENO_DEPLOY_APP_PREFIX  optional; prepended to the folder name to
#                                 form the application name
#
# RUNNING IT BY HAND
#   Re-run with `force` checked to deploy every project, even when the private
#   repo has not moved since the last successful deploy. Without force, a run
#   with no new commit stops at the poll job.
#
# WHAT COUNTS AS "DEPLOYED"
#   The last deployed commit is recorded by the `record` job, and only when the
#   whole attempt is clean (every deploy succeeded, or there was nothing to
#   do). A failed deploy therefore leaves the commit unrecorded and the next
#   run retries it, instead of skipping it as "nothing new".
#
#   Applications must exist first:
#     deno deploy create --org "$ORG" --app "$APP" --source local \
#         --runtime-mode dynamic --entrypoint main.ts
#   The default application name is the folder name (or the repository name
#   for a project at the root).
#
#   NOTE: `--source local` belongs to `create` only. The deploy command has no
#   `--source` flag and treats the value as a positional root path, failing
#   with "Too many arguments: local". The deploy step passes only
#   --non-interactive/--org/--app/--prod.
#
#   TROUBLESHOOTING "The requested app was not found"
#   That single message covers four different mistakes: a bad token, an org the
#   token cannot see, a name that differs from the real one by case or
#   separators, and an app that was never created. The "Resolve application"
#   step below checks each in turn and prints which one it is, along with the
#   exact `create` command when the app is missing.
# ---------------------------------------------------------------------------

on:
  # Scheduled polling is DISABLED. To re-enable it, uncomment the two lines
  # below. It is off by default so the workflow does not poll -- and spend
  # runner minutes -- until the secrets are in place. Manual runs still work.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if the private repo has no new commits"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # `secrets` is NOT available in `concurrency`, so the group is named from a
  # variable and falls back to this repo.
  group: deno-deploy-${{ vars.PRIVATE_REPO || github.repository }}
  cancel-in-progress: false

env:
  # Pinned so the CLI surface stays stable; Deno Deploy's build environment is
  # configured per application, not here.
  DENO_VERSION: 'v2.x'

jobs:
  # ------------------------------------------------------------------
  # Job 1: has the private repo moved?
  # ------------------------------------------------------------------
  poll:
    name: "Poll private repo"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      sha: ${{ steps.poll.outputs.sha }}
      ref: ${{ steps.poll.outputs.ref }}

    steps:
      # Restore BEFORE polling: the poll step reads this file to learn which
      # commit was last deployed SUCCESSFULLY.
      #
      # The `record` job writes this file with the run id in the cache key,
      # because a cache entry is immutable and this one is rewritten after
      # every clean deploy. `restore-keys` is what keeps the lookup working:
      # it takes the most recent matching entry, and the bare prefix also
      # matches entries saved under the older exact key.
      - name: Restore state for next poll
        uses: actions/cache/restore@v4
        with:
          path: /tmp/deno-deploy-state.txt
          key: deno-deploy-state-${{ vars.PRIVATE_REPO || github.repository }}
          restore-keys: |
            deno-deploy-state-${{ vars.PRIVATE_REPO || github.repository }}-

      - name: Resolve repo and fetch latest commit
        id: poll
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CFG_REPO: ${{ secrets.PRIVATE_REPO }}
          CFG_REF: ${{ secrets.BUILD_REF }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # ${VAR:-} everywhere: under `set -u` an unset variable is fatal.
          TOKEN="${GH_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No credential: set secret PRIVATE_REPO_TOKEN."
            exit 1
          fi

          REPO="${CFG_REPO:-}"
          # Strict owner/name: no metacharacters, no traversal, no leading dash.
          if ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Set secret PRIVATE_REPO to 'owner/name' (not a URL)."
            exit 1
          fi
          REF="${CFG_REF:-main}"

          if ! RESP=$(GH_TOKEN="$TOKEN" gh api "repos/${REPO}/commits/${REF}" --jq '.sha' 2>/dev/null); then
            echo "::error::Cannot read ${REPO}@${REF}. Check the token has read access."
            exit 1
          fi
          if [ -z "$RESP" ]; then
            echo "::error::Empty response for ${REPO}@${REF}."
            exit 1
          fi

          PREV=""
          [ -f /tmp/deno-deploy-state.txt ] && PREV="$(cat /tmp/deno-deploy-state.txt)"

          echo "Tracked:     $REPO@$REF"
          echo "Latest:      ${RESP:0:12}"
          echo "Last deploy: ${PREV:-<none>}"

          CHANGED="false"
          if [ "$RESP" != "$PREV" ]; then
            CHANGED="true"
            echo "New commit detected."
          else
            echo "No new commit; nothing to deploy."
          fi

          if [ "${FORCE:-false}" = "true" ]; then
            CHANGED="true"
            echo "force=true; deploying regardless."
          fi

          # Deliberately NOT written here. Recording the commit before the
          # deploy runs would make any later failure look like "nothing new"
          # on the next poll, and that commit would never be retried. The
          # `record` job writes it, and only after a clean attempt.
          {
            echo "changed=$CHANGED"
            echo "sha=$RESP"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Poll"
            echo
            echo "- Changed: \`${{ steps.poll.outputs.changed }}\`"
            echo "- Ref: \`${{ steps.poll.outputs.ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Job 2: which Deno folders in the private repo need deploying?
  # ------------------------------------------------------------------
  detect:
    name: "Detect Deno projects"
    needs: poll
    if: ${{ needs.poll.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.detect.outputs.projects }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.ref }}
          # Keep the token out of .git/config so later steps cannot leak it.
          persist-credentials: false
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # The diff base is the last commit that deployed cleanly, which is
      # exactly the state the poll job reads. Restored here because detect
      # runs on a different runner than poll.
      - name: Restore last deployed commit
        uses: actions/cache/restore@v4
        with:
          path: /tmp/deno-deploy-state.txt
          key: deno-deploy-state-${{ vars.PRIVATE_REPO || github.repository }}
          restore-keys: |
            deno-deploy-state-${{ vars.PRIVATE_REPO || github.repository }}-

      - name: Find changed Deno projects
        id: detect
        working-directory: private
        shell: bash
        env:
          TARGET_SHA: ${{ needs.poll.outputs.sha }}
          FORCE: ${{ inputs.force }}
          APP_PREFIX: ${{ secrets.DENO_DEPLOY_APP_PREFIX }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO }}
        run: |
          set -euo pipefail

          # Compare against the last commit that deployed cleanly, so a
          # multi-commit push is seen in full. Without a usable base, deploy
          # everything rather than risk skipping a folder.
          base=''
          if [ -f /tmp/deno-deploy-state.txt ]; then
            base="$(cat /tmp/deno-deploy-state.txt)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No comparable base commit; selecting every Deno project found."
            base=''
          fi

          # force=true means "deploy every project", not merely "look at the
          # latest commit": without this, re-running with no new commits would
          # diff against the deployed commit, find nothing, and deploy
          # nothing -- the opposite of what force asks for.
          if [ "${FORCE:-false}" = "true" ]; then
            echo "force=true; ignoring the diff and selecting every project."
            base=''
          fi

          changed=()
          if [ -n "$base" ]; then
            mapfile -t changed < <(git diff --name-only "$base" "$TARGET_SHA")
          fi

          echo "Comparing ${base:-<nothing>}..${TARGET_SHA:0:12} (${#changed[@]} changed file(s)):"
          if [ ${#changed[@]} -eq 0 ]; then
            if [ -n "$base" ]; then
              echo "  (none; with a baseline this means nothing to deploy)"
            else
              echo "  (none, no baseline: selecting every project)"
            fi
          else
            printf '  %s\n' "${changed[@]}"
          fi

          mapfile -t configs < <(
            find . \( -name node_modules -o -name .git -o -name vendor \) -prune -o \
              \( -name 'deno.json' -o -name 'deno.jsonc' \) -print | sort
          )

          repo_name="${REPO_NAME#*/}"
          projects=()
          skipped=()
          for config in "${configs[@]:-}"; do
            dir="$(dirname "${config#./}")"
            reason=''
            # No baseline (first run, forced, or the recorded commit is no
            # longer available): deploy everything rather than risk skipping a
            # folder. WITH a baseline, an empty diff legitimately means this
            # push touched no project, and deploying everything would waste
            # the run.
            if [ -z "$base" ]; then
              reason='full'
            elif [ "$dir" = "." ]; then
              reason='changed'
            else
              for file in "${changed[@]}"; do
                case "$file" in
                  "$dir"/*|"$dir") reason='changed'; break ;;
                esac
              done
            fi
            if [ -z "$reason" ]; then
              skipped+=("$dir")
              continue
            fi

            # Application name: optional prefix + folder name, or the repo
            # name for a project at the root.
            if [ "$dir" = "." ]; then
              leaf="$repo_name"
            else
              leaf="${dir##*/}"
            fi
            app="${APP_PREFIX:+$APP_PREFIX-}${leaf}"

            # A `deploy` block is what Deno Deploy actually reads, so note its
            # presence for the summary. Absence is not fatal: the app may carry
            # the configuration server-side.
            deploy_cfg='none'
            if grep -q '"deploy"' "$config" 2>/dev/null; then
              deploy_cfg='inline'
            fi

            projects+=("$dir"$'\t'"$app"$'\t'"$deploy_cfg"$'\t'"$reason")
          done

          echo "Deploying ${#projects[@]} Deno project(s):"
          if [ ${#projects[@]} -eq 0 ]; then
            echo "  (none)"
          else
            for project in "${projects[@]}"; do
              IFS=$'\t' read -r d a c r <<<"$project"
              echo "  - dir=$d app=$a (config: $c, reason: $r)"
            done
          fi
          if [ ${#skipped[@]} -gt 0 ]; then
            echo "Unchanged, skipping: ${skipped[*]}"
          fi

          # Application names come from folder names, so two folders sharing a
          # basename (services/api and deep/nested/api) would resolve to the
          # same app and one would silently overwrite the other. Fail loudly
          # instead; DENO_DEPLOY_APP_PREFIX does not disambiguate either.
          # NOTE: must be associative (declare -A). An indexed array would
          # evaluate the subscript arithmetically, so an app name like
          # "priv-api" becomes "priv - api" and trips `set -u`.
          declare -A clashes=()
          for project in "${projects[@]}"; do
            IFS=$'\t' read -r _d a _c _r <<<"$project"
            dir_of="${project%%$'\t'*}"
            if [ -n "${clashes[$a]:-}" ]; then
              clashes[$a]="${clashes[$a]}, $dir_of"
            else
              clashes[$a]="$dir_of"
            fi
          done
          collision=""
          for a in "${!clashes[@]}"; do
            case "${clashes[$a]}" in
              *,*) collision+="  app '$a' <- ${clashes[$a]}"$'\n' ;;
            esac
          done
          if [ -n "$collision" ]; then
            echo "::error::Ambiguous application names; give the folders distinct names or set one app per project."
            printf '%s' "$collision"
            exit 1
          fi

          {
            echo "projects=$(node -e '
              const rows = process.argv.slice(1)
                .filter(Boolean)
                .map((row) => {
                  const [dir, app, config, reason] = row.split("\t");
                  return { dir, app, config, reason };
                });
              process.stdout.write(JSON.stringify(rows));
            ' "${projects[@]:-}")"
          } >> "$GITHUB_OUTPUT"

          # No base is saved here. The `record` job writes the deployed commit
          # once the attempt has actually succeeded, which is also what the
          # next run diffs against.

      - name: Summary
        if: always()
        run: |
          {
            echo "### Detected Deno projects"
            echo
            echo '```json'
            echo '${{ steps.detect.outputs.projects }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Job 3: deploy each detected project
  # ------------------------------------------------------------------
  deploy:
    name: "Deploy ${{ matrix.project.app }}"
    needs: [poll, detect]
    # '' when detect was skipped (nothing to deploy) or failed; '[]' when it
    # ran and found nothing.
    if: ${{ needs.detect.outputs.projects != '' && needs.detect.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'` is required, not defensive padding: when detect is skipped
        # its outputs are empty strings, and the matrix is built before this
        # job's `if` is evaluated. fromJSON('') raises "empty input" and fails
        # the run outright, which is how a no-op poll used to look like an
        # error.
        project: ${{ fromJSON(needs.detect.outputs.projects || '[]') }}

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.ref }}
          persist-credentials: false
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # The application name is derived from a folder name, so it can disagree
      # with what Deno Deploy actually holds: wrong case or separators, a
      # stale DENO_DEPLOY_APP_PREFIX, an org the token cannot see, or an app
      # that was never created. Any of those makes `deno deploy` answer with a
      # bare "The requested app was not found, or you do not have access to
      # view it." plus a trace id. Resolve the name against the account first.
      - name: Resolve application
        id: resolve
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DEPLOY_ORG: ${{ secrets.DENO_DEPLOY_ORG }}
          WANTED_APP: ${{ matrix.project.app }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_ORG:-}" ]; then
            echo "::error::The DENO_DEPLOY_ORG secret is not set; cannot resolve an application."
            exit 1
          fi
          echo "Wanting '$WANTED_APP' in org '$DEPLOY_ORG'."

          cat > /tmp/deno-resolve.mjs <<'RESOLVER'
          // Shared helper: reads the CLI's --json output and picks a match.
          // Exact first, then a name-equivalent match (Deno Deploy treats
          // case and separators loosely, so "My_App" and "my-app" can name the
          // same application). Prints the name as Deno Deploy knows it.
          import { readFileSync } from "node:fs";

          const slug = (s) =>
            String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

          // `whoami` answers with "orgs" and `apps list` with "apps"; accept either
          // (and a few plausible aliases) rather than assuming one shape.
          const rows = (raw) => {
            const list = Array.isArray(raw)
              ? raw
              : (raw?.apps ?? raw?.orgs ?? raw?.items ?? raw?.data ?? []);
            if (!Array.isArray(list)) return [];
            return list
              .map((row) =>
                typeof row === "string"
                  ? row
                  : row?.slug ?? row?.name ?? row?.app ?? row?.appName ?? row?.appSlug ?? row?.id
              )
              .filter((n) => typeof n === "string" && n.length > 0);
          };

          // One verdict line on stdout -- "OK<TAB><name>", "NONE" or
          // "UNKNOWN" -- and always exit 0. A verdict rather than an exit
          // status is what lets the caller tell a genuine miss (NONE) from the
          // helper failing to run or the CLI answering a shape we do not
          // recognise (UNKNOWN, or no output at all). Never report an
          // unrecognised answer as "the app does not exist".
          const [mode, file, wanted] = process.argv.slice(2);
          let raw;
          try {
            raw = JSON.parse(readFileSync(file, "utf8"));
          } catch (err) {
            process.stdout.write("UNKNOWN\n");
            process.stderr.write(`could not read the ${mode} response: ${err.message}\n`);
          }

          const names = raw === undefined ? [] : rows(raw);
          if (names.length === 0) {
            if (raw !== undefined) {
              process.stdout.write("UNKNOWN\n");
              process.stderr.write(`no recognisable names in the ${mode} response\n`);
            }
          } else {
            const match =
              names.find((n) => n === wanted) ?? names.find((n) => slug(n) === slug(wanted));
            if (match) {
              process.stdout.write(`OK\t${match}\n`);
            } else {
              process.stdout.write("NONE\n");
              process.stderr.write(names.join("\n") + "\n");
            }
          }
          RESOLVER

          verdict_of() {
            node /tmp/deno-resolve.mjs "$1" "$2" "$3" 2> /tmp/verdict.err || true
          }

          # Auth first: an invalid or expired token fails here and never reaches
          # the org or app lookup, which keeps the causes distinguishable.
          if ! deno deploy whoami --json > /tmp/whoami.json 2> /tmp/whoami.err; then
            echo "::error::DENO_DEPLOY_TOKEN is missing, invalid or expired."
            head -5 /tmp/whoami.err || true
            exit 1
          fi

          # Then the org: "not found" covers both a wrong slug and a token that
          # cannot see the org, so name the orgs the token can reach.
          case "$(verdict_of orgs /tmp/whoami.json "$DEPLOY_ORG")" in
            "OK"$'	'*)
              echo "Org '$DEPLOY_ORG' is visible to this token." ;;
            NONE)
              echo "::error::Org '$DEPLOY_ORG' is not visible to this token."
              echo "Orgs this token can reach:"
              sed -E 's/^/  - /' /tmp/verdict.err || true
              echo "Check DENO_DEPLOY_ORG against the slug on console.deno.com."
              exit 1 ;;
            *)
              echo "::warning::Could not read the org list; assuming '$DEPLOY_ORG' is correct."
              head -3 /tmp/verdict.err || true ;;
          esac

          # Then the app. Failing to list is fail-open: the deploy call is still
          # the authority, and a CLI without `apps list` must not stop a deploy
          # that would otherwise work.
          if ! deno deploy apps list --json --limit 100 --org "$DEPLOY_ORG" \
              > /tmp/apps.json 2> /tmp/apps.err; then
            echo "::warning::Could not list apps in '$DEPLOY_ORG'; using the configured name."
            head -3 /tmp/apps.err || true
            echo "app=$WANTED_APP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          verdict="$(verdict_of apps /tmp/apps.json "$WANTED_APP")"
          case "$verdict" in
            "OK"$'	'*)
              app="${verdict#*$'	'}" ;;
            NONE)
              echo "::error::No application named '$WANTED_APP' exists in org '$DEPLOY_ORG'."
              echo "Applications this token can see in that org:"
              sed -E 's/^/  - /' /tmp/verdict.err || true
              echo
              echo "Create it once from a checkout of that folder, then re-run this workflow:"
              echo "  deno deploy create --non-interactive \\"
              echo "    --org \"$DEPLOY_ORG\" --app \"$WANTED_APP\" --source local"
              echo "Or set DENO_DEPLOY_APP_PREFIX so the folder name matches an existing app."
              exit 1 ;;
            *)
              echo "::warning::Could not read the app list; using the configured name."
              head -3 /tmp/verdict.err || true
              app="$WANTED_APP" ;;
          esac

          if [ "$app" != "$WANTED_APP" ]; then
            echo "::warning::Deno Deploy knows this application as '$app'; using that."
          fi
          echo "Resolved to application '$app'."
          echo "app=$app" >> "$GITHUB_OUTPUT"

      # Deno caches modules and its build cache in the project directory.
      # Exact key only, so a lockfile change cannot restore a stale cache.
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            private/${{ matrix.project.dir }}/node_modules
            ~/.cache/deno
            ~/.deno
          # Normalise the root case: a project at "." would otherwise produce
          # "private/./deno.lock", which glob does not match reliably.
          key: deno-${{ matrix.project.app }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(matrix.project.dir == '.' && 'private/deno.lock' || format('private/{0}/deno.lock', matrix.project.dir)) }}

      # `deno check` names private files and imports. This repo is PUBLIC, so
      # capture the output and emit only pass/fail with paths stripped.
      - name: Type check
        working-directory: private/${{ matrix.project.dir }}
        shell: bash
        run: |
          set -euo pipefail

          run_quiet() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "$label: OK"
              rm -f "$log"; return 0
            fi
            echo "::error::$label failed (output suppressed to protect private source)"
            echo "--- last lines of $label (paths stripped to basenames) ---"
            tail -20 "$log" | sed -E 's#(/[A-Za-z0-9._-]+)+/([A-Za-z0-9._-]+)#\2#g' || true
            echo "--- end ---"
            rm -f "$log"
            return 1
          }

          # An entrypoint is not required (static sites and framework presets
          # differ), so a non-zero exit here is a warning rather than a failure.
          if run_quiet "deno check" deno check --quiet; then
            echo "Type check passed."
          else
            echo "::warning::Type check reported problems; deploying anyway."
          fi

      # NOT redacted: the URL Deno prints is the useful output of this run.
      - name: Deploy
        working-directory: private/${{ matrix.project.dir }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying '${{ matrix.project.app }}' from this directory..."
          deno deploy \
            --non-interactive \
            --org "${{ secrets.DENO_DEPLOY_ORG }}" \
            --app "${{ steps.resolve.outputs.app }}" \
            --prod
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ secrets.DENO_DEPLOY_ORG }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy: \`${{ matrix.project.app }}\`"
            echo
            echo "- Directory: \`${{ matrix.project.dir }}\`"
            echo "- Config: \`${{ matrix.project.config }}\`"
            echo "- Reason: \`${{ matrix.project.reason }}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Job 4: remember the commit that was actually deployed
  # ------------------------------------------------------------------
  record:
    name: "Record deployed commit"
    needs: [poll, detect, deploy]
    # Record once the attempt is fully accounted for: every deploy succeeded,
    # or there was nothing to deploy. A failed detect or deploy must NOT be
    # recorded -- otherwise the next poll sees no change and that commit is
    # never retried, which is how a deploy can be lost silently.
    #
    # `changed` also keeps a no-op poll from writing a fresh cache entry every
    # time. It costs nothing to skip: when there was no new commit the recorded
    # SHA is already the one we would write, and if the state was ever lost,
    # poll reports changed=true and it is written then.
    if: >-
      !cancelled() &&
      needs.poll.result == 'success' &&
      needs.poll.outputs.changed == 'true' &&
      (needs.detect.result == 'success' || needs.detect.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write deployed commit
        env:
          DEPLOYED_SHA: ${{ needs.poll.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DEPLOYED_SHA" > /tmp/deno-deploy-state.txt
          echo "Recorded $DEPLOYED_SHA as the last deployed commit."

      # The run id is in the key because cache entries are immutable: this
      # state has to be rewritten after every clean deploy.
      - name: Save state for next poll
        uses: actions/cache/save@v4
        with:
          path: /tmp/deno-deploy-state.txt
          key: deno-deploy-state-${{ vars.PRIVATE_REPO || github.repository }}-${{ github.run_id }}