name: "Run Bash Scripts on Orange Pi"

# Same pattern as gcp-bash-script-runner.yaml, but the target is a home device reached over
# Tailscale: the runner joins the tailnet as an ephemeral node, then SSHes in with a password.
#
# Scripts come from bash-scripts/, the same folder the GCP runner uses.
#
# Repo secrets (Settings -> Secrets and variables -> Actions). This repo and its logs are public:
# none of these values is ever printed, and every line from the device is sanitized.
#   OPI_TAILSCALE_IP    the device's Tailscale IP / MagicDNS name, or its LAN IP behind a subnet
#                       router (the runner joins with --accept-routes)
#   OPI_SSH_USER        SSH login user
#   OPI_SSH_PASSWORD    SSH password, also used for sudo when the user is not root
#   OPI_SSH_PORT        optional, default 22
#   Tailscale for the runner (same secrets as the other workflows here), one of:
#     TAILSCALE_OAUTH_CLIENT_SECRET + TAILSCALE_TAGS  OAuth client; joins as an ephemeral node
#     TAILSCALE_AUTH_KEY                              fallback auth key
#   EARNAPP_UUID is optional: init-earnapp derives a stable one from TAILSCALE_OAUTH_CLIENT_SECRET
#   (a new OAuth secret = a new device) and sends the link-device URL to TELEGRAM_TOKEN/TELEGRAM_CHAT_ID,
#   never to the log.
#   Script secrets (same names as the GCP runner): HONEYGAIN_, TRAFFMONETIZER_, EARNFM_, REPOCKET_, PAWNS_, PACKETSTREAM_, BITPING_, EARNAPP_, WIPTER_, DOZZLE_, MINI_ROUTER_ (exported to the device as ZILONG_ROUTER_), KONGMING_, WORKFLOW_CRON_ (token: GH_TOKEN by default)
#   opi-init-tailscale-docker.sh alone also gets every OPI_TS_ secret (OPI_TS_IP, OPI_TS_ROUTES, OPI_TS_TAGS,
#   OPI_TS_HOSTNAME, OPI_TS_TAILSCALED_EXTRA_ARGS, ...) and
#   TAILSCALE_OAUTH_CLIENT_SECRET, its only credential (the OAuth client needs auth_keys
#   to log a new node in, plus devices:core / devices:routes to pin OPI_TS_IP and approve routes)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run"
        required: true
        default: "init-honeygain"
        type: choice
        options:
          - all
          - init-honeygain
          - init-traffmonetizer
          - init-earnfm
          - init-repocket
          - init-pawns
          - init-packetstream
          - init-bitping
          - init-earnapp
          - init-wipter
          - init-dozzle
          - init-zilong-router
          - init-kongming
          - init-workflow-cron
          - opi-init-tailscale-docker
          - reset-containers
          # add new script names here as you create them
      debug:
        description: "Show safe debug output (all output is sanitized: no secrets, IPs, emails or hostnames)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  OPI_TAILSCALE_IP: ${{ secrets.OPI_TAILSCALE_IP }}
  OPI_SSH_USER: ${{ secrets.OPI_SSH_USER }}
  OPI_SSH_PASSWORD: ${{ secrets.OPI_SSH_PASSWORD }}
  OPI_SSH_PORT: ${{ secrets.OPI_SSH_PORT }}
  # Same Tailscale secrets as the other workflows in this repo
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
  TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
  TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

jobs:
  discover:
    name: "Discover scripts"
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List scripts
        id: list
        env:
          REQUESTED: ${{ inputs.script }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "all" ] || [ -z "$REQUESTED" ]; then
            # reset-*.sh are destructive, opi-init-tailscale-docker.sh swaps the device's own Tailscale, and
            # init-workflow-cron.sh must run on one device only (on two, every workflow starts twice):
            # only run them when picked by name
            mapfile -t files < <(find bash-scripts -maxdepth 1 -type f -name '*.sh' ! -name 'reset-*.sh' ! -name 'opi-init-tailscale-docker.sh' ! -name 'init-workflow-cron.sh' | sort)
          else
            name="${REQUESTED%.sh}"
            files=("bash-scripts/${name}.sh")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "scripts=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::Missing script: $f"; exit 1; }
          done
          json=$(printf '%s\n' "${files[@]}" | jq -R . | jq -s -c .)
          echo "scripts=$json" >> "$GITHUB_OUTPUT"

  run:
    name: "Run (${{ matrix.script }})"
    needs: discover
    if: needs.discover.outputs.scripts != '[]'
    runs-on: ubuntu-latest
    # One device: never run two scripts on it at once
    concurrency:
      group: orangepi-device
      cancel-in-progress: false

    environment:
      name: "approve-opi-${{ matrix.script }}"

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        script: ${{ fromJson(needs.discover.outputs.scripts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required config
        run: |
          set -euo pipefail
          missing=()
          for v in OPI_TAILSCALE_IP OPI_SSH_USER OPI_SSH_PASSWORD; do
            [ -z "${!v:-}" ] && missing+=("$v") || true
          done
          # The non-expiring OAuth client secret (which needs tags) wins; the auth key is the fallback
          if [ -n "${TAILSCALE_OAUTH_CLIENT_SECRET:-}" ]; then
            [ -n "${TAILSCALE_TAGS:-}" ] || missing+=("TAILSCALE_TAGS")
          elif [ -z "${TAILSCALE_AUTH_KEY:-}" ]; then
            missing+=("TAILSCALE_OAUTH_CLIENT_SECRET or TAILSCALE_AUTH_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Mask sensitive values
        run: |
          echo "::add-mask::${OPI_TAILSCALE_IP}"
          echo "::add-mask::${OPI_SSH_USER}"
          echo "::add-mask::${OPI_SSH_PASSWORD}"

      - name: Prepare log sanitizer
        run: |
          # Every line printed from the device goes through this filter first, masking anything
          # identifying even if a script prints it.
          cat > "${RUNNER_TEMP}/sanitize.pl" <<'PERL'
          use strict;
          use warnings;
          my @lit = grep { defined($_) && length($_) >= 3 }
            map { $ENV{$_} } qw(OPI_TAILSCALE_IP OPI_SSH_USER OPI_SSH_PASSWORD HONEYGAIN_EMAIL HONEYGAIN_PASSWORD HONEYGAIN_DEVICE
                     TRAFFMONETIZER_TOKEN TRAFFMONETIZER_DEVICE EARNFM_TOKEN EARNFM_DEVICE
                     REPOCKET_TOKEN REPOCKET_DEVICE PAWNS_EMAIL PAWNS_PASSWORD PAWNS_DEVICE
                     PACKETSTREAM_CID PACKETSTREAM_DEVICE BITPING_API_KEY BITPING_DEVICE EARNAPP_UUID WIPTER_EMAIL WIPTER_PASSWORD
                     MINI_ROUTER_TURSO_TOKEN MINI_ROUTER_TURSO_URL
                     MINI_ROUTER_INITIAL_PASSWORD MINI_ROUTER_JWT_SECRET
                     KONGMING_TURSO_AUTH_TOKEN KONGMING_TURSO_DATABASE_URL KONGMING_TURSO_TOKEN KONGMING_TURSO_URL
                     KONGMING_PASSWORD KONGMING_SECRET KONGMING_PUBLIC_URL
                     OPI_TS_HOSTNAME OPI_TS_IP OPI_TS_ROUTES OPI_TS_TAGS
                     TAILSCALE_OAUTH_CLIENT_SECRET TAILSCALE_AUTH_KEY);
          my $h = '[0-9A-Fa-f]{1,4}';
          while (my $l = <>) {
            for my $v (@lit) { $l =~ s/\Q$v\E/<redacted>/g; }
            $l =~ s/\b(?:\d{1,3}\.){3}\d{1,3}\b/<ip>/g;
            $l =~ s/(?<![\w:.])(?:(?:$h:){7}$h|(?:$h:){1,7}:(?:$h(?::$h){0,6})?|::(?:$h(?::$h){0,6})?)(?![\w:])/<ipv6>/g;
            $l =~ s{(://)[^/\s@]+@}{$1<creds>@}g;
            $l =~ s/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/<email>/g;
            $l =~ s/\b[\w-]+(?:\.[\w-]+)*\.ts\.net\b/<tailnet-host>/g;
            $l =~ s/tskey-[\w-]+/tskey-<redacted>/g;
            $l =~ s/\b[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b/<id>/g;   # UUID device IDs
            $l =~ s/\b[0-9A-Fa-f]{24,}\b/<id>/g;   # device IDs, hashes
            $l =~ s/\b(?:gh[pousr]_|github_pat_)\w+/<github-token>/g;
            $l =~ s/\bsk-[\w-]{8,}/<api-key>/g;
            $l =~ s/\bBearer\s+\S+/Bearer <redacted>/gi;
            $l =~ s/((?:authkey|auth_key|token|password|passwd|secret|api[_-]?key|-pass|-email)\s*[=: ]\s*)(?!(?:set|unset)\b)\S+/$1<redacted>/gi;
            print $l;
          }
          PERL
          # perl -c reports "syntax OK" on success: only print its output when the check fails
          out=$(perl -c "${RUNNER_TEMP}/sanitize.pl" 2>&1) || { echo "::error::sanitize.pl does not compile"; printf '%s\n' "$out" | tail -n 20; exit 1; }

      - name: Join the tailnet
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          HOST="gh-opi-runner-${GITHUB_RUN_ID}"
          if [ -n "${TAILSCALE_OAUTH_CLIENT_SECRET:-}" ]; then
            # Ephemeral: the node removes itself from the tailnet once the runner goes away
            secret="$(printf '%s' "$TAILSCALE_OAUTH_CLIENT_SECRET" | tr -d '[:space:]')"
            sudo tailscale up --authkey="${secret}?ephemeral=true&preauthorized=true" \
              --advertise-tags="$TAILSCALE_TAGS" --hostname="$HOST" --accept-routes >/dev/null 2>&1
          else
            sudo tailscale up --authkey="$(printf '%s' "$TAILSCALE_AUTH_KEY" | tr -d '[:space:]')" \
              --hostname="$HOST" --accept-routes >/dev/null 2>&1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || { sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq sshpass >/dev/null 2>&1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # The device is only reachable inside the tailnet, which authenticates both ends; the
          # runner is fresh each time, so there is no known_hosts to pin against.
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ServerAliveInterval 30
            ConnectTimeout 20
            PreferredAuthentications password,keyboard-interactive
            PubkeyAuthentication no
          EOF
          chmod 600 ~/.ssh/config

      - name: Preflight checks (safe)
        run: |
          set +e
          SAN="${RUNNER_TEMP}/sanitize.pl"
          PORT="${OPI_SSH_PORT:-22}"
          # A TCP check on the SSH port works for both a Tailscale IP and a LAN IP behind a
          # subnet router (`tailscale ping` only knows tailnet nodes). Routes can take a few
          # seconds to arrive after joining, hence the retries.
          OK=0
          for attempt in $(seq 1 12); do
            if timeout 5 bash -c "exec 3<>/dev/tcp/${OPI_TAILSCALE_IP}/${PORT}" 2>/dev/null; then OK=1; break; fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then
            ROUTES=$(tailscale status --json 2>/dev/null | jq '[.Peer[]? | select(.PrimaryRoutes != null) | .PrimaryRoutes[]] | length' 2>/dev/null)
            echo "::error::device not reachable on its SSH port over tailscale (offline, subnet route not approved, or an ACL blocks the runner's tags; subnet routes visible: ${ROUTES:-0})"
            exit 1
          fi
          OUT=$(SSHPASS="$OPI_SSH_PASSWORD" sshpass -e ssh -p "$PORT" "${OPI_SSH_USER}@${OPI_TAILSCALE_IP}" \
                'printf "arch=%s docker=%s\n" "$(uname -m)" "$(command -v docker >/dev/null && echo yes || echo no)"' 2>&1)
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "$OUT" | perl "$SAN"
            echo "::error::ssh login failed (exit ${RC}): check OPI_SSH_USER / OPI_SSH_PASSWORD and that sshd allows passwords"
            exit 1
          fi

      - name: Run script via Tailscale SSH
        env:
          SCRIPT_PATH: ${{ matrix.script }}
          DEBUG_LOGS: ${{ inputs.debug }}
          # Only these prefixes reach the device. Never add OPI_ or TAILSCALE_ here (opi-init-tailscale-docker.sh
          # alone gets OPI_TS_ and the TAILSCALE_ OAuth client, below).
          # MINI_ROUTER_ secrets are exported under the ZILONG_ROUTER_ names the script reads.
          # WORKFLOW_CRON_ is the token init-workflow-cron.sh dispatches with (GH_TOKEN unless WORKFLOW_CRON_GITHUB_TOKEN
          # is set) and its Telegram alert.
          # Secrets are named one by one below (not toJSON(secrets)) so the runner only ever holds
          # the ones the scripts read; a secret a script starts reading must be added to the list.
          SECRET_FILTER: "HONEYGAIN_,TRAFFMONETIZER_,EARNFM_,REPOCKET_,PAWNS_,PACKETSTREAM_,BITPING_,EARNAPP_,WIPTER_,DOZZLE_,MINI_ROUTER_,KONGMING_,WORKFLOW_CRON_"
          BITPING_API_KEY: ${{ secrets.BITPING_API_KEY }}
          BITPING_CPU_LIMIT: ${{ secrets.BITPING_CPU_LIMIT }}
          BITPING_DEVICE: ${{ secrets.BITPING_DEVICE }}
          BITPING_IMAGE: ${{ secrets.BITPING_IMAGE }}
          BITPING_MAX_PROXY_SESSIONS: ${{ secrets.BITPING_MAX_PROXY_SESSIONS }}
          BITPING_MEMORY_LIMIT: ${{ secrets.BITPING_MEMORY_LIMIT }}
          DOZZLE_ADDR: ${{ secrets.DOZZLE_ADDR }}
          EARNAPP_CPU_LIMIT: ${{ secrets.EARNAPP_CPU_LIMIT }}
          EARNAPP_IMAGE: ${{ secrets.EARNAPP_IMAGE }}
          EARNAPP_MEMORY_LIMIT: ${{ secrets.EARNAPP_MEMORY_LIMIT }}
          EARNAPP_UUID: ${{ secrets.EARNAPP_UUID }}
          WIPTER_CPU_LIMIT: ${{ secrets.WIPTER_CPU_LIMIT }}
          WIPTER_EMAIL: ${{ secrets.WIPTER_EMAIL }}
          WIPTER_IMAGE: ${{ secrets.WIPTER_IMAGE }}
          WIPTER_MEMORY_LIMIT: ${{ secrets.WIPTER_MEMORY_LIMIT }}
          WIPTER_PASSWORD: ${{ secrets.WIPTER_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_CRON_GITHUB_TOKEN: ${{ secrets.WORKFLOW_CRON_GITHUB_TOKEN || secrets.GH_TOKEN }}
          WORKFLOW_CRON_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WORKFLOW_CRON_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOZZLE_AUTH_PROVIDER: ${{ secrets.DOZZLE_AUTH_PROVIDER }}
          DOZZLE_AUTH_TTL: ${{ secrets.DOZZLE_AUTH_TTL }}
          DOZZLE_AUTO_UPDATE: ${{ secrets.DOZZLE_AUTO_UPDATE }}
          DOZZLE_BIND: ${{ secrets.DOZZLE_BIND }}
          DOZZLE_CPU_LIMIT: ${{ secrets.DOZZLE_CPU_LIMIT }}
          DOZZLE_DATA_DIR: ${{ secrets.DOZZLE_DATA_DIR }}
          DOZZLE_DISABLE_AVATARS: ${{ secrets.DOZZLE_DISABLE_AVATARS }}
          DOZZLE_DISABLE_SETUP_WIZARD: ${{ secrets.DOZZLE_DISABLE_SETUP_WIZARD }}
          DOZZLE_ENABLE_ACTIONS: ${{ secrets.DOZZLE_ENABLE_ACTIONS }}
          DOZZLE_ENABLE_MCP: ${{ secrets.DOZZLE_ENABLE_MCP }}
          DOZZLE_ENABLE_SHELL: ${{ secrets.DOZZLE_ENABLE_SHELL }}
          DOZZLE_HOSTNAME: ${{ secrets.DOZZLE_HOSTNAME }}
          DOZZLE_IMAGE: ${{ secrets.DOZZLE_IMAGE }}
          DOZZLE_IMAGE_CHECK_MODE: ${{ secrets.DOZZLE_IMAGE_CHECK_MODE }}
          DOZZLE_LEVEL: ${{ secrets.DOZZLE_LEVEL }}
          DOZZLE_MEMORY_LIMIT: ${{ secrets.DOZZLE_MEMORY_LIMIT }}
          DOZZLE_NO_ANALYTICS: ${{ secrets.DOZZLE_NO_ANALYTICS }}
          DOZZLE_PASSWORD: ${{ secrets.DOZZLE_PASSWORD }}
          DOZZLE_PASSWORD_FILE: ${{ secrets.DOZZLE_PASSWORD_FILE }}
          DOZZLE_PORT: ${{ secrets.DOZZLE_PORT }}
          DOZZLE_RELEASE_CHECK_MODE: ${{ secrets.DOZZLE_RELEASE_CHECK_MODE }}
          DOZZLE_REPLACE_PORTAINER: ${{ secrets.DOZZLE_REPLACE_PORTAINER }}
          DOZZLE_SHELL: ${{ secrets.DOZZLE_SHELL }}
          DOZZLE_USER: ${{ secrets.DOZZLE_USER }}
          EARNFM_CPU_LIMIT: ${{ secrets.EARNFM_CPU_LIMIT }}
          EARNFM_DEVICE: ${{ secrets.EARNFM_DEVICE }}
          EARNFM_IMAGE: ${{ secrets.EARNFM_IMAGE }}
          EARNFM_MEMORY_LIMIT: ${{ secrets.EARNFM_MEMORY_LIMIT }}
          EARNFM_TOKEN: ${{ secrets.EARNFM_TOKEN }}
          HONEYGAIN_CPU_LIMIT: ${{ secrets.HONEYGAIN_CPU_LIMIT }}
          HONEYGAIN_DEVICE: ${{ secrets.HONEYGAIN_DEVICE }}
          HONEYGAIN_EMAIL: ${{ secrets.HONEYGAIN_EMAIL }}
          HONEYGAIN_IMAGE: ${{ secrets.HONEYGAIN_IMAGE }}
          HONEYGAIN_MEMORY_LIMIT: ${{ secrets.HONEYGAIN_MEMORY_LIMIT }}
          HONEYGAIN_PASSWORD: ${{ secrets.HONEYGAIN_PASSWORD }}
          KONGMING_BIND: ${{ secrets.KONGMING_BIND }}
          KONGMING_CPU_LIMIT: ${{ secrets.KONGMING_CPU_LIMIT }}
          KONGMING_HOST: ${{ secrets.KONGMING_HOST }}
          KONGMING_IMAGE: ${{ secrets.KONGMING_IMAGE }}
          KONGMING_MEMORY_LIMIT: ${{ secrets.KONGMING_MEMORY_LIMIT }}
          KONGMING_NETWORK: ${{ secrets.KONGMING_NETWORK }}
          KONGMING_PASSWORD: ${{ secrets.KONGMING_PASSWORD }}
          KONGMING_PORT: ${{ secrets.KONGMING_PORT }}
          KONGMING_PUBLIC_URL: ${{ secrets.KONGMING_PUBLIC_URL }}
          KONGMING_SECRET: ${{ secrets.KONGMING_SECRET }}
          KONGMING_TURSO_AUTH_TOKEN: ${{ secrets.KONGMING_TURSO_AUTH_TOKEN }}
          KONGMING_TURSO_DATABASE_URL: ${{ secrets.KONGMING_TURSO_DATABASE_URL }}
          KONGMING_TURSO_TOKEN: ${{ secrets.KONGMING_TURSO_TOKEN }}
          KONGMING_TURSO_URL: ${{ secrets.KONGMING_TURSO_URL }}
          KONGMING_WORKERS: ${{ secrets.KONGMING_WORKERS }}
          MINI_ROUTER_ALLOW_ANY: ${{ secrets.MINI_ROUTER_ALLOW_ANY }}
          MINI_ROUTER_BIND: ${{ secrets.MINI_ROUTER_BIND }}
          MINI_ROUTER_CPU_LIMIT: ${{ secrets.MINI_ROUTER_CPU_LIMIT }}
          MINI_ROUTER_IMAGE: ${{ secrets.MINI_ROUTER_IMAGE }}
          MINI_ROUTER_INITIAL_PASSWORD: ${{ secrets.MINI_ROUTER_INITIAL_PASSWORD }}
          MINI_ROUTER_JWT_SECRET: ${{ secrets.MINI_ROUTER_JWT_SECRET }}
          MINI_ROUTER_MEMORY_LIMIT: ${{ secrets.MINI_ROUTER_MEMORY_LIMIT }}
          MINI_ROUTER_PORT: ${{ secrets.MINI_ROUTER_PORT }}
          MINI_ROUTER_REQUIRE_API_KEY: ${{ secrets.MINI_ROUTER_REQUIRE_API_KEY }}
          MINI_ROUTER_TURSO_ONLY: ${{ secrets.MINI_ROUTER_TURSO_ONLY }}
          MINI_ROUTER_TURSO_SYNC_SECS: ${{ secrets.MINI_ROUTER_TURSO_SYNC_SECS }}
          MINI_ROUTER_TURSO_TOKEN: ${{ secrets.MINI_ROUTER_TURSO_TOKEN }}
          MINI_ROUTER_TURSO_URL: ${{ secrets.MINI_ROUTER_TURSO_URL }}
          MINI_ROUTER_WORKERS: ${{ secrets.MINI_ROUTER_WORKERS }}
          OPI_TS_EXIT_NODE: ${{ secrets.OPI_TS_EXIT_NODE }}
          OPI_TS_HOSTNAME: ${{ secrets.OPI_TS_HOSTNAME }}
          OPI_TS_HOST_STATE: ${{ secrets.OPI_TS_HOST_STATE }}
          OPI_TS_IMAGE: ${{ secrets.OPI_TS_IMAGE }}
          OPI_TS_IP: ${{ secrets.OPI_TS_IP }}
          OPI_TS_MEMORY_LIMIT: ${{ secrets.OPI_TS_MEMORY_LIMIT }}
          OPI_TS_MIGRATE: ${{ secrets.OPI_TS_MIGRATE }}
          OPI_TS_PORT: ${{ secrets.OPI_TS_PORT }}
          OPI_TS_ROUTES: ${{ secrets.OPI_TS_ROUTES }}
          OPI_TS_TAGS: ${{ secrets.OPI_TS_TAGS }}
          OPI_TS_TAILSCALED_EXTRA_ARGS: ${{ secrets.OPI_TS_TAILSCALED_EXTRA_ARGS }}
          PACKETSTREAM_CID: ${{ secrets.PACKETSTREAM_CID }}
          PACKETSTREAM_CPU_LIMIT: ${{ secrets.PACKETSTREAM_CPU_LIMIT }}
          PACKETSTREAM_DEVICE: ${{ secrets.PACKETSTREAM_DEVICE }}
          PACKETSTREAM_IMAGE: ${{ secrets.PACKETSTREAM_IMAGE }}
          PACKETSTREAM_MEMORY_LIMIT: ${{ secrets.PACKETSTREAM_MEMORY_LIMIT }}
          PAWNS_CPU_LIMIT: ${{ secrets.PAWNS_CPU_LIMIT }}
          PAWNS_DEVICE: ${{ secrets.PAWNS_DEVICE }}
          PAWNS_EMAIL: ${{ secrets.PAWNS_EMAIL }}
          PAWNS_IMAGE: ${{ secrets.PAWNS_IMAGE }}
          PAWNS_MEMORY_LIMIT: ${{ secrets.PAWNS_MEMORY_LIMIT }}
          PAWNS_PASSWORD: ${{ secrets.PAWNS_PASSWORD }}
          REPOCKET_CPU_LIMIT: ${{ secrets.REPOCKET_CPU_LIMIT }}
          REPOCKET_DEVICE: ${{ secrets.REPOCKET_DEVICE }}
          REPOCKET_IMAGE: ${{ secrets.REPOCKET_IMAGE }}
          REPOCKET_MEMORY_LIMIT: ${{ secrets.REPOCKET_MEMORY_LIMIT }}
          REPOCKET_TOKEN: ${{ secrets.REPOCKET_TOKEN }}
          TRAFFMONETIZER_CPU_LIMIT: ${{ secrets.TRAFFMONETIZER_CPU_LIMIT }}
          TRAFFMONETIZER_DEVICE: ${{ secrets.TRAFFMONETIZER_DEVICE }}
          TRAFFMONETIZER_IMAGE: ${{ secrets.TRAFFMONETIZER_IMAGE }}
          TRAFFMONETIZER_MEMORY_LIMIT: ${{ secrets.TRAFFMONETIZER_MEMORY_LIMIT }}
          TRAFFMONETIZER_TOKEN: ${{ secrets.TRAFFMONETIZER_TOKEN }}
        run: |
          set +e
          SECONDS=0
          SAN="${RUNNER_TEMP}/sanitize.pl"
          DEBUG_LOGS="${DEBUG_LOGS:-true}"
          PORT="${OPI_SSH_PORT:-22}"
          umask 077
          LOG=$(mktemp)
          PAYLOAD=$(mktemp)
          trap 'rm -f "$LOG" "$PAYLOAD" "${PAYLOAD}.attach"' EXIT

          # EarnApp's device ID: the EARNAPP_UUID secret, else derived from the Tailscale OAuth
          # secret, so it stays the same across runs without one more secret to manage. A secret
          # that isn't an ID (sdk-node- + 32 hex) is ignored.
          if [ "${SCRIPT_PATH##*/}" = "init-earnapp.sh" ]; then
            EARNAPP_UUID="$(printf '%s' "${EARNAPP_UUID:-}" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            if [ -n "$EARNAPP_UUID" ] && ! [[ "$EARNAPP_UUID" =~ ^sdk-node-[0-9a-f]{32}$ ]]; then
              echo "::warning::EARNAPP_UUID is set but is not an EarnApp device ID (sdk-node- + 32 hex digits); ignoring it"
              EARNAPP_UUID=""
            fi
            export EARNAPP_UUID
          fi
          if [ "${SCRIPT_PATH##*/}" = "init-earnapp.sh" ] && [ -z "${EARNAPP_UUID:-}" ]; then
            if [ -z "${TAILSCALE_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "::error::set EARNAPP_UUID, or TAILSCALE_OAUTH_CLIENT_SECRET to derive it from"
              exit 1
            fi
            EARNAPP_UUID="sdk-node-$(printf 'earnapp-opi:%s' "$TAILSCALE_OAUTH_CLIENT_SECRET" | sha256sum | cut -c1-32)"
            echo "::add-mask::${EARNAPP_UUID}"
            export EARNAPP_UUID
          fi

          # `export KEY='value'` for every set env var starting with $1. An unset secret
          # arrives as an empty string, which is skipped.
          export_prefix() {
            local v n
            while IFS= read -r v; do
              [ -n "${!v}" ] || continue
              n="$v"; [[ "$v" == MINI_ROUTER_* ]] && n="ZILONG_ROUTER_${v#MINI_ROUTER_}"
              printf 'export %s=%q\n' "$n" "${!v}"
            done < <(compgen -e | grep "^$1" || true)
          }

          # Payload: `export KEY='value'` lines, a sudo shim, then the script itself.
          {
            # zilong-router defaults (not secrets); any MINI_ROUTER_ repo secret exported
            # below overrides them.
            printf 'export ZILONG_ROUTER_BIND=0.0.0.0\nexport ZILONG_ROUTER_ALLOW_ANY=1\n'
            IFS=',' read -ra PREFIXES <<< "$SECRET_FILTER"
            for p in "${PREFIXES[@]}"; do export_prefix "$p"; done
            # The device's own Tailscale reuses the runner's OAuth client, so only
            # opi-init-tailscale-docker.sh gets it (plus its OPI_TS_ settings); no other script
            # ever sees TAILSCALE_ values.
            if [ "${SCRIPT_PATH##*/}" = "opi-init-tailscale-docker.sh" ]; then
              export_prefix OPI_TS_
              for v in TAILSCALE_OAUTH_CLIENT_SECRET; do
                [ -n "${!v:-}" ] && printf 'export %s=%q\n' "$v" "${!v}"
              done
            fi
            printf 'export VERBOSE=0\n'
            if [ "$DEBUG_LOGS" = "true" ]; then printf 'export INIT_DEBUG=1\n'; else printf 'export INIT_DEBUG=0\n'; fi
            # sudo without a tty: an askpass helper reads the SSH password from a 0600 file that
            # is removed when the script exits. Scripts keep calling plain `sudo`.
            printf '__SUDO_PW=%q\n' "$OPI_SSH_PASSWORD"
            cat <<'SHIM'
          if [ "$(id -u)" -ne 0 ]; then
            __ASK_DIR="$(mktemp -d)"; chmod 700 "$__ASK_DIR"
            printf '%s\n' "$__SUDO_PW" > "$__ASK_DIR/pw"; chmod 600 "$__ASK_DIR/pw"
            printf '#!/bin/sh\ncat %s/pw\n' "$__ASK_DIR" > "$__ASK_DIR/ask"; chmod 700 "$__ASK_DIR/ask"
            export SUDO_ASKPASS="$__ASK_DIR/ask"
            trap 'rm -rf "$__ASK_DIR"' EXIT
            sudo() { command sudo -A "$@"; }
          fi
          unset __SUDO_PW
          SHIM
            if [ "${SCRIPT_PATH##*/}" = "opi-init-tailscale-docker.sh" ]; then
              # Run from a file, so the script can hand itself to a systemd unit that survives the
              # SSH session dropping while the Tailscale container is replaced
              printf '__S="$(mktemp)"; echo %s | base64 -d > "$__S"\n' "$(base64 -w0 "${SCRIPT_PATH}")"
              cat <<'RUN'
          [ "$(type -t sudo)" = function ] && export -f sudo
          bash "$__S"; __RC=$?; rm -f "$__S"; exit "$__RC"
          RUN
            else
              cat "${SCRIPT_PATH}"
            fi
          } > "$PAYLOAD"

          SHA=$(sha256sum "${SCRIPT_PATH}" | cut -c1-12)

          # The device's host name = its Tailscale name unless OPI_TS_HOSTNAME says otherwise; used
          # to find the node again if the session drops
          DEV_HOST=""
          if [ "${SCRIPT_PATH##*/}" = "opi-init-tailscale-docker.sh" ]; then
            DEV_HOST="$(SSHPASS="$OPI_SSH_PASSWORD" sshpass -e ssh -p "$PORT" "${OPI_SSH_USER}@${OPI_TAILSCALE_IP}" \
              'hostname -s 2>/dev/null || hostname' 2>/dev/null | tail -n1 | tr -d '[:space:]')"
          fi

          SSHPASS="$OPI_SSH_PASSWORD" sshpass -e ssh -p "$PORT" "${OPI_SSH_USER}@${OPI_TAILSCALE_IP}" 'bash -s' \
            < "$PAYLOAD" > "$LOG" 2>&1
          RC=$?

          # opi-init-tailscale-docker.sh replaces the Tailscale this session rides on, so a dropped
          # connection (exit 255) is expected. The deployment runs on in its own systemd unit: wait
          # for the device to come back on the tailnet, then follow the deployment to its end
          # (OPI_TS_ATTACH=1 prints the whole log again and exits with the deployment's code).
          if [ "${SCRIPT_PATH##*/}" = "opi-init-tailscale-docker.sh" ]; then
            { printf 'export OPI_TS_ATTACH=1\n'; cat "$PAYLOAD"; } > "${PAYLOAD}.attach"
            # The node may come back on OPI_TS_IP when that differs from the address used so far
            TARGETS="$OPI_TAILSCALE_IP"
            [ -n "${OPI_TS_IP:-}" ] && [ "$OPI_TS_IP" != "$OPI_TAILSCALE_IP" ] && TARGETS="$TARGETS $OPI_TS_IP"
            TS_NAME="${OPI_TS_HOSTNAME:-$DEV_HOST}"
            TRIES=0
            while [ "$RC" -eq 255 ] && [ "$TRIES" -lt 6 ]; do
              TRIES=$((TRIES + 1))
              TARGET=""
              for _ in $(seq 1 36); do
                # Plus wherever the node is online now, found by name in the runner's peer list
                PEER_IPS="$(tailscale status --json 2>/dev/null | jq -r --arg h "$TS_NAME" '.Peer[]?
                  | select(.Online and (.HostName == $h or (.DNSName | split(".")[0]) == $h))
                  | .TailscaleIPs[]? | select(test("^100\\."))' 2>/dev/null | paste -sd' ' -)"
                for t in $TARGETS $PEER_IPS; do
                  if timeout 5 bash -c "exec 3<>/dev/tcp/${t}/${PORT}" 2>/dev/null; then TARGET="$t"; break 2; fi
                done
                sleep 10
              done
              if [ -z "$TARGET" ]; then
                echo "::error::the device did not come back on the tailnet within 6 minutes"
                break
              fi
              SSHPASS="$OPI_SSH_PASSWORD" sshpass -e ssh -p "$PORT" "${OPI_SSH_USER}@${TARGET}" 'bash -s' \
                < "${PAYLOAD}.attach" > "$LOG" 2>&1
              RC=$?
            done
            rm -f "${PAYLOAD}.attach"
          fi
          DUR=$SECONDS
          set -e

          show() {
            if [ "$DEBUG_LOGS" = "true" ]; then
              grep -aE '^\[[*>+!xd]\] |^\[✓\] ' "$LOG" | perl "$SAN" || true
            else
              grep -aE '^\[[*>+!x]\] |^\[✓\] ' "$LOG" | perl "$SAN" || true
            fi
          }
          STRUCT_LINES=$(grep -acE '^\[[*>+!xd]\] |^\[✓\] ' "$LOG" || true)
          STRUCT_LINES="${STRUCT_LINES:-0}"

          summary() {
            {
              echo "### \`${SCRIPT_PATH##*/}\`: $1"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| exit code | ${RC} |"
              echo "| duration | ${DUR}s |"
              echo "| script sha256 | \`${SHA}\` |"
              echo "| output lines captured | ${STRUCT_LINES} |"
              echo ""
              echo "<details><summary>Output (sanitized)</summary>"
              echo ""
              echo '```text'
              show | tail -n 200
              echo '```'
              echo "</details>"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          # The script's output goes to the job summary only; the log gets its [!] lines as
          # warnings, and a short sanitized tail when it fails.
          if [ "$RC" -eq 0 ]; then
            # The link-device URL holds the ID, so it goes to Telegram, never to this public log
            if [ "${SCRIPT_PATH##*/}" = "init-earnapp.sh" ]; then
              if [ -n "${TELEGRAM_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                TEXT="EarnApp is running on the Orange Pi. If this device isn't linked yet, open this once while logged in to EarnApp: https://earnapp.com/r/${EARNAPP_UUID}"
                if ! curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" \
                    -d "disable_web_page_preview=true" 2>/dev/null; then
                  echo "::warning::could not send the EarnApp link-device URL to Telegram"
                fi
              else
                echo "::warning::TELEGRAM_TOKEN/TELEGRAM_CHAT_ID not set: no way to send the EarnApp link-device URL privately"
              fi
            fi
            { show | grep -a '^\[!\] ' | head -n 5 | while IFS= read -r w; do echo "::warning::${w#\[!\] }"; done; } || true
            summary "succeeded"
            exit 0
          fi

          HINT=""; [ "$RC" -eq 255 ] && HINT=": the SSH connection itself failed, not the script"
          echo "::error::Script ${SCRIPT_PATH} failed (exit ${RC}) after ${DUR}s${HINT}"
          # Short raw tail, sanitized, with SSH/key noise dropped
          perl "$SAN" "$LOG" | grep -avE 'Permanently added|BEGIN [A-Z ]+KEY|PRIVATE KEY|Bearer |tskey-' | tail -n 20 || true
          summary "FAILED"
          exit "$RC"

      - name: Leave the tailnet
        if: always()
        run: sudo tailscale logout >/dev/null 2>&1 || true
