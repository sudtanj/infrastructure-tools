name: Builder Tools - Auto-merge Docker base image updates
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    # The PR must be opened by Dependabot, and the event that triggered this run (e.g. a push to
    # its branch) must come from Dependabot too.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/docker/builder-tools/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
