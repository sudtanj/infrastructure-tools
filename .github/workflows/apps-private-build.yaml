name: "Build Flutter apps: Android, iOS, Windows, macOS, Linux (private repo)"

# ---------------------------------------------------------------------------
# Compiles the Flutter apps that live in a PRIVATE repository for Android,
# iOS, Windows, macOS and Linux, using this PUBLIC repo's free GitHub-hosted
# runner minutes (standard Linux, Windows and macOS runners are unmetered on
# public repos). The compiled files are published as a GitHub Release on the
# PRIVATE repo; this repo never stores them.
#
# HOW THIS WORKS
#   1. poll    - ask GitHub for the private repo's latest commit on the tracked
#                branch; compare with the last one built (cached).
#   2. detect  - checkout the private repo and list every app the push
#                touched. An app is any direct child of `apps/` holding a
#                pubspec.yaml. Nothing to register: add a folder and it is built.
#   3. build   - one job per app and platform. Platform folders are not
#                committed (only customized files such as AndroidManifest.xml),
#                so `flutter create --platforms=<p> .` adds the missing ones
#                first; it skips files that already exist. The Android job also
#                runs `flutter analyze` and `flutter test` first.
#                  android (ubuntu)  apk + appbundle
#                  ios     (macOS)   unsigned .ipa
#                  windows           zip of the Release folder
#                  macos   (macOS)   unsigned .dmg
#                  linux   (ubuntu)  tar.gz of the bundle
#   4. publish - each build job uploads straight to a release on the PRIVATE
#                repo, tagged `<app>-v<version>-<first 7 of the commit sha>`.
#                All platforms share one release; a retry of the same commit
#                replaces its files instead of creating another release.
#
# WHAT YOU GET
#   Android  - a release APK + AAB signed with your keystore when the
#              ANDROID_* secrets are set; otherwise a debug-signed APK, which
#              installs on any device but cannot go to the Play Store. Flutter's
#              template signs release with the debug key; the workflow re-signs
#              APK and AAB with your keystore, in a step of its own.
#   iOS      - an UNSIGNED .ipa. It proves the app compiles and can be
#              re-signed (e.g. AltStore/Sideloadly), but cannot be installed
#              as-is or sent to TestFlight. Signing needs an Apple Developer
#              account and is not wired in yet.
#   Windows  - .zip, unsigned (SmartScreen warns: "More info" -> "Run anyway").
#   macOS    - .dmg, unsigned (first launch: right-click -> Open, or
#              `xattr -cr /Applications/<App>.app`).
#   Linux    - .tar.gz (no AppImage).
#
# SECURITY MODEL -- read before enabling:
#   * This file is in a PUBLIC repo, and so are its run logs. Install and
#     build output names private files, so steps print nothing on success
#     and only a fixed message on failure. Nothing is uploaded with actions/upload-artifact,
#     because artifacts on a public repo are downloadable by anyone. Cache keys
#     are public too, so they hold no secret-derived values.
#   * The release token can write to the private repo. Anyone who can push to
#     this repo can change what it does with it: keep push access to trusted
#     people, and scope the token to that one repository.
#   * Only the Android signing step sees the keystore; build steps, which run
#     third-party code, do not.
#   * Actions are pinned to commit SHAs.
#
# SETUP
#   secret PRIVATE_REPO_TOKEN       read access to the private repo (required)
#   secret PRIVATE_REPO             "owner/name" of the private repo (required)
#   secret BUILD_REF                branch to track (defaults to main)
#   secret MOBILE_RELEASE_TOKEN     fine-grained PAT on the private repo with
#                                   Contents: read & write, used to create
#                                   releases. Falls back to PRIVATE_REPO_TOKEN
#                                   if that one already has write access.
#   secret ANDROID_KEYSTORE_BASE64  OPTIONAL, all four together: `base64 -w0
#   secret ANDROID_KEYSTORE_PASSWORD  release.jks`, its store password, the
#   secret ANDROID_KEY_ALIAS          key alias and the key password. One
#   secret ANDROID_KEY_PASSWORD       keystore signs every app. Keep a backup:
#                                     losing it means you can never update an
#                                     app already on the Play Store.
#
# VERSIONS
#   --build-name   = pubspec.yaml `version:` (x.y.z; a +N suffix is dropped)
#   --build-number = this workflow's run number, which only ever increases.
#
# BUILD-TIME VALUES
#   Secrets for the app reach it as --dart-define values. Apps that do not
#   read them ignore them.
#
# RUNNING IT BY HAND
#   Re-run with `force` checked to build every app, even when the private repo
#   has not moved since the last successful build.
#
# WHAT COUNTS AS "BUILT"
#   The commit is recorded by the `record` job only when every build
#   succeeded (or there was nothing to build), so a failure is retried on the
#   next poll instead of being skipped as "nothing new".
# ---------------------------------------------------------------------------

on:
  # Every 30 minutes: app builds are slower and rarer than web deploys. Each
  # poll is one API call, and a no-change run stops at the poll job.
  # Dispatched by an external workflow-cron (bash-scripts/init-workflow-cron.sh):
  # GitHub's own `schedule:` starts late or skips runs.
  # Without that, put this back:
  # schedule:
  #   - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build every app even if the private repo has no new commits"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apps-build-${{ github.repository }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  APPS_DIR: 'apps'
  CI: 'true'

jobs:
  # ------------------------------------------------------------------
  # Job 1: has the private repo moved?
  # ------------------------------------------------------------------
  poll:
    name: "Poll private repo"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      sha: ${{ steps.poll.outputs.sha }}

    steps:
      # The `record` job rewrites this file after every clean build, with the
      # run id in the key because cache entries are immutable; `restore-keys`
      # picks the most recent one.
      - name: Restore state for next poll
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apps-build-state.txt
          key: apps-build-state
          restore-keys: |
            apps-build-state-

      - name: Resolve repo and fetch latest commit
        id: poll
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CFG_REPO: ${{ secrets.PRIVATE_REPO }}
          CFG_REF: ${{ secrets.BUILD_REF }}
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail

          force_on() {
            case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No credential: set secret PRIVATE_REPO_TOKEN."
            exit 1
          fi

          REPO="${CFG_REPO:-}"
          if ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Set secret PRIVATE_REPO to 'owner/name'."
            exit 1
          fi
          REF="${CFG_REF:-main}"

          if ! SHA=$(gh api "repos/${REPO}/commits/${REF}" --jq '.sha' 2>/dev/null) || [ -z "$SHA" ]; then
            echo "::error::Cannot read the private repo. Check the token has read access and BUILD_REF."
            exit 1
          fi

          PREV=""
          [ -f /tmp/apps-build-state.txt ] && PREV="$(cat /tmp/apps-build-state.txt)"

          CHANGED="false"
          if [ "$SHA" != "$PREV" ]; then
            CHANGED="true"
          fi
          if force_on; then
            CHANGED="true"
          fi

          {
            echo "changed=$CHANGED"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Job 2: which apps need building?
  # ------------------------------------------------------------------
  detect:
    name: "Detect apps"
    needs: poll
    if: ${{ needs.poll.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      # A bare integer survives even if GitHub drops `apps` for matching a
      # secret; the record job uses it to spot that case.
      count: ${{ steps.detect.outputs.count }}
    steps:
      # By sha, not branch: a branch name equal to the BUILD_REF secret would
      # be blanked in the poll output.
      - name: Checkout private repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.sha }}
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          # Full history so the push can be diffed against the last build.
          fetch-depth: 0

      - name: Restore last built commit
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apps-build-state.txt
          key: apps-build-state
          restore-keys: |
            apps-build-state-

      - name: Find changed apps
        id: detect
        working-directory: private
        shell: bash
        env:
          TARGET_SHA: ${{ needs.poll.outputs.sha }}
          FORCE: ${{ inputs.force || github.event.inputs.force }}
        run: |
          set -euo pipefail

          force_on() {
            case "$(printf '%s' "${FORCE:-}" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          base=''
          [ -f /tmp/apps-build-state.txt ] && base="$(cat /tmp/apps-build-state.txt)"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=''
          fi
          if force_on; then
            base=''
          fi

          changed=()
          if [ -n "$base" ]; then
            mapfile -t changed < <(git diff --name-only "$base" "$TARGET_SHA" -- "$APPS_DIR")
          fi

          apps='[]'
          if [ -d "$APPS_DIR" ]; then
            for path in "$APPS_DIR"/*/; do
              [ -d "$path" ] || continue
              dir="${path%/}"
              name="${dir##*/}"

              [ -f "$dir/pubspec.yaml" ] || continue
              # The name becomes a release tag and a file name.
              if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
                echo "::warning::Skipped an app folder with an unsupported name."
                continue
              fi

              if [ -n "$base" ]; then
                hit=0
                for file in ${changed[@]+"${changed[@]}"}; do
                  case "$file" in "$dir"/*) hit=1; break ;; esac
                done
                if [ "$hit" -eq 0 ]; then
                  continue
                fi
              fi

              version="$(sed -nE 's/^version:[[:space:]]*//p' "$dir/pubspec.yaml" | head -1 | tr -d "\"' \r")"
              version="${version%%+*}"
              if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::An app's pubspec.yaml needs a \"version:\" of the form x.y.z."
                exit 1
              fi
              tag="${name}-v${version}-${TARGET_SHA:0:7}"

              apps="$(jq -c --arg name "$name" --arg dir "$dir" --arg version "$version" --arg tag "$tag" \
                '. + [{name: $name, dir: $dir, version: $version, tag: $tag}]' <<<"$apps")"
            done
          fi

          count="$(jq 'length' <<<"$apps")"
          if [ "$count" -eq 0 ] && force_on; then
            echo "::error::force was requested but no app was found under $APPS_DIR/."
            exit 1
          fi

          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Job 3: build and publish, one job per app and platform
  # ------------------------------------------------------------------
  build:
    name: "${{ matrix.target.id }}: ${{ matrix.app.name }}"
    needs: [poll, detect]
    if: ${{ needs.detect.outputs.apps != '' && needs.detect.outputs.apps != '[]' }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'`: the matrix is built before `if` is evaluated, and
        # fromJSON('') fails the run when detect was skipped.
        app: ${{ fromJSON(needs.detect.outputs.apps || '[]') }}
        # `id` is the Flutter platform name.
        target:
          - { id: android, os: ubuntu-latest }
          - { id: ios, os: macos-latest }
          - { id: windows, os: windows-latest }
          - { id: macos, os: macos-latest }
          - { id: linux, os: ubuntu-latest }

    steps:
      - name: Checkout private repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ needs.poll.outputs.sha }}
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Setup Java
        if: ${{ matrix.target.id == 'android' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Caches Gradle and its dependencies. Unlike setup-java's `cache:
      # gradle`, it does not fail when android/ does not exist yet. No job
      # summary: it would list dependencies in a public run page.
      - name: Setup Gradle
        if: ${{ matrix.target.id == 'android' }}
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          add-job-summary: never

      # The runner's default Xcode can lag behind what current Flutter
      # requires; pick the newest stable one installed.
      - name: Select Xcode
        if: ${{ matrix.target.id == 'ios' || matrix.target.id == 'macos' }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install Linux build tools
        if: ${{ matrix.target.id == 'linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles(format('private/{0}/pubspec.yaml', matrix.app.dir)) }}"

      # No secrets in this step: dependency installs run package code.
      # `flutter create` writes only the files that are missing. Output names
      # private files, so run_quiet is silent on success and prints only a
      # fixed message on failure.
      - name: Add platform project and fetch packages
        working-directory: private/${{ matrix.app.dir }}
        shell: bash
        env:
          PLATFORM: ${{ matrix.target.id }}
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              rm -f "$log"; return 0
            fi
            echo "::error::$label failed (output suppressed to protect private source)"
            rm -f "$log"; return 1
          }

          run_quiet "flutter create" flutter create --org com.tanoitcorp --platforms="$PLATFORM" .
          run_quiet "flutter pub get" flutter pub get

          # Needed for LAN access; the generated Info.plist lacks it.
          if [ "$PLATFORM" = ios ]; then
            plist=ios/Runner/Info.plist
            key=NSLocalNetworkUsageDescription
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1 \
              || /usr/libexec/PlistBuddy -c "Add :$key string 'Connects to devices on your local network'" "$plist"
          fi

      # Once per app, on the Android job. A failure fails that job, so no
      # Android release; the other platforms still build.
      - name: Analyze and test
        if: ${{ matrix.target.id == 'android' }}
        working-directory: private/${{ matrix.app.dir }}
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              rm -f "$log"; return 0
            fi
            echo "::error::$label failed (output suppressed to protect private source)"
            rm -f "$log"; return 1
          }

          run_quiet "flutter analyze" flutter analyze --no-fatal-infos
          # `flutter test` exits non-zero when test/ does not exist.
          if [ -d test ]; then
            run_quiet "flutter test" flutter test
          fi

      # App secrets only: no signing keys, because build tooling runs third-party code.
      - name: Build
        working-directory: private/${{ matrix.app.dir }}
        shell: bash
        env:
          PLATFORM: ${{ matrix.target.id }}
          APP_NAME: ${{ matrix.app.name }}
          VERSION_NAME: ${{ matrix.app.version }}
          VERSION_CODE: ${{ github.run_number }}
          SHA: ${{ needs.poll.outputs.sha }}
          # Unset secrets are empty; apps that do not read them ignore them.
          TELEGRAM_API_ID: ${{ secrets.TELEFLIX_TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEFLIX_TELEGRAM_API_HASH }}
          TELEFLIX_INVITE_LINK: ${{ secrets.TELEFLIX_INVITE_LINK }}
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              rm -f "$log"; return 0
            fi
            echo "::error::$label failed (output suppressed to protect private source)"
            rm -f "$log"; return 1
          }

          # Tooling may echo --dart-define as base64, which Actions does not
          # mask on its own.
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH TELEFLIX_INVITE_LINK; do
            val="${!name}"
            if [ -n "$val" ]; then
              echo "::add-mask::$(printf '%s' "$name=$val" | base64 | tr -d '\n')"
            fi
          done

          out=release-files
          mkdir -p "$out"
          stem="${APP_NAME}-${VERSION_NAME}-${SHA:0:7}-${PLATFORM}"
          flags=(--release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"
            --dart-define=TELEGRAM_API_ID="$TELEGRAM_API_ID"
            --dart-define=TELEGRAM_API_HASH="$TELEGRAM_API_HASH"
            --dart-define=TELEFLIX_INVITE_LINK="$TELEFLIX_INVITE_LINK")

          case "$PLATFORM" in
            android)
              # Release builds overrun Gradle's default heap. The user-level
              # file beats the project's gradle.properties.
              mkdir -p "$HOME/.gradle"
              echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> "$HOME/.gradle/gradle.properties"
              run_quiet "flutter build apk" flutter build apk "${flags[@]}"
              run_quiet "flutter build appbundle" flutter build appbundle "${flags[@]}"
              ;;
            ios)
              run_quiet "flutter build ios" flutter build ios "${flags[@]}" --no-codesign
              # An .ipa is a zip of Payload/<name>.app.
              app_bundle="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)"
              if [ -z "$app_bundle" ]; then
                echo "::error::The build contains no .app bundle."
                exit 1
              fi
              stage="$RUNNER_TEMP/ipa"
              mkdir -p "$stage/Payload"
              cp -R "$app_bundle" "$stage/Payload/"
              (cd "$stage" && zip -qry "$OLDPWD/$out/${stem}-unsigned.ipa" Payload)
              ;;
            windows)
              run_quiet "flutter build windows" flutter build windows "${flags[@]}"
              dest="$PWD/$out/${stem}.zip"
              (cd build/windows/x64/runner/Release && 7z a -tzip -bso0 -bsp0 "$dest" .)
              ;;
            macos)
              run_quiet "flutter build macos" flutter build macos "${flags[@]}"
              app_bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
              if [ -z "$app_bundle" ]; then
                echo "::error::The build contains no .app bundle."
                exit 1
              fi
              hdiutil create -quiet -volname "$APP_NAME" -srcfolder "$app_bundle" -ov -format UDZO "$out/${stem}.dmg"
              ;;
            linux)
              run_quiet "flutter build linux" flutter build linux "${flags[@]}"
              tar -czf "$out/${stem}.tar.gz" -C build/linux/x64/release/bundle .
              ;;
          esac

      # The only step that sees the keystore. Without one, the template's
      # debug-signed APK ships and the AAB is dropped.
      - name: Sign Android release
        if: ${{ matrix.target.id == 'android' }}
        working-directory: private/${{ matrix.app.dir }}
        shell: bash
        env:
          APP_NAME: ${{ matrix.app.name }}
          VERSION_NAME: ${{ matrix.app.version }}
          SHA: ${{ needs.poll.outputs.sha }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          out=release-files
          stem="${APP_NAME}-${VERSION_NAME}-${SHA:0:7}-android"
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab

          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KS_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            cp "$apk" "$out/${stem}-debug.apk"
            exit 0
          fi

          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          KEY_PASS="${KEY_PASS:-$KS_PASS}"
          export KS_PASS KEY_PASS

          sign_failed() { echo "::error::Android signing failed (output suppressed)"; exit 1; }

          # apksigner re-signs the template's debug-signed APK with the release key.
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk" >/dev/null 2>&1 || sign_failed
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$out/${stem}-release.apk" "$RUNNER_TEMP/aligned.apk" >/dev/null 2>&1 || sign_failed

          cp "$aab" "$out/${stem}-release.aab"
          # Drop only the debug signature files so the release key alone signs;
          # zip exits 12 when none match.
          zip -q -d "$out/${stem}-release.aab" 'META-INF/*.SF' 'META-INF/*.RSA' \
            'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          jarsigner -keystore "$ks" -storepass:env KS_PASS -keypass:env KEY_PASS \
            "$out/${stem}-release.aab" "$KEY_ALIAS" >/dev/null 2>&1 || sign_failed

      - name: Publish to private repo release
        working-directory: private/${{ matrix.app.dir }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MOBILE_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          REPO: ${{ secrets.PRIVATE_REPO }}
          TAG: ${{ matrix.app.tag }}
          SHA: ${{ needs.poll.outputs.sha }}
          APP_NAME: ${{ matrix.app.name }}
          VERSION_NAME: ${{ matrix.app.version }}
        run: |
          set -euo pipefail
          # The platform jobs race to create the same release: whoever loses
          # gets "already exists" and simply uploads to it. A retry of the same
          # commit reuses the release and replaces its files.
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --target "$SHA" \
              --title "${APP_NAME} ${VERSION_NAME} (${SHA:0:7})" \
              --notes "Built from ${SHA} by the apps build workflow." >/dev/null \
              || gh release view "$TAG" -R "$REPO" >/dev/null
          fi
          gh release upload "$TAG" release-files/* -R "$REPO" --clobber >/dev/null

  # ------------------------------------------------------------------
  # Job 4: remember the commit that was actually built
  # ------------------------------------------------------------------
  record:
    name: "Record built commit"
    needs: [poll, detect, build]
    if: >-
      !cancelled() &&
      needs.poll.result == 'success' &&
      needs.poll.outputs.changed == 'true' &&
      (needs.detect.result == 'success' || needs.detect.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write built commit
        env:
          BUILT_SHA: ${{ needs.poll.outputs.sha }}
          DETECT_COUNT: ${{ needs.detect.outputs.count }}
          DETECT_APPS: ${{ needs.detect.outputs.apps }}
        run: |
          set -euo pipefail
          if [ -n "${DETECT_COUNT:-}" ] && [ "${DETECT_COUNT}" != "0" ] && [ -z "${DETECT_APPS:-}" ]; then
            echo "::error::GitHub discarded the 'apps' job output because it matched a repository secret, so no build ran."
            echo "Detect found ${DETECT_COUNT} app(s). Rename the app folder whose name matches a secret value."
            exit 1
          fi
          printf '%s' "$BUILT_SHA" > /tmp/apps-build-state.txt

      - name: Save state for next poll
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apps-build-state.txt
          key: apps-build-state-${{ github.run_id }}
