name: Builder Tools - Build and push Docker images

# Generic per-folder Docker image builder: every top-level folder in this
# repo that contains a Dockerfile is treated as an independent image. On
# push to main, only the folder(s) actually touched by that push get
# built - each gets its OWN auto-bumped version tag (git tags named
# "<folder>-vX.Y.Z", scoped to that folder, independent of every other
# folder's tag sequence) and its own Docker Hub repository
# (docker.io/sudtanj/<folder-name>), pushed as both ":latest" and
# ":<the new tag>".
#
# To add a new image: create a new top-level folder with a Dockerfile in
# it (see paseo-codex/ for a full example, including its
# own docker-compose.yml/README.md pattern - not required, just a
# convention). Nothing else needs to change here; the next push that
# touches that folder builds and publishes it automatically.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   DOCKER_HUB_KEY  - a Docker Hub access token with Read & Write scope
#                      (Docker Hub -> Account Settings -> Security ->
#                      Personal access tokens). Used for every image; the
#                      Docker Hub username (sudtanj) is hardcoded below
#                      since it isn't sensitive.
#
# Also requires the repo's default GITHUB_TOKEN to have write access, so
# the per-folder tag-push step can push new tags: Settings -> Actions ->
# General -> Workflow permissions -> "Read and write permissions".
#
# Multi-arch (linux/amd64 + linux/arm64) via QEMU emulation in a single
# job per folder - simple and uniform across every folder, at the cost of
# a slower arm64 build than native arm64 runners would give. Fine for
# small/medium images; a folder with an unusually heavy build (this
# repo's paseo-codex/ image, for one) will just take
# longer to build on arm64, not fail.
#
# Per-folder override: put a `.platforms` file in the folder (for example
# `linux/amd64`) to build a different platform list; QEMU is skipped when
# no emulated platform is requested. paseo-lite/ uses this (amd64 only).
on:
  push:
    branches:
      - main
    paths:
      - 'builder-tools/**'
      - '!builder-tools/mi3-padavan-firmware-builder/**'
      - '!builder-tools/opi-zero3-armbian/**'
      - '.github/workflows/builder-tools-docker-publish.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      folder:
        description: >-
          Folder to build (must contain a Dockerfile). Leave empty to
          build every folder that has one.
        required: false
      no_cache:
        description: 'Build without Docker layer cache'
        required: false
        type: boolean
        default: false

env:
  DOCKERHUB_NAMESPACE: sudtanj

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.detect.outputs.folders }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect which folder(s) to build
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FOLDER: ${{ inputs.folder }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_folders_with_dockerfile() {
              find ./builder-tools -mindepth 2 -maxdepth 2 -type f -name Dockerfile \
                  -printf '%h\n' | sed 's#^\./builder-tools/##' | sort -u
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_FOLDER" ]; then
              if [ ! -f "builder-tools/${INPUT_FOLDER}/Dockerfile" ]; then
                  echo "::error::'builder-tools/${INPUT_FOLDER}/Dockerfile' does not exist" >&2
                  exit 1
              fi
              folders="$INPUT_FOLDER"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
              folders="$(all_folders_with_dockerfile)"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              # New branch / first push this workflow has seen - nothing to
              # diff against, so build everything rather than nothing.
              folders="$(all_folders_with_dockerfile)"
          else
              changed_top_level_dirs="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- builder-tools | awk -F/ 'NF >= 3 { print $2 }' | sort -u)"
              folders=""
              while IFS= read -r dir; do
                  [ -f "builder-tools/${dir}/Dockerfile" ] && folders="${folders}${dir}"$'\n'
              done <<< "$changed_top_level_dirs"
              folders="$(echo "$folders" | sed '/^$/d' | sort -u)"
          fi

          json=$(printf '%s\n' "$folders" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "folders=${json}" >> "$GITHUB_OUTPUT"
          echo "Folders to build: ${json}"

  build:
    needs: discover
    if: needs.discover.outputs.folders != '[]'
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.discover.outputs.folders) }}
    # One build per folder at a time: two runs started together (a push plus a
    # manual dispatch) would otherwise both pick the same next version tag and
    # the second would fail pushing it.
    concurrency:
      group: builder-tools-${{ matrix.folder }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-bump this folder's version tag
        id: tag
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          latest=$(git tag --list "${FOLDER}-v*" | sort -V | tail -1)
          if [ -z "$latest" ]; then
              new_version="v0.1.0"
          else
              ver="${latest#${FOLDER}-v}"
              IFS='.' read -r major minor patch <<< "$ver"
              new_version="v${major}.${minor}.$((patch + 1))"
          fi
          new_tag="${FOLDER}-${new_version}"

          git tag "$new_tag"
          git push origin "$new_tag"

          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Tagged ${FOLDER} as ${new_tag}"

      - name: Resolve target platforms
        id: platforms
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          set -euo pipefail
          # Optional per-folder override: <folder>/.platforms (comma or
          # newline separated, # comments allowed). Default: amd64 + arm64.
          platforms="linux/amd64,linux/arm64"
          if [ -f "builder-tools/${FOLDER}/.platforms" ]; then
              custom=$(sed 's/#.*//' "builder-tools/${FOLDER}/.platforms" | tr ',' '\n' | sed 's/[[:space:]]//g; /^$/d' | paste -sd, -)
              if [ -n "$custom" ]; then platforms="$custom"; fi
          fi
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          case "$platforms" in *arm64*|*arm/*) echo "needs_qemu=true" >> "$GITHUB_OUTPUT" ;; *) echo "needs_qemu=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "Platforms for ${FOLDER}: ${platforms}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (for arm64 emulation)
        if: steps.platforms.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./builder-tools/${{ matrix.folder }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          pull: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.folder }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.folder }}:${{ steps.tag.outputs.new_version }}
          cache-from: type=gha,scope=${{ matrix.folder }}
          cache-to: type=gha,mode=max,scope=${{ matrix.folder }}
          no-cache: ${{ inputs.no_cache == true || github.event_name == 'schedule' }}
