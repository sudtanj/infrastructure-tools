name: "Majun audio probe"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/play" && cd "$RUNNER_TEMP/play"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.55.0 > /dev/null
          npx playwright install --with-deps chromium chromium-headless-shell > /dev/null
          cp "$GITHUB_WORKSPACE/.github/scripts/audio-probe.mjs" .
          sudo apt-get install -y -qq xvfb pulseaudio pulseaudio-utils > /dev/null
          echo "--- no pulse"; xvfb-run -a node audio-probe.mjs
