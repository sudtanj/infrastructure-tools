name: Builder Tools - Image Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Image prompt
        required: true
        type: string
      steps:
        description: Inference steps (SD-Turbo works best with 1-4)
        required: false
        default: '2'
        type: string

concurrency:
  group: image-generation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd-turbo-v1

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate

      - name: Generate image
        env:
          PROMPT: ${{ inputs.prompt }}
          STEPS: ${{ inputs.steps }}
        run: |
          python - <<'PY'
          import os, torch
          from diffusers import AutoPipelineForText2Image
          pipe = AutoPipelineForText2Image.from_pretrained(
              "stabilityai/sd-turbo", torch_dtype=torch.float32)
          img = pipe(os.environ["PROMPT"],
                     num_inference_steps=int(os.environ["STEPS"]),
                     guidance_scale=0.0).images[0]
          img.save("out.png")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: out.png
          retention-days: 7
