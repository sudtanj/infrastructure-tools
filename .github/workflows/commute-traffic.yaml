name: "Commute traffic: home and work, to Telegram"

# ---------------------------------------------------------------------------
# Every working day (Monday to Friday) opens Google Maps in the saved
# chrome-cdp-session Chrome, browsing through the home exit node, and reads
# the driving time in live traffic:
#   08:00  home to work, plus Google's prediction for leaving at 11:00
#   11:00  home to work, live only
#   17:00  work to home, plus the prediction for leaving at 18:00
#   18:00  work to home, live only
# The script, commute_traffic/commute_traffic.ts in the PRIVATE repo, drives
# that Chrome over CDP; the summary, a map of route 1 coloured by its own
# Waze jams and a Google Maps screenshot go to Telegram. Manual runs pick the
# direction by the time of day (from 14:00, work to home) unless the
# `direction` input says otherwise.
#
# HOW THIS WORKS
#   1. The crons fire at 08:00, 11:00, 17:00 and 18:00 in UTC+7 (GitHub can
#      start scheduled runs a few minutes late). Weekends in COMMUTE_TZ are
#      skipped, and public holidays too when HOLIDAY_COUNTRY is set (date.nager.at; if that
#      service is down the run goes ahead).
#   2. The saved Chrome profile (release tag `chrome-cdp-state` on the private
#      repo) is restored, as in tokopedia-search.yaml, so Google sees a known
#      browser. It is only read, never saved back. Without a saved profile
#      the run uses a fresh one.
#   3. The runner joins the tailnet through TAILSCALE_EXIT_NODE, so Google
#      sees the home IP, never a datacenter one, then Chrome starts with CDP
#      on loopback.
#   4. The script opens the route "leave now" (with arrival times and each
#      route's streets) and, on the 08:00 and 17:00 runs, "depart at 11:00"
#      or "depart at 18:00" (the typical range Google Maps shows). Then it
#      adds, each optional (a failure only drops that part):
#      - Waze Live Map: accidents, hazards, closures, heavy jams on the route
#      - Jakarta's odd-even (ganjil-genap) plate rule on the route's streets
#      - live snapshots from DKI's public CCTV (jakcctv.jakarta.go.id) on the
#        first route's streets
#      - rain on the way and air quality from Open-Meteo (free, no key)
#      and queues the summary and the photos on the runner.
#   5. Chrome stops and the runner leaves the tailnet, even on failure.
#   6. The queue (the summary, or the error and a screenshot of the page) is
#      sent to Telegram, from the runner's own network: Telegram times out
#      through the home exit node.
#
# SECRETS (Settings > Secrets and variables > Actions)
#   PRIVATE_REPO       "owner/name" of the private repo holding the script
#   PRIVATE_REPO_TOKEN Contents: Read on it (clones the script, downloads the
#                      profile)
#   BUILD_REF          OPTIONAL branch to run the script from, default main
#   STATE_KEY          passphrase of the saved Chrome profile, as in
#                      chrome-cdp-session.yaml
#   TAILSCALE_OAUTH_CLIENT_SECRET + TAILSCALE_TAGS, or TAILSCALE_AUTH_KEY
#                      the same tailnet credentials as the worker workflows
#   TAILSCALE_EXIT_NODE exit node, as in the worker workflows
#   TELEGRAM_TOKEN     bot token from @BotFather
#   TELEGRAM_CHAT_ID   your chat ID (e.g. from @userinfobot); press Start in
#                      your bot once so it may message you
#   HOME_ADDRESS       home, as you would type it in Google Maps, or "lat,lng"
#   WORK_ADDRESS       work, same format
#   COMMUTE_TZ         OPTIONAL IANA time zone, default Asia/Jakarta. Outside
#                      UTC+7, change the cron below too (it is in UTC).
#   HOLIDAY_COUNTRY    OPTIONAL two-letter country code (e.g. ID) to skip
#                      public holidays
#   PLATE_PARITY       OPTIONAL "odd" or "even" (or the plate's last digit),
#                      to say whether today's odd-even rule bars your car
#
# THIS REPO IS PUBLIC: the addresses, chat ID, time zone and plate live only
# in secrets. The log prints only the step reached, route, report and camera
# counts and, on failure, the kind of page Google showed; the times, routes,
# streets, map links, Waze reports, weather, CCTV and screenshots go only to
# Telegram. No artifacts are
# uploaded.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 01:00, 04:00, 10:00 and 11:00 UTC = 08:00, 11:00, 17:00 and 18:00 in
    # UTC+7, Monday to Friday.
    - cron: '0 1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      direction:
        description: 'Route direction (auto: from 14:00 work to home)'
        type: choice
        options: [auto, to-work, to-home]
        default: auto

permissions:
  contents: read

concurrency:
  group: commute-traffic
  cancel-in-progress: false

jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMMUTE_TZ: ${{ secrets.COMMUTE_TZ || 'Asia/Jakarta' }}
      PREDICT_TIME: '11:00'
      RETURN_PREDICT_TIME: '18:00'
      COMMUTE_DIRECTION: ${{ inputs.direction || 'auto' }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
      TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
      STATE_TAG: chrome-cdp-state
      PROFILE_DIR: /home/runner/chrome-profile

    steps:
      - name: Check secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          WORK_ADDRESS: ${{ secrets.WORK_ADDRESS }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in PRIVATE_REPO PRIVATE_REPO_TOKEN STATE_KEY TAILSCALE_EXIT_NODE TELEGRAM_TOKEN TELEGRAM_CHAT_ID HOME_ADDRESS WORK_ADDRESS; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ -n "${TAILSCALE_OAUTH_CLIENT_SECRET:-}" ]; then
            if [ -z "${TAILSCALE_TAGS:-}" ]; then missing+=("TAILSCALE_TAGS"); fi
          elif [ -z "${TAILSCALE_AUTH_KEY:-}" ]; then
            missing+=("TAILSCALE_OAUTH_CLIENT_SECRET or TAILSCALE_AUTH_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secret(s): ${missing[*]}"
            exit 1
          fi
          if [[ ! "$COMMUTE_TZ" =~ ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$ ]] || [ ! -e "/usr/share/zoneinfo/$COMMUTE_TZ" ]; then
            echo "::error::COMMUTE_TZ must be an IANA time zone such as Asia/Jakarta."
            exit 1
          fi
          # Not a secret, but a real address in a public log.
          echo "::add-mask::${TAILSCALE_EXIT_NODE}"
          echo "Secrets present."

      - name: Skip non-working days
        id: gate
        env:
          HOLIDAY_COUNTRY: ${{ secrets.HOLIDAY_COUNTRY }}
        run: |
          set -euo pipefail
          export TZ="$COMMUTE_TZ"
          # Manual runs always go ahead, right away.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$(date +%u)" -gt 5 ]; then
              echo "Weekend; nothing to do."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "${HOLIDAY_COUNTRY:-}" ]; then
              if [[ ! "$HOLIDAY_COUNTRY" =~ ^[A-Za-z]{2}$ ]]; then
                echo "::error::HOLIDAY_COUNTRY must be a two-letter country code."
                exit 1
              fi
              # Whole hours from UTC, e.g. +0700 -> 7.
              z="$(date +%z)"
              offset="$((10#${z:1:2}))"
              [ "${z:0:1}" = "-" ] && offset="-$offset"
              code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
                "https://date.nager.at/api/v3/IsTodayPublicHoliday/${HOLIDAY_COUNTRY}?offset=${offset}" || true)"
              case "$code" in
                200) echo "Public holiday; nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
                204) echo "Working day." ;;
                *)   echo "::warning::Holiday check unavailable (HTTP ${code:-none}); going ahead." ;;
              esac
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout private repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ secrets.BUILD_REF || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          sparse-checkout: commute_traffic
          path: private

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          # 24 runs .ts files directly (type stripping), so there is no build.
          node-version: 24

      - name: Install Playwright (CDP client only)
        if: steps.gate.outputs.run == 'true'
        run: npm ci --prefix private/commute_traffic --no-audit --no-fund

      # Same encrypted profile and format as chrome-cdp-session.yaml, restored
      # as in tokopedia-search.yaml (before the VPN: faster).
      - name: Restore the Chrome profile
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$PROFILE_DIR"
          names="$(gh release view "$STATE_TAG" -R "$PRIVATE_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)"
          id="$(printf '%s\n' "$names" | sed -n 's/^state-\([0-9]*\)\.sha256$/\1/p' | sort -n | tail -1)"
          if [ -z "$id" ]; then
            echo "::warning::No saved Chrome profile; using a fresh one."
            exit 0
          fi
          mkdir -p /tmp/state
          cd /tmp/state
          gh release download "$STATE_TAG" -R "$PRIVATE_REPO" -p "state-${id}.*"
          sha256sum -c --quiet "state-${id}.sha256"
          cat state-"${id}".part-* \
            | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY \
            | tar -x --zstd -C "$PROFILE_DIR"
          rm -rf /tmp/state
          echo "Saved Chrome profile restored."

      # The same packages as chrome-cdp-session.yaml, so Google sees the
      # browser it saw before (real GL, audio device, desktop fonts).
      - name: Install Chrome and a virtual display
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get install -y -qq /tmp/chrome.deb xvfb openbox \
            libgl1-mesa-dri libegl1 libgles2 pulseaudio \
            fonts-noto-color-emoji fonts-noto-cjk fonts-liberation fonts-dejavu-core >/dev/null
          # The fonts package downloads from SourceForge and can hang; it is optional.
          sudo timeout 180 apt-get install -y -qq fonts-ubuntu ttf-mscorefonts-installer >/dev/null 2>&1 || echo "::warning::Microsoft core fonts not installed."
          fc-cache -f >/dev/null
          rm /tmp/chrome.deb
          google-chrome --version
          setsid nohup Xvfb :99 -screen 0 1920x1080x24 -dpi 96 +extension GLX +extension RANDR +render -nolisten tcp -noreset >/dev/null 2>&1 &
          sleep 2
          pulseaudio --start --exit-idle-time=-1 >/dev/null 2>&1 || true
          pactl load-module module-null-sink sink_name=speakers sink_properties=device.description=Speakers >/dev/null 2>&1 || true
          pactl set-default-sink speakers >/dev/null 2>&1 || true
          DISPLAY=:99 setsid nohup openbox >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install Tailscale
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi
          tailscale version

      # Same credential handling as typescript-worker-run.yaml: the OAuth
      # client secret is exchanged for a single-use, ephemeral, 10-minute auth
      # key; only HTTP statuses are ever printed.
      - name: Join the tailnet
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          args=(--accept-dns=false --hostname="github-actions-${GITHUB_RUN_ID}")

          if [ -n "${TAILSCALE_EXIT_NODE:-}" ]; then
            # The only place a secret reaches a command line: strict shape first.
            if [[ ! "$TAILSCALE_EXIT_NODE" =~ ^(tag:)?[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::TAILSCALE_EXIT_NODE must be 'tag:name', a MagicDNS name, or a Tailscale IPv4 address."
              exit 1
            fi
            args+=(--exit-node="$TAILSCALE_EXIT_NODE")
          fi

          if [ -n "${TAILSCALE_OAUTH_CLIENT_SECRET:-}" ]; then
            if [[ ! "$TAILSCALE_TAGS" =~ ^tag:[A-Za-z0-9][A-Za-z0-9_-]*(,tag:[A-Za-z0-9][A-Za-z0-9_-]*)*$ ]]; then
              echo "::error::TAILSCALE_TAGS must look like 'tag:ci' or 'tag:ci,tag:other'."
              exit 1
            fi
            umask 077
            secret="$(printf '%s' "$TAILSCALE_OAUTH_CLIENT_SECRET" | tr -d '[:space:]')"
            code="$(printf '%s' "$secret" | curl -sS --max-time 20 -o /tmp/ts-oauth.json -w '%{http_code}' \
              -d client_id=ignored --data-urlencode client_secret@- \
              https://api.tailscale.com/api/v2/oauth/token || true)"
            access_token="$(jq -r '.access_token // empty' /tmp/ts-oauth.json 2>/dev/null || true)"
            rm -f /tmp/ts-oauth.json
            if [ "$code" != "200" ] || [ -z "$access_token" ]; then
              echo "::error::Tailscale rejected the OAuth client secret (HTTP ${code:-none})."
              exit 1
            fi
            echo "::add-mask::${access_token}"
            printf 'Authorization: Bearer %s\n' "$access_token" > /tmp/ts-auth-header
            body="$(jq -cn --arg t "$TAILSCALE_TAGS" '{
              capabilities: {devices: {create: {
                reusable: false, ephemeral: true, preauthorized: true,
                tags: ($t | split(","))}}},
              expirySeconds: 600,
              description: "github-actions"}')"
            code="$(curl -sS --max-time 20 -o /tmp/ts-key.json -w '%{http_code}' \
              -H @/tmp/ts-auth-header -H 'Content-Type: application/json' -d "$body" \
              https://api.tailscale.com/api/v2/tailnet/-/keys || true)"
            rm -f /tmp/ts-auth-header
            authkey="$(jq -r '.key // empty' /tmp/ts-key.json 2>/dev/null || true)"
            rm -f /tmp/ts-key.json
            if [ "$code" != "200" ] || [ -z "$authkey" ]; then
              echo "::error::The OAuth client could not create an auth key (HTTP ${code:-none}). It needs the Auth Keys write scope and the tag(s) in TAILSCALE_TAGS."
              exit 1
            fi
            echo "::add-mask::${authkey}"
            args+=(--advertise-tags="$TAILSCALE_TAGS")
          else
            authkey="$TAILSCALE_AUTH_KEY"
          fi

          sudo tailscale up --authkey="$authkey" "${args[@]}"
          # Never print raw `tailscale status`: it lists every tailnet IP and host name.
          state="$(sudo tailscale status --json | jq -r '.BackendState // "unknown"')"
          if [ "$state" != "Running" ]; then
            echo "::error::Tailscale is not connected (BackendState=${state})."
            exit 1
          fi
          echo "Joined the tailnet$([ -n "${TAILSCALE_EXIT_NODE:-}" ] && echo ' through the exit node')."

      # After the tailnet, so Google sees the exit node's IP, never this
      # datacenter one. Flags as in tokopedia-search.yaml.
      - name: Start Chrome
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          export TZ="$COMMUTE_TZ" LANG=en_US.UTF-8 LANGUAGE=en_US
          rm -f "$PROFILE_DIR"/Singleton{Lock,Socket,Cookie}
          prefs="$PROFILE_DIR/Default/Preferences"
          mkdir -p "$PROFILE_DIR/Default"
          [ -s "$prefs" ] || echo '{}' > "$prefs"
          # Open a new tab, not the tabs the session left open.
          jq '.session.restore_on_startup = 5
              | .profile.exit_type = "Normal"
              | .profile.exited_cleanly = true' "$prefs" > "$prefs.tmp" && mv "$prefs.tmp" "$prefs"
          setsid nohup google-chrome \
            --user-data-dir="$PROFILE_DIR" \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --password-store=basic \
            --use-gl=angle \
            --use-angle=gl \
            --ignore-gpu-blocklist \
            --enable-gpu-rasterization \
            --lang=en-US \
            --accept-lang=en-US \
            --no-first-run \
            --no-default-browser-check \
            --disable-dev-shm-usage \
            --start-maximized \
            --window-position=0,0 \
            --window-size=1920,1080 \
            >/tmp/chrome.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:9222/json/version > /dev/null 2>&1; then
              echo "Chrome ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Chrome did not open CDP within 30s."
          exit 1

      - name: Read traffic
        if: steps.gate.outputs.run == 'true'
        env:
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          WORK_ADDRESS: ${{ secrets.WORK_ADDRESS }}
          PLATE_PARITY: ${{ secrets.PLATE_PARITY }}
          CHROME_CDP_URL: http://127.0.0.1:9222
        run: node private/commute_traffic/commute_traffic.ts

      - name: Stop Chrome, leave the tailnet
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          # Nothing to save (the profile is not uploaded); just stop it.
          pkill -f -- "--user-data-dir=$PROFILE_DIR" 2>/dev/null || true
          # A node left joined keeps an exit-node route and a tailnet slot.
          sudo tailscale logout 2>&1 | tail -3 || true

      - name: Send to Telegram
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node private/commute_traffic/commute_traffic.ts --send
