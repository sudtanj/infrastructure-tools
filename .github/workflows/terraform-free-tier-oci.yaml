name: "OCI Free Tier - Capacity Grab"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (best-effort)

permissions:
  contents: read

concurrency:
  group: oci-free-tier-grab
  cancel-in-progress: false

jobs:
  grab:
    name: "Single Terraform apply"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TF_DIR: "terraform_free_tier_oci"
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-terraform_free_tier_oci"
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-providers-

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false

      # ---------------------------------------------------------------
      # Guard: if the instance is already in remote state, stop.
      # Once you win, every future scheduled run exits here in seconds.
      # ---------------------------------------------------------------
      - name: Check remote state
        id: guard
        working-directory: ${{ env.TF_DIR }}
        run: |
          INSTANCE_ADDR="oci_core_instance.free_tier_instance"
          if terraform state list 2>/dev/null | grep -qx "$INSTANCE_ADDR"; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Instance already in state. Nothing to do."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "No instance in state. Proceeding with single apply attempt."
          fi

      # ---------------------------------------------------------------
      # Single apply attempt. AD rotates across scheduled runs so
      # consecutive runs target different availability domains.
      # ---------------------------------------------------------------
      - name: Terraform Apply (single attempt)
        id: apply
        if: ${{ steps.guard.outputs.already_exists == 'false' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -uo pipefail

          RUN_NUM=${{ github.run_number }}
          case $((RUN_NUM % 3)) in
            0) AD_INDEX=0 ;;
            1) AD_INDEX=1 ;;
            2) AD_INDEX=2 ;;
          esac
          echo "Run #$RUN_NUM → availability_domain_index=$AD_INDEX"

          set +e
          terraform apply \
            -auto-approve \
            -input=false \
            -no-color \
            -compact-warnings \
            -var="availability_domain_index=$AD_INDEX" \
            > /tmp/apply.log 2>&1
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "✅ Apply complete."
            grep -E 'Apply complete!|Resources: [0-9]+ added' /tmp/apply.log || true
            exit 0
          fi

          # prevent_destroy fired → hard fail, never retry
          if grep -qi "prevent_destroy\|cannot be destroyed" /tmp/apply.log; then
            echo "🛑 prevent_destroy blocked a destroy."
            grep -A 20 'Error:' /tmp/apply.log || tail -30 /tmp/apply.log
            exit 1
          fi

          # capacity error → soft exit, next scheduled run tries again
          if grep -qiE "out of (host )?capacity|500-InternalError|LimitExceeded|TooManyRequests" /tmp/apply.log; then
            echo "⚠️  No capacity in AD index $AD_INDEX this run. Next attempt at next schedule."
            grep -A 3 'Error:' /tmp/apply.log | head -10 || true
            exit 0
          fi

          # anything else → real failure, surface it
          echo "❌ Non-retryable error:"
          grep -A 20 'Error:' /tmp/apply.log || tail -40 /tmp/apply.log
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            echo "### ✅ VM acquired" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check outputs locally:" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "cd terraform_free_tier_oci" >> "$GITHUB_STEP_SUMMARY"
            echo "terraform output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🕐 Missed this window" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No capacity in the targeted AD. Next attempt runs automatically at the next 15-minute tick." >> "$GITHUB_STEP_SUMMARY"
          fi