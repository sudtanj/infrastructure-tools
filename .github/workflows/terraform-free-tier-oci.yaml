name: "OCI Free Tier - Capacity Grab"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (best-effort)

permissions:
  contents: read

# Prevents overlap between a slow run and the next scheduled one.
concurrency:
  group: oci-free-tier-grab
  cancel-in-progress: false

jobs:
  grab:
    name: "Single attempt"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      # OCI CLI reads these automatically — no ~/.oci/config file needed.
      OCI_CLI_USER:        ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION:      ${{ secrets.OCI_REGION }}

      COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      SUBNET_ID:      ${{ secrets.OCI_SUBNET_OCID }}
      IMAGE_ID:       ${{ secrets.OCI_IMAGE_OCID }}
      SSH_KEY:        ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      INSTANCE_NAME:  "oci-free-tier-vm"

    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      # ---------------------------------------------------------------
      # Guard: if a VM with this display name is already RUNNING, stop.
      # ---------------------------------------------------------------
      - name: Check if instance already exists
        id: guard
        run: |
          EXISTING=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "$INSTANCE_NAME" \
            --lifecycle-state RUNNING \
            --query 'data[0].id' --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "✅ Instance already running: $EXISTING"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "No instance found. Proceeding with single launch attempt."
          fi

      # ---------------------------------------------------------------
      # Single launch attempt. Rotates AD across scheduled runs so
      # consecutive runs target different availability domains.
      # ---------------------------------------------------------------
      - name: Single launch attempt
        id: launch
        if: ${{ steps.guard.outputs.already_exists == 'false' }}
        run: |
          set -uo pipefail

          # AD rotation: run_number % 3 -> AD-1 / AD-2 / AD-3
          RUN_NUM=${{ github.run_number }}
          case $((RUN_NUM % 3)) in
            0) AD="AD-1" ;;
            1) AD="AD-2" ;;
            2) AD="AD-3" ;;
          esac
          echo "Run #$RUN_NUM → AD: $AD"

          set +e
          OUTPUT=$(oci compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$COMPARTMENT_ID" \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --source-details "{\"sourceType\":\"image\",\"imageId\":\"$IMAGE_ID\",\"bootVolumeSizeInGBs\":50}" \
            --subnet-id "$SUBNET_ID" \
            --assign-public-ip true \
            --display-name "$INSTANCE_NAME" \
            --metadata "{\"ssh_authorized_keys\":\"$SSH_KEY\"}" \
            --output json 2>&1)
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            INSTANCE_ID=$(echo "$OUTPUT" | jq -r '.data.id')
            echo "✅ Instance created: $INSTANCE_ID"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$OUTPUT" | grep -qiE "out of (host )?capacity|InternalError|LimitExceeded|TooManyRequests"; then
            echo "⚠️  No capacity in $AD this run. Next attempt at next schedule."
            exit 0   # soft exit — not a workflow failure
          fi

          echo "❌ Non-retryable error:"
          echo "$OUTPUT" | tail -30
          exit 1

      # ---------------------------------------------------------------
      # Job summary: shows next steps if the VM was just acquired.
      # ---------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.launch.outputs.instance_id }}" != "" ]; then
            {
              echo "### ✅ VM acquired"
              echo ""
              echo "Instance OCID: \`${{ steps.launch.outputs.instance_id }}\`"
              echo ""
              echo "Import to Terraform state locally:"
              echo ""
              echo '```bash'
              echo "cd terraform_free_tier_oci"
              echo "terraform login"
              echo "terraform init"
              echo "terraform import oci_core_instance.free_tier_instance ${{ steps.launch.outputs.instance_id }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 🕐 Missed this window"
              echo ""
              echo "No capacity in the targeted AD. Next attempt runs automatically at the next 15-minute tick."
            } >> "$GITHUB_STEP_SUMMARY"
          fi