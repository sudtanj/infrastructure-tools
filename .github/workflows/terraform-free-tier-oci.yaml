name: "OCI Free Tier - Capacity Grab"

on:
  workflow_dispatch:
  # Dispatched by workflow-cron on the GCP VM or Orange Pi (builder-tools/workflow-cron,
  # bash-scripts/init-workflow-cron.sh): GitHub's own `schedule:` starts late or skips runs.
  # Without that device, put this back:
  # schedule:
  #   - cron: "*/15 * * * *"   # every 15 minutes (best-effort)

permissions:
  contents: read

concurrency:
  group: oci-free-tier-grab
  cancel-in-progress: false

jobs:
  grab:
    name: "Single Terraform apply"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TF_DIR: "terraform_free_tier_oci"
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: "${{ secrets.TF_WORKSPACE_PREFIX || 'tf' }}-terraform_free_tier_oci"
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-providers-

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          out=$(mktemp)
          if ! terraform init -input=false -no-color >"$out" 2>&1; then
            echo "::error::terraform init failed"
            tail -n 20 "$out"
            exit 1
          fi

      - name: Check remote state
        id: guard
        working-directory: ${{ env.TF_DIR }}
        run: |
          INSTANCE_ADDR="oci_core_instance.free_tier_instance"
          if terraform state list 2>/dev/null | grep -qx "$INSTANCE_ADDR"; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "Instance already exists."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply (single attempt)
        id: apply
        if: ${{ steps.guard.outputs.already_exists == 'false' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -uo pipefail

          # ap-singapore-1 has a single availability domain → always index 0

          set +e
          terraform apply \
            -auto-approve \
            -input=false \
            -no-color \
            -compact-warnings \
            -var="availability_domain_index=0" \
            > /tmp/apply.log 2>&1
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "Apply complete."
            exit 0
          fi

          if grep -qi "prevent_destroy\|cannot be destroyed" /tmp/apply.log; then
            echo "::error::prevent_destroy blocked a destroy"
            { grep -A 20 'Error:' /tmp/apply.log || tail -20 /tmp/apply.log; } | head -20
            exit 1
          fi

          if grep -qiE "out of (host )?capacity|500-InternalError|LimitExceeded|TooManyRequests" /tmp/apply.log; then
            echo "No capacity this run."
            exit 0
          fi

          echo "::error::terraform apply failed (non-retryable)"
          { grep -A 20 'Error:' /tmp/apply.log || tail -20 /tmp/apply.log; } | head -20
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            echo "### ✅ VM acquired" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check outputs locally:" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "cd terraform_free_tier_oci" >> "$GITHUB_STEP_SUMMARY"
            echo "terraform output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🕐 Missed this window" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No capacity. Next attempt runs automatically at the next 15-minute tick." >> "$GITHUB_STEP_SUMMARY"
          fi
