name: "Run a local LLM"

# ---------------------------------------------------------------------------
# Runs a small open-weights model with Ollama on the free GitHub-hosted runner
# (CPU only: 4 vCPU, 16 GB RAM) and answers one prompt. No API keys, no
# secrets, nothing leaves the runner.
#
# Default is Qwen3 4B (Q4, ~2.5 GB) with thinking off: the best quality for
# its size that still runs at a usable speed on 4 CPU cores (roughly 8-12
# tokens/s). The smaller choices are faster, the larger ones slower.
#
# Model weights are kept in the Actions cache per model, so only the first
# run of a model downloads it. `ollama pull` still runs every time, but only
# fetches layers that changed upstream.
#
# THIS REPO IS PUBLIC: the prompt and the answer show up in the run's
# summary (the log stays quiet), which anyone can read. Don't put anything
# private in the prompt.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt (visible to anyone: this repo is public)'
        type: string
        required: true
      model:
        description: 'Ollama model'
        type: choice
        default: qwen3:4b
        options:
          - qwen3:4b
          - qwen3:1.7b
          - gemma3:4b
          - llama3.2:3b
          - phi4-mini
          - qwen3:8b
      system:
        description: 'Optional system prompt'
        type: string
        default: ''
      max_tokens:
        description: 'Maximum tokens to generate'
        type: number
        default: 1024

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL: ${{ inputs.model }}
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - name: Install Ollama
        run: |
          set -euo pipefail
          out=$(mktemp)
          if ! { curl -fsSL https://ollama.com/install.sh | sh; } >"$out" 2>&1; then
            echo "::error::Ollama install failed"; tail -n 20 "$out"; exit 1
          fi
          # The installer starts a systemd service that keeps models under the
          # `ollama` user's home. Run our own server as the runner user instead,
          # so the models land in ~/.ollama/models, which this job can cache.
          sudo systemctl disable --now ollama >/dev/null 2>&1 || true
          ollama --version >/dev/null 2>&1

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          # Default model directory for an `ollama serve` run as this user.
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ inputs.model }}

      - name: Start Ollama and pull the model
        run: |
          set -euo pipefail
          setsid nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "http://${OLLAMA_HOST}/api/version" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://${OLLAMA_HOST}/api/version" >/dev/null || { echo "::error::ollama serve did not start"; tail -n 20 /tmp/ollama.log; exit 1; }
          out=$(mktemp)
          if ! ollama pull "$MODEL" >"$out" 2>&1; then
            echo "::error::ollama pull failed"; tail -n 20 "$out"; exit 1
          fi

      - name: Generate
        env:
          PROMPT: ${{ inputs.prompt }}
          SYSTEM: ${{ inputs.system }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
        run: |
          set -euo pipefail
          if ! [[ "$MAX_TOKENS" =~ ^[0-9]+$ ]] || [ "$MAX_TOKENS" -lt 1 ]; then
            echo "::error title=Bad input::max_tokens must be a positive integer"
            exit 1
          fi

          # Qwen3 is a hybrid thinking model; thinking off keeps CPU time on
          # the answer. Other models reject the field, so it's Qwen3 only.
          jq -n \
            --arg model "$MODEL" \
            --arg prompt "$PROMPT" \
            --arg system "$SYSTEM" \
            --argjson max "$MAX_TOKENS" \
            '{model: $model, prompt: $prompt, stream: false,
              options: {num_predict: $max, num_ctx: 8192}}
             + (if $system != "" then {system: $system} else {} end)
             + (if ($model | startswith("qwen3")) then {think: false} else {} end)' \
            > /tmp/request.json

          if ! curl -fsS --max-time 2400 "http://${OLLAMA_HOST}/api/generate" \
                 -H 'Content-Type: application/json' -d @/tmp/request.json > /tmp/response.json; then
            echo "::error::generate request failed"
            tail -n 20 /tmp/ollama.log
            exit 1
          fi

          answer="$(jq -r '.response' /tmp/response.json)"
          stats="$(jq -r '"\(.eval_count) tokens in \(.eval_duration / 1e9 | floor)s (\(.eval_count / (.eval_duration / 1e9) * 10 | floor / 10) tokens/s), prompt \(.prompt_eval_count // 0) tokens"' /tmp/response.json)"

          {
            echo "### ${MODEL}"
            echo
            echo "**Prompt**"
            echo
            printf '%s\n' "$PROMPT" | sed 's/^/> /'
            echo
            echo "**Answer**"
            echo
            printf '%s\n' "$answer"
            echo
            echo "_${stats}_"
          } >> "$GITHUB_STEP_SUMMARY"
