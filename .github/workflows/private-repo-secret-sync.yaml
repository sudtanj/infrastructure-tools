name: "Copy Tailscale secrets to the private repo"

# Copies this repo's Tailscale exit-node secrets into the private repo's own
# Actions secrets, so the private repo's own workflows can join the tailnet
# through the same exit node as typescript-worker-run.yaml. Secrets cannot be read across repos, so this runs
# here, on a GitHub-hosted runner. Re-run it after rotating any of them.
#
# This repo is public: values go to GitHub on stdin through `gh secret set`,
# which encrypts them; they are never printed. The log shows failures only.
#
# SECRETS
#   PRIVATE_MIRROR_REPO (optional)     a second repo (OWNER/REPO or its link) to copy into too
#   PRIVATE_REPO, PRIVATE_REPO_TOKEN   the private repo, and a token that also has
#                                      Secrets: Read and write on the target repo
#   TAILSCALE_OAUTH_CLIENT_SECRET, TAILSCALE_TAGS, TAILSCALE_AUTH_KEY,
#   TAILSCALE_EXIT_NODE, TAILSCALE_ACCEPT_DNS   each copied when set here
#   PROXYRACK_UUID, PROXYRACK_API_KEY, INSTABOX_API_KEY   the same, PRIVATE_REPO only
#                                      (its ProxyRack job on the Instabox runner)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    # Only from the default branch: a workflow edited on another branch cannot reach the secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_MIRROR_REPO: ${{ secrets.PRIVATE_MIRROR_REPO }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
          TAILSCALE_ACCEPT_DNS: ${{ secrets.TAILSCALE_ACCEPT_DNS }}
          PROXYRACK_UUID: ${{ secrets.PROXYRACK_UUID }}
          PROXYRACK_API_KEY: ${{ secrets.PROXYRACK_API_KEY }}
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ] || [ -z "$PRIVATE_REPO$PRIVATE_MIRROR_REPO" ]; then
            echo "::error::PRIVATE_REPO (or PRIVATE_MIRROR_REPO) and PRIVATE_REPO_TOKEN must be set."; exit 1
          fi
          for label in PRIVATE_REPO PRIVATE_MIRROR_REPO; do
            repo="${!label}"
            [ -n "$repo" ] || continue
            echo "::add-mask::$repo"
            # The secret may hold the repo's link; gh wants OWNER/REPO.
            repo="${repo//[[:space:]]/}"; repo="${repo#https://github.com/}"; repo="${repo%/}"; repo="${repo%.git}"
            echo "::add-mask::$repo"
            names="TAILSCALE_OAUTH_CLIENT_SECRET TAILSCALE_TAGS TAILSCALE_AUTH_KEY TAILSCALE_EXIT_NODE TAILSCALE_ACCEPT_DNS"
            [ "$label" != PRIVATE_REPO ] || names="$names PROXYRACK_UUID PROXYRACK_API_KEY INSTABOX_API_KEY"
            for name in $names; do
              [ -n "${!name}" ] || continue
              # gh's own error text names the repo, so it is dropped.
              if ! printf '%s' "${!name}" | gh secret set "$name" --repo "$repo" >/dev/null 2>&1; then
                echo "::error::$label: $name copy failed. PRIVATE_REPO_TOKEN needs Secrets: Read and write on it."
                exit 1
              fi
            done
          done
