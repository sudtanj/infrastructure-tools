name: Deploy n8n to Botkeep

# Botkeep runs on Pterodactyl, so we use the community upload action:
# https://github.com/rexlManu/pterodactyl-upload-action
# Needs the secret PTERODACTYL_API_KEY (a Pterodactyl *client* API key, ptlc_...).

on:
  push:
    branches: [main]
    paths:
      - "botkeep-*/**"
  workflow_dispatch:

env:
  APP_DIR: botkeep-n8n-infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.APP_DIR }}

      - name: Package only the app folder
        run: |
          cd "$APP_DIR"
          zip -qr "$GITHUB_WORKSPACE/app.zip" . -x 'node_modules/*' '.env' '.n8n/*' '.git/*'

      - name: Upload, extract and restart
        uses: rexlmanu/pterodactyl-upload-action@v2.1
        with:
          panel-host: ${{ vars.PTERO_PANEL_HOST || 'https://panel.botkeep.cloud' }}
          api-key: ${{ secrets.PTERODACTYL_API_KEY }}
          server-id: ${{ vars.PTERO_SERVER_ID || 'dc848c77' }}
          source: app.zip
          target: ./
          decompress-target: true
          restart: true
