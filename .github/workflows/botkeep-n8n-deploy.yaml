name: Deploy n8n to Botkeep

on:
  push:
    branches: [main]
    paths:
      - "botkeep-*/**"
  workflow_dispatch:

jobs:
  deploy:
    # Workload name = folder name (botkeep-n8n-infra); created on first run if missing.
    uses: ./.github/workflows/botkeep-deploy.yml
    with:
      directory: botkeep-n8n-infra
      mode: folder
      runtime: node
      runtime_version: "22"
      start_command: npm install --no-audit --no-fund && npm start
      memory_mb: 1024
      cpu_percent: 50
      storage_mb: 1024
    secrets:
      BOTKEEP_API_KEY: ${{ secrets.BOTKEEP_API_KEY }}
