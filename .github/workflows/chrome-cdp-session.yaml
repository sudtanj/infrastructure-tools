name: "Chrome CDP session over Tailscale"

# ---------------------------------------------------------------------------
# Starts the latest stable Google Chrome on demand and keeps it reachable on
# the tailnet as `chrome-cdp`, so a person and an agent or script can share
# the same logged-in browser:
#   CDP      <tailnet IP>:9222   (Playwright connectOverCDP, Puppeteer,
#                                 chrome-devtools-mcp, browser-use, ...)
#   VNC      chrome-cdp:5900     (watch or click the browser window)
#
# Use the 100.x IP for CDP, not the MagicDNS name: Chrome's DevTools HTTP
# endpoint rejects requests whose Host header is not an IP or `localhost`.
# CDP has no authentication of its own; anyone who can reach port 9222 on the
# tailnet controls the browser, so restrict TAILSCALE_TAGS with ACLs.
#
# The Chrome profile (cookies, logins, local storage, open tabs) is encrypted
# and stored as release assets on the PRIVATE repo, under the release tag
# `chrome-cdp-state`, and restored on the next run. Nothing is kept in this
# public repo's cache or artifacts.
#
# The Tailscale node identity (`tailscaled.state.enc`, same release) is kept
# too, so every run is the same non-ephemeral machine with the same 100.x IP
# and MagicDNS name. Deleting the machine in the Tailscale admin console makes
# the next run join as a new machine with a new IP.
#
# LOOKING LIKE A PERSON, NOT A BOT
#   This is a real, headful Google Chrome (not Chromium, not headless) with a
#   persistent profile, so it already avoids most tells. On top of that:
#   - No `--enable-automation` is passed, so navigator.webdriver stays false
#     and there is no "controlled by automated software" bar. Do not add
#     `--disable-blink-features=AutomationControlled`: it is unnecessary here
#     and makes Chrome show an "unsupported command-line flag" warning bar.
#   - Exit node: the runner's IP is a well-known Azure datacenter range, the
#     biggest giveaway. With the TAILSCALE_EXIT_NODE secret set (the same one
#     typescript-worker-run uses: `tag:name`, a MagicDNS name or a 100.x IP)
#     and `use_exit_node` on, the browser's web traffic leaves from that
#     residential IP; the run stops if the public IP did not actually change.
#     Saving the profile still goes out directly.
#   - `timezone` defaults to `auto`: the zone of the IP the browser is seen
#     from, so the clock never disagrees with the IP. `locale` should match it
#     too.
#   - WebGL draws with Mesa (llvmpipe) through a GLX-enabled display instead of
#     Chrome's SwiftShader fallback, whose renderer string is the classic
#     headless/bot fingerprint.
#   - A PulseAudio null sink gives the page a working audio output device, and
#     the common Windows/Linux web fonts are installed, so the audio, media
#     device and font fingerprints look like an ordinary Linux desktop.
#   Left to the client: Playwright and Puppeteer send `Runtime.enable`, which
#   some anti-bot scripts detect. Use patchright, rebrowser-patches or
#   nodriver/zendriver against this endpoint to avoid it, and log in by hand
#   over VNC rather than scripting the login form.
#
# HOW LONG IT RUNS
#   Until the browser is closed (its last window over VNC, or Browser.close
#   over CDP), or until nothing has been connected to VNC or CDP for
#   `idle_minutes` (default 30, counted from start too). An open VNC viewer or
#   CDP connection keeps it alive. Only a crash restarts Chrome.
#   One GitHub job can run at most 360 minutes, so at 320 minutes the run
#   saves and, if anything was connected in the last `idle_minutes`, starts a
#   new run that restores the same profile at the same tailnet IP (a few
#   minutes' gap while it boots).
#   Also: `about:blank#stop-session` in any tab, or Cancel (once). Every way
#   out saves the profile, except cancelling twice.
#
# SECRETS
#   PRIVATE_REPO                   owner/name of the private repo
#   PRIVATE_REPO_TOKEN             needs Contents: read AND write on it
#                                  (releases), not just read
#   TAILSCALE_OAUTH_CLIENT_SECRET  OAuth client (tskey-client-...)
#   TAILSCALE_TAGS                 e.g. "tag:ci"
#   STATE_KEY                      passphrase that encrypts the saved profile
#   VNC_PASSWORD                   VNC password (only the first 8 chars count)
#   TAILSCALE_EXIT_NODE            optional; exit node for browser traffic (see above)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: 'Stop and save after this many minutes with no VNC or CDP connection'
        type: number
        default: 30
      fresh:
        description: 'Ignore the saved profile; the next save replaces it'
        type: boolean
        default: false
      use_exit_node:
        description: 'Send browser traffic through the TAILSCALE_EXIT_NODE secret'
        type: boolean
        default: true
      timezone:
        description: 'IANA time zone the browser reports (e.g. Asia/Jakarta); auto = from the egress IP'
        type: string
        default: 'auto'
      locale:
        description: 'Browser language (e.g. en-US, id-ID)'
        type: string
        default: 'en-US'

permissions:
  contents: read
  # Only to dispatch the follow-up run when one run's time is up.
  actions: write

# One browser at a time: two runs would race to save over each other's state.
concurrency:
  group: chrome-cdp-session
  cancel-in-progress: false

env:
  STATE_TAG: chrome-cdp-state
  PROFILE_DIR: /home/runner/chrome-profile

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      STATE_KEY: ${{ secrets.STATE_KEY }}

    steps:
      - name: Check secrets
        env:
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in PRIVATE_REPO GH_TOKEN TAILSCALE_OAUTH_CLIENT_SECRET TAILSCALE_TAGS STATE_KEY VNC_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing secrets::Not set: ${missing[*]}"
            exit 1
          fi
          # gh error text can include the repo path; keep it out of the public log.
          echo "::add-mask::${PRIVATE_REPO}"

      - name: Prepare state release
        run: |
          set -euo pipefail
          if ! gh release view "$STATE_TAG" -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release create "$STATE_TAG" -R "$PRIVATE_REPO" --title "Chrome CDP state" \
              --notes "Encrypted Chrome profile saved by infrastructure-tools chrome-cdp-session." >/dev/null
          fi
          # Not `|| true`: a failed listing must stop the run, or a clean
          # profile (or a new Tailscale node) would later be saved over the
          # good state.
          gh release view "$STATE_TAG" -R "$PRIVATE_REPO" --json assets -q '.assets[].name' > /tmp/state-assets.txt

      # A set is `state-<run_id>.part-NNN` plus `state-<run_id>.sha256`. The
      # manifest is uploaded last, so only sets with one are complete.
      - name: Restore saved profile
        id: restore
        if: ${{ !inputs.fresh }}
        run: |
          set -euo pipefail
          names="$(cat /tmp/state-assets.txt)"
          id="$(printf '%s\n' "$names" | sed -n 's/^state-\([0-9]*\)\.sha256$/\1/p' | sort -n | tail -1)"
          if [ -z "$id" ]; then
            echo "No saved profile; starting clean."
            exit 0
          fi
          mkdir -p /tmp/state "$PROFILE_DIR"
          cd /tmp/state
          gh release download "$STATE_TAG" -R "$PRIVATE_REPO" -p "state-${id}.*"
          sha256sum -c --quiet "state-${id}.sha256"
          cat state-"${id}".part-* \
            | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY \
            | tar -x --zstd -C "$PROFILE_DIR"
          rm -rf /tmp/state
          echo "Saved profile restored."

      - name: Install latest Chrome, virtual display and VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          # The runner image ships a Chrome that can be weeks old; take today's stable.
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          # Mesa for a real GL renderer, PulseAudio for an audio device, and the
          # fonts an ordinary desktop has (a bare runner has very few).
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get install -y -qq /tmp/chrome.deb xvfb x11vnc openbox \
            libgl1-mesa-dri libegl1 libgles2 pulseaudio \
            fonts-noto-color-emoji fonts-noto-cjk fonts-liberation fonts-dejavu-core >/dev/null
          # The Microsoft core fonts download from SourceForge; nice to have, not worth failing over.
          # The fonts package downloads from SourceForge and can hang; it is optional.
          sudo timeout 180 apt-get install -y -qq fonts-ubuntu ttf-mscorefonts-installer >/dev/null 2>&1 || echo "::warning::Microsoft core fonts not installed."
          fc-cache -f >/dev/null
          rm /tmp/chrome.deb
          google-chrome --version
          # GLX on the display lets Chrome use Mesa instead of SwiftShader.
          setsid nohup Xvfb :99 -screen 0 1920x1080x24 -dpi 96 +extension GLX +extension RANDR +render -nolisten tcp -noreset >/dev/null 2>&1 &
          sleep 2
          # A null sink: pages see a normal speaker output and AudioContext works.
          pulseaudio --start --exit-idle-time=-1 >/dev/null 2>&1 || true
          pactl load-module module-null-sink sink_name=speakers sink_properties=device.description=Speakers >/dev/null 2>&1 || true
          pactl set-default-sink speakers >/dev/null 2>&1 || true
          # A window manager so dialogs, popups and maximise behave over VNC.
          DISPLAY=:99 setsid nohup openbox >/dev/null 2>&1 &
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$VNC_PASSWORD" ~/.vnc/passwd >/dev/null
          # localhost only; Tailscale serve is the sole way in.
          x11vnc -display :99 -localhost -rfbauth ~/.vnc/passwd -forever -shared -bg -quiet -o /tmp/x11vnc.log
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Join the tailnet
        timeout-minutes: 8
        env:
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAGS: ${{ secrets.TAILSCALE_TAGS }}
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null

          # Same machine identity as last run means the same tailnet IP.
          if grep -qx 'tailscaled.state.enc' /tmp/state-assets.txt; then
            gh release download "$STATE_TAG" -R "$PRIVATE_REPO" -p tailscaled.state.enc -D /tmp
            sudo systemctl stop tailscaled
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in /tmp/tailscaled.state.enc \
              | sudo tee /var/lib/tailscale/tailscaled.state >/dev/null
            sudo chmod 600 /var/lib/tailscale/tailscaled.state
            sudo systemctl start tailscaled
            rm /tmp/tailscaled.state.enc
            echo "Tailscale identity restored."
          else
            echo "No saved Tailscale identity; joining as a new machine."
          fi

          # The auth key is only used when the restored identity is missing or
          # was deleted. Not ephemeral, so the machine and its IP outlive the run.
          # --accept-routes: devices behind a subnet router (the Orange Pi running kongming)
          # reach CDP from their LAN address, and the replies have to go back through that router.
          secret="$(printf '%s' "$TAILSCALE_OAUTH_CLIENT_SECRET" | tr -d '[:space:]')"
          # `tailscale up` can wait forever for Running after the login went
          # through; bound each try and retry.
          for attempt in 1 2 3; do
            if sudo tailscale up --authkey="${secret}?ephemeral=false&preauthorized=true" \
              --advertise-tags="$TAILSCALE_TAGS" --hostname=chrome-cdp --accept-routes --timeout=90s; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Tailscale did not reach Running after 3 tries."
              exit 1
            fi
            echo "::warning::tailscale up did not finish (try ${attempt}); retrying."
            sleep 5
          done

          # Saved straight away, so a cancelled run still keeps the identity.
          sudo cat /var/lib/tailscale/tailscaled.state \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -out /tmp/tailscaled.state.enc
          gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" /tmp/tailscaled.state.enc --clobber
          rm /tmp/tailscaled.state.enc
          # Tailnet only: neither port is published on the runner's public interface.
          sudo tailscale serve --bg --tcp 9222 tcp://localhost:9222 >/dev/null
          sudo tailscale serve --bg --tcp 5900 tcp://localhost:5900 >/dev/null
          echo "Joined the tailnet as chrome-cdp."

      - name: Run Chrome until stopped
        id: chrome
        env:
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
          USE_EXIT_NODE: ${{ inputs.use_exit_node }}
          EXIT_NODE: ${{ secrets.TAILSCALE_EXIT_NODE }}
          TZ: ${{ inputs.timezone }}
          LOCALE: ${{ inputs.locale }}
        run: |
          set -uo pipefail
          idle_min="${IDLE_MINUTES%%.*}"
          [[ "$idle_min" =~ ^[0-9]+$ ]] && [ "$idle_min" -gt 0 ] || idle_min=30
          # Leaves room under the 360 minute job limit to pack and upload the profile.
          cap_min=320
          mkdir -p "$PROFILE_DIR"
          export LANG="${LOCALE//-/_}.UTF-8" LANGUAGE="${LOCALE//-/_}"

          if [ "$USE_EXIT_NODE" = true ]; then
            if [ -z "$EXIT_NODE" ]; then
              echo "::error title=Exit node::use_exit_node is on but the TAILSCALE_EXIT_NODE secret is not set."
              exit 1
            fi
            echo "::add-mask::${EXIT_NODE}"
            if [[ ! "$EXIT_NODE" =~ ^(tag:[A-Za-z0-9][A-Za-z0-9_-]*|[A-Za-z0-9][A-Za-z0-9._-]*)$ ]]; then
              echo "::error title=Exit node::TAILSCALE_EXIT_NODE must be tag:name, a MagicDNS name or a Tailscale IPv4 address."
              exit 1
            fi
            # Masked: a real public address in a public log.
            before="$(curl -fsS --max-time 15 https://api.ipify.org || true)"
            [ -n "$before" ] && echo "::add-mask::${before}"
            # LAN access keeps the runner's own localhost/VNC/CDP plumbing working.
            if ! sudo tailscale set --exit-node="$EXIT_NODE" --exit-node-allow-lan-access; then
              echo "::error title=Exit node::Could not use the exit node; does it advertise 0.0.0.0/0 and do the ACLs allow it?"
              exit 1
            fi
            sleep 3
            # Refuse to browse from the datacenter IP when a home IP was asked for.
            after="$(curl -fsS --max-time 15 https://api.ipify.org || true)"
            if [ -z "$after" ]; then
              echo "::error title=Exit node::No internet through the exit node."
              exit 1
            fi
            echo "::add-mask::${after}"
            if [ "$after" = "$before" ]; then
              echo "::error title=Exit node::Public IP did not change; traffic is not going through the exit node."
              exit 1
            fi
            echo "Browser traffic goes through the exit node."
          fi

          # Match the clock to wherever the browser appears to be. Not printed:
          # it narrows down where the exit node is.
          if [ "$TZ" = auto ]; then
            TZ="$(curl -fsS --max-time 15 https://ipinfo.io/timezone || true)"
            if [[ ! "$TZ" =~ ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$ ]] || [ ! -e "/usr/share/zoneinfo/$TZ" ]; then
              echo "::warning::Could not detect the time zone; using UTC."
              TZ=UTC
            fi
          fi
          export TZ

          start_chrome() {
            # A profile copied from another machine still holds its lock.
            rm -f "$PROFILE_DIR"/Singleton{Lock,Socket,Cookie}
            # "Continue where you left off": without it Chrome deletes session
            # cookies on exit, and many sites keep the login in
            # one. A clean exit flag also avoids the "Restore pages?" bubble.
            prefs="$PROFILE_DIR/Default/Preferences"
            mkdir -p "$PROFILE_DIR/Default"
            [ -s "$prefs" ] || echo '{}' > "$prefs"
            jq '.session.restore_on_startup = 1
                | .profile.exit_type = "Normal"
                | .profile.exited_cleanly = true' "$prefs" > "$prefs.tmp" && mv "$prefs.tmp" "$prefs"
            # --password-store=basic: no keyring on the runner, and cookies
            # must decrypt the same way on the next runner.
            # CDP listens on localhost; Tailscale serve forwards it.
            setsid nohup google-chrome \
              --user-data-dir="$PROFILE_DIR" \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9222 \
              --remote-allow-origins='*' \
              --password-store=basic \
              --use-gl=angle \
              --use-angle=gl \
              --ignore-gpu-blocklist \
              --enable-gpu-rasterization \
              --lang="$LOCALE" \
              --accept-lang="$LOCALE" \
              --restore-last-session \
              --no-first-run \
              --no-default-browser-check \
              --disable-dev-shm-usage \
              --start-maximized \
              --window-position=0,0 \
              --window-size=1920,1080 \
              >/tmp/chrome.log 2>&1 &
            chrome_pid=$!
            echo "$chrome_pid" > /tmp/chrome.pid
            for _ in $(seq 1 30); do
              curl -fs http://127.0.0.1:9222/json/version >/dev/null && return 0
              sleep 1
            done
            echo "::warning::Chrome did not open CDP within 30s."
          }

          start_chrome
          curl -fs http://127.0.0.1:9222/json/version | jq -r '.Browser'
          echo "Chrome ready. Runs until the browser is closed, or nothing is connected for ${idle_min} minutes."
          # A stop tab from the last session can come back with the restored tabs
          # (closing it right before exit does not always reach the saved session).
          sleep 5
          curl -fs http://127.0.0.1:9222/json/list | jq -r '.[] | select(.url | endswith("#stop-session")) | .id' \
            | while read -r tid; do curl -fs "http://127.0.0.1:9222/json/close/${tid}" >/dev/null || true; done

          # Active = any open connection to VNC (5900) or CDP (9222). Both
          # arrive through Tailscale serve, so they show up as established
          # connections to localhost. Our own curl polls have closed by now.
          active() {
            [ "$(ss -Htn state established '( sport = :5900 or sport = :9222 )' | wc -l)" -gt 0 ]
          }

          last_active=$SECONDS
          was_active=false
          while :; do
            if curl -fs http://127.0.0.1:9222/json/list 2>/dev/null | jq -e 'any(.[]; .url | endswith("#stop-session"))' >/dev/null; then
              echo "Stop tab found."
              # Close it so the restored session does not stop the next run.
              curl -fs http://127.0.0.1:9222/json/list | jq -r '.[] | select(.url | endswith("#stop-session")) | .id' \
                | while read -r tid; do curl -fs "http://127.0.0.1:9222/json/close/${tid}" >/dev/null || true; done
              sleep 2
              break
            fi

            # Closing the browser (last window over VNC, or Browser.close over
            # CDP) ends the session. Chrome marks the profile "Crashed" while it
            # runs and "Normal" on a clean exit, so only a crash is restarted.
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              exit_type="$(jq -r '.profile.exit_type // ""' "$PROFILE_DIR/Default/Preferences" 2>/dev/null || true)"
              if [ "$exit_type" = Crashed ]; then
                echo "Chrome crashed; restarting."
                start_chrome
              else
                echo "Browser closed."
                break
              fi
            fi

            if active; then
              [ "$was_active" = true ] || echo "Client connected."
              was_active=true
              last_active=$SECONDS
            else
              [ "$was_active" = false ] || echo "No clients connected; stopping after ${idle_min} idle minutes."
              was_active=false
              if [ $((SECONDS - last_active)) -ge $((idle_min * 60)) ]; then
                echo "Nothing connected for ${idle_min} minutes."
                break
              fi
            fi

            # GitHub kills the job at 360 minutes. Stop in time to save, and let
            # a follow-up run take over if someone is still using the browser.
            if [ "$SECONDS" -ge $((cap_min * 60)) ]; then
              echo "Reached the ${cap_min} minute limit of one run."
              if [ $((SECONDS - last_active)) -lt $((idle_min * 60)) ]; then
                echo "continue=true" >> "$GITHUB_OUTPUT"
                echo "Still in use; a new run continues after this one saves."
              fi
              break
            fi
            sleep 10
          done

          echo "Session over."

      # Runs on cancel too, so the Cancel button saves like the stop tab does.
      # Chrome was started with setsid, so it outlives the cancelled step.
      - name: Stop Chrome
        if: ${{ always() && steps.chrome.outcome != 'skipped' }}
        run: |
          # TERM to the browser process only: it then closes its own children
          # and writes cookies, Preferences and the session file. Killing the
          # whole tree at once can leave the profile marked as crashed.
          pid="$(cat /tmp/chrome.pid 2>/dev/null || true)"
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            kill -TERM "$pid" || true
            for _ in $(seq 1 30); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
          fi
          pkill -KILL -f -- "--user-data-dir=$PROFILE_DIR" || true
          echo "Chrome stopped."
          # Upload the profile straight from the runner, not through the home link.
          sudo tailscale set --exit-node= >/dev/null 2>&1 || true

      - name: Save profile
        # Also after a cancel, but never when the restore itself failed or was
        # cancelled: that profile is empty and would replace the good save.
        if: ${{ always() && steps.chrome.outcome != 'skipped' && (steps.restore.outcome == 'success' || steps.restore.outcome == 'skipped') }}
        run: |
          set -euo pipefail
          # Nothing to save if Chrome never created a profile; keep the last save.
          if [ ! -s "$PROFILE_DIR/Local State" ]; then
            echo "::warning::No Chrome profile on disk; keeping the previous save."
            exit 0
          fi
          id="${{ github.run_id }}"
          mkdir -p /tmp/save
          cd /tmp/save
          # Caches are rebuilt on demand; leaving them out keeps the save small.
          # Release assets cap at 2 GiB each.
          tar -C "$PROFILE_DIR" -c --zstd \
            --exclude='Singleton*' \
            --exclude='*/Cache' \
            --exclude='*/Code Cache' \
            --exclude='*/GPUCache' \
            --exclude='*/DawnGraphiteCache' \
            --exclude='*/DawnWebGPUCache' \
            --exclude='*/Service Worker/CacheStorage' \
            --exclude='*/Service Worker/ScriptCache' \
            --exclude='GrShaderCache' \
            --exclude='GraphiteDawnCache' \
            --exclude='ShaderCache' \
            --exclude='component_crx_cache' \
            --exclude='extensions_crx_cache' \
            --exclude='Crashpad' \
            . \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:STATE_KEY \
            | split -b 1900M -d -a 3 - "state-${id}.part-"
          sha256sum state-"${id}".part-* > "state-${id}.sha256"
          gh release view "$STATE_TAG" -R "$PRIVATE_REPO" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" -R "$PRIVATE_REPO" --title "Chrome CDP state" \
              --notes "Encrypted Chrome profile saved by infrastructure-tools chrome-cdp-session." >/dev/null
          gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" state-"${id}".part-*
          gh release upload "$STATE_TAG" -R "$PRIVATE_REPO" "state-${id}.sha256"
          # Old sets go only after the new manifest is up, so a failed upload
          # never loses the last good save. tailscaled.state.enc is kept.
          gh release view "$STATE_TAG" -R "$PRIVATE_REPO" --json assets -q '.assets[].name' \
            | { grep '^state-' || true; } \
            | { grep -v "^state-${id}\." || true; } \
            | while read -r name; do
                gh release delete-asset "$STATE_TAG" "$name" -R "$PRIVATE_REPO" -y >/dev/null
              done
          echo "Profile saved."

      # Same inputs, so the next run picks up where this one left off. The
      # concurrency group holds it until this run has finished saving.
      - name: Continue in a new run
        if: ${{ success() && steps.chrome.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
          USE_EXIT_NODE: ${{ inputs.use_exit_node }}
          TIMEZONE: ${{ inputs.timezone }}
          LOCALE: ${{ inputs.locale }}
        run: |
          set -euo pipefail
          gh workflow run chrome-cdp-session.yaml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f idle_minutes="$IDLE_MINUTES" \
            -f fresh=false \
            -f use_exit_node="$USE_EXIT_NODE" \
            -f timezone="$TIMEZONE" \
            -f locale="$LOCALE"
          echo "Follow-up run dispatched."

      # `down`, not `logout`: logout would expire the saved identity and the
      # next run would come back as a new machine with a new IP.
      - name: Disconnect from the tailnet
        if: always()
        run: sudo tailscale down >/dev/null 2>&1 || true
