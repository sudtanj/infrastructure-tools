version: 2
updates:
  # Every builder-tools image; PRs from here are auto-merged once
  # "Validate Dockerfiles" passes (builder-tools-dependabot-auto-merge.yml).
  - package-ecosystem: docker
    directories:
      - /builder-tools/bitping
      - /builder-tools/earnfm
      - /builder-tools/github-runner
      - /builder-tools/honeygain
      - /builder-tools/kongming
      - /builder-tools/oci-freetier-creator
      - /builder-tools/oracle-cloud-free-tier-claimer
      - /builder-tools/packetstream
      - /builder-tools/paseo-codex
      - /builder-tools/paseo-lite
      - /builder-tools/pawns
      - /builder-tools/repocket
      - /builder-tools/tailscale
      - /builder-tools/traffmonetizer
      - /builder-tools/zilong-router
    schedule: { interval: weekly }
  # Actions used by the workflows. Not auto-merged: review these by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /builder-tools/xmrig
    schedule: { interval: weekly }
