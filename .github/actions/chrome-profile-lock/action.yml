name: Wait for the Chrome profile
description: >
  One Chrome on the saved chrome-cdp-state profile at a time, across workflows.
  Two at once look like one Google login on two machines, and the last to save
  overwrites the cookies the other one refreshed (which can sign the accounts
  out). Waits until no older unfinished run of a workflow below is left; older
  runs never wait for newer ones, so runs go one after another in start order.
  Queued runs count too (one may get its runner after a newer run), and a re-run
  is ordered by when it started again, not when the run was first made.
  The caller needs `permissions: actions: read` and should set
  `timeout-minutes` on the step. Other saved states (the Android ones) pass
  their own `workflows`.

inputs:
  workflows:
    description: Workflow file names (no .yaml) sharing the state, `|`-separated.
    # The workflows that start their own Chrome on the saved profile.
    default: chrome-cdp-session|typescript-worker-run|commute-traffic|job-hunter|search-engine-register|job-apply|shopee-search|tokopedia-search

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOWS: ${{ inputs.workflows }}
      run: |
        set -euo pipefail
        me="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -q .run_started_at)"
        # One request a minute: GITHUB_TOKEN allows 1,000 an hour per repo.
        while :; do
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" -q "[.workflow_runs[]
            | select(.status != \"completed\")
            | select(.path | test(\"workflows/(${WORKFLOWS})\\\\.ya?ml\"))
            | select(.id != ${GITHUB_RUN_ID} and (.run_started_at < \"${me}\" or (.run_started_at == \"${me}\" and .id < ${GITHUB_RUN_ID})))] | length")"
          [ "$ahead" -eq 0 ] && break
          echo "Another run is using the saved state; waiting."
          sleep 60
        done
