name: "Request Free Compute"

# ---------------------------------------------------------------------------
# COPY THIS FILE INTO THE PRIVATE REPO at .github/workflows/request-free-compute.yml
#
# It does nothing until two inputs are supplied:
#   1. Repo variable FREE_COMPUTE_BROKER       -> "owner/public-broker-repo"
#   2. Secret    FREE_COMPUTE_DISPATCH_TOKEN   -> token that can dispatch to
#                                                the public broker repo
#   3. Secret    FREE_COMPUTE_DISPATCH_SECRET  -> shared secret; must be
#                                                IDENTICAL to the one set on
#                                                the public broker repo
#
# Flow:  push here  ->  this workflow  ->  repository_dispatch  ->  public
#         broker repo checks out THIS repo and runs the allowlisted task.
#
# NOTE ON THE TOKEN: GITHUB_TOKEN cannot target another repository, so a
# separate credential is required. A fine-grained PAT limited to the public
# broker repo with "Contents: read" (it only creates workflow dispatches) is
# the usual choice. This file lives in the PRIVATE repo, so that secret is
# not exposed to the public side.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      task:
        description: "Task the broker should run"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - test
          - lint
          - docker-build

permissions:
  contents: read

concurrency:
  group: free-compute-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: "Dispatch to free compute broker"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve request
        id: req
        env:
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail

          BROKER="${FREE_COMPUTE_BROKER:-}"
          if [ -z "$BROKER" ]; then
            echo "::error::Repo variable FREE_COMPUTE_BROKER is not set (expected owner/repo)."
            exit 1
          fi
          # Same strict owner/name validation the broker applies.
          if ! printf '%s' "$BROKER" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::FREE_COMPUTE_BROKER must look like owner/name"
            exit 1
          fi

          # On manual runs honour the chosen task; on push default to build.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="$MANUAL_TASK"
          else
            TASK="build"
          fi

          # The broker validates this again, but fail early and cheaply.
          case "$TASK" in
            build|test|lint|docker-build) ;;
            *) echo "::error::Task '$TASK' not allowlisted"; exit 1 ;;
          esac

          echo "broker=$BROKER" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Sending: broker=$BROKER task=$TASK ref=${{ github.sha }}"

      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.FREE_COMPUTE_DISPATCH_TOKEN }}
          SHARED: ${{ secrets.FREE_COMPUTE_DISPATCH_SECRET }}
          BROKER: ${{ steps.req.outputs.broker }}
          TASK: ${{ steps.req.outputs.task }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret FREE_COMPUTE_DISPATCH_TOKEN is not set."
            exit 1
          fi
          if [ -z "$SHARED" ]; then
            echo "::error::Secret FREE_COMPUTE_DISPATCH_SECRET is not set."
            exit 1
          fi

          # Payload keys MUST match what the broker reads from
          # github.event.client_payload: target_repo, ref, task, shared_secret.
          #
          # Values are passed as JSON data, never interpolated into the URL.
          payload=$(jq -n \
            --arg tr "${{ github.repository }}" \
            --arg ref "${{ github.sha }}" \
            --arg task "$TASK" \
            --arg secret "$SHARED" \
            '{target_repo:$tr, ref:$ref, task:$task, shared_secret:$secret}')

          # NEVER echo the payload: it contains shared_secret and would land
          # in the run log. Log a redacted shape instead.
          echo "Dispatch payload: target_repo=${{ github.repository }} ref=${{ github.sha }} task=$TASK shared_secret=<redacted>"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${BROKER}/dispatches" \
            -f event_type=free-compute \
            --input - <<<"$payload"

          echo "Dispatched to $BROKER"
          echo "### Free compute requested" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Broker: \`$BROKER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Task: \`$TASK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"